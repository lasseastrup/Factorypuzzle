<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>RATIO — prototype</title>
<style>
  :root{
    --ink:#161d21; --ink-2:#2b363d; --panel:#eceae1; --panel-2:#dcd9cc;
    --line:#b6b2a3; --accent:#2f6f8f;
    --run:#2f9e6f; --starve:#d99a20; --throttle:#c9702c; --block:#c2402f; --stop:#8b8f8a;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#a8ada1;font-family:var(--ui);color:var(--ink)}
  canvas{display:block;touch-action:none}

  #docket{position:fixed;top:0;left:0;right:0;padding:10px 12px 9px;
    background:#141b1f;color:#e8e6dd;z-index:10;
    box-shadow:0 1px 0 rgba(255,255,255,.05), 0 6px 18px rgba(0,0,0,.22)}
  #dockBody{min-width:0}
  #lvName{display:inline-flex;align-items:center;gap:5px;border:0;background:none;padding:0;
    font:600 14px/1.2 var(--ui);color:#f2f0e8;cursor:pointer;letter-spacing:-.01em}
  #lvName::after{content:'';width:0;height:0;border:4px solid transparent;
    border-top-color:#7f8b84;margin-top:3px}
  #lvHint{font-size:11px;color:#98a39c;margin-top:3px;line-height:1.35;max-width:34em}
  #quotas{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .q{display:flex;align-items:center;gap:6px;background:#1e272c;border:1px solid #2e3a41;
     border-radius:12px;padding:4px 9px;font-family:var(--mono);font-size:11px}
  .q .sw{width:8px;height:8px;border-radius:1px}
  .q .got{color:#7f8b84}
  .q.met{border-color:#2f9e6f;background:#1b2f28}
  .q.met .got{color:#5fd0a8}

  #hold{margin-top:8px;height:18px;width:100%;position:relative;background:#1e272c;
    border:1px solid #2e3a41;border-radius:9px;overflow:hidden;cursor:pointer;padding:0;display:block}
  #holdBar{position:absolute;inset:0 auto 0 0;width:0;background:#2f6f4e;transition:width .1s linear}
  #hold span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:9px;letter-spacing:.04em;color:#cfe3d8}
  #hold.done #holdBar{background:#2f9e6f}
  #hold.wait #holdBar{background:#4a5a63}

  /* the only floating control, and it stays hidden until it applies */
  .tbtn{position:fixed;right:10px;bottom:124px;z-index:12;display:none;
    width:52px;height:52px;border:1px solid rgba(0,0,0,.14);background:rgba(252,251,247,.96);
    border-radius:26px;place-items:center;font:600 10px/1.15 var(--ui);
    letter-spacing:.03em;color:var(--ink);cursor:pointer;
    box-shadow:0 2px 8px rgba(20,26,30,.18)}
  .tbtn.show{display:grid}

  #tray{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--panel);
    border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(20,26,30,.12)}
  #trayScroll{display:flex;gap:6px;overflow-x:auto;padding:7px 8px;scrollbar-width:none}
  #trayScroll::-webkit-scrollbar{display:none}
  .card{flex:0 0 auto;width:86px;border:1px solid var(--line);border-radius:7px;
    background:#f6f4ed;padding:6px 7px;cursor:pointer;text-align:left}
  .card.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
  .card{position:relative}
  .cardDel{position:absolute;top:-1px;right:1px;width:18px;height:18px;line-height:17px;
    text-align:center;font-size:14px;color:#8b8f8a;cursor:pointer;border-radius:3px}
  .cardDel:hover{color:var(--block);background:rgba(0,0,0,.06)}
  .card .cn{font:600 10.5px/1.2 var(--ui)}
  .card .cr{font-family:var(--mono);font-size:9px;color:#6d7570;margin-top:3px;line-height:1.35}
  .card .bar{height:3px;border-radius:2px;margin-bottom:4px}
  #bar2{display:flex;gap:6px;padding:0 10px 9px;align-items:center}
  .mini{height:34px;padding:0 14px;border:1px solid var(--line);background:#f4f2ea;
    border-radius:17px;font:600 10.5px/1 var(--ui);letter-spacing:.03em;color:var(--ink-2);cursor:pointer}
  .mini.on{background:var(--ink);color:#f0eee5;border-color:var(--ink)}

  #insp{position:fixed;left:10px;bottom:116px;z-index:11;width:218px;background:var(--panel);
    border:1px solid var(--line);border-radius:7px;padding:10px 11px;display:none;
    box-shadow:0 8px 22px rgba(20,26,30,.18)}
  #insp h4{margin:0 0 5px;font:600 11.5px/1.2 var(--ui);padding-right:18px}
  .inspClose{position:absolute;top:5px;right:6px;width:22px;height:22px;border:0;background:none;
    font-size:17px;line-height:1;color:#8b8f8a;cursor:pointer;border-radius:4px;padding:0}
  #insp .row{display:flex;justify-content:space-between;font-family:var(--mono);
    font-size:10px;padding:2px 0;border-bottom:1px dotted #c9c5b6}
  #insp .row:last-of-type{border:0}
  #insp .why{margin-top:6px;font-size:10px;line-height:1.4;color:#4a534d;
    border-left:2px solid var(--throttle);padding-left:6px}
  #insp .acts{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
  #insp button{flex:1;min-width:56px;padding:5px 4px;border:1px solid var(--line);background:#f6f4ed;
    border-radius:2px;font:600 9px/1 var(--ui);letter-spacing:.05em;text-transform:uppercase;cursor:pointer}

  #report{position:fixed;inset:0;z-index:30;background:rgba(20,26,30,.82);display:none;
    align-items:center;justify-content:center;padding:18px}
  #rcard{background:var(--panel);border-radius:4px;padding:16px;width:100%;max-width:330px}
  #rcard h3{margin:0;font:600 15px/1.2 var(--ui)}
  #rcard .sub{font-size:10.5px;color:#6d7570;margin:3px 0 12px;line-height:1.4}
  .metric{margin-bottom:9px}
  .metric .top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px}
  .metric .track{height:5px;background:var(--panel-2);border-radius:3px;margin-top:3px;position:relative}
  .metric .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
  .metric .par{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--ink)}
  .metric .cap{font-size:9px;color:#6d7570;margin-top:2px}
  #rcard .acts{display:flex;gap:6px;margin-top:12px}
  #rcard button{flex:1;padding:10px;border:0;border-radius:3px;background:var(--ink);color:#f0eee5;
    font:600 11px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  #rcard button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}

  #labels{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
  #labels.on{display:block}
  .tag{position:absolute;transform:translate(-50%,-50%);font-family:var(--mono);font-size:9.5px;
    line-height:1.25;white-space:nowrap;padding:1px 4px;border-radius:2px;
    background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.16);color:#1d2529}
  .tag.bad{background:#fdecea;border-color:var(--block);color:#7d2318}
  .tag.warn{background:#fdf3e2;border-color:var(--throttle);color:#7a4413}
  .tag.ok{background:#e9f6ef;border-color:var(--run);color:#1b5b41}

  #toast{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);z-index:20;
    background:var(--ink);color:#f0eee5;padding:7px 12px;border-radius:3px;font-size:11px;
    opacity:0;transition:opacity .18s;pointer-events:none;max-width:78vw;text-align:center}
  #toast.on{opacity:1}

  #levelBar{position:fixed;left:8px;z-index:10;display:flex;gap:4px}
  .lv{width:26px;height:26px;border:1px solid var(--line);background:var(--panel);border-radius:2px;
    font-family:var(--mono);font-size:10px;cursor:pointer;display:grid;place-items:center;padding:0}
  .lv.on{background:var(--ink);color:#f0eee5;border-color:var(--ink)}
  .lv.done{border-color:var(--run);color:var(--run)}
  .lv.done.on{color:#5fd0a8}

  #menu{position:fixed;left:12px;z-index:14;display:none;background:var(--panel);
    border:1px solid var(--line);border-radius:7px;padding:5px;min-width:196px;
    box-shadow:0 10px 26px rgba(20,26,30,.24)}
  #menu.show{display:block}
  #menu button{display:flex;width:100%;justify-content:space-between;align-items:center;
    border:0;background:none;text-align:left;padding:8px 9px;border-radius:4px;
    font:500 12px/1.2 var(--ui);color:var(--ink);cursor:pointer}
  #menu button.on{font-weight:700}
  #menu button em{font-family:var(--mono);font-size:9.5px;font-style:normal;color:#7d8279}
  #menu hr{border:0;border-top:1px solid var(--panel-2);margin:5px 2px}
  #menu button.danger{color:var(--block)}

  #crumbs{position:fixed;left:8px;z-index:10;display:none;align-items:center;gap:5px;
    background:rgba(236,234,225,.94);border:1px solid var(--line);border-radius:3px;padding:3px 6px}
  #crumbs button{border:0;background:none;font:600 10px/1 var(--ui);letter-spacing:.04em;
    text-transform:uppercase;color:var(--accent);cursor:pointer;padding:2px 3px}
  #crumbs button:last-child{color:var(--ink)}
  #crumbs span{color:#9a9a92;font-size:11px}

  #ruler{position:fixed;left:8px;bottom:78px;z-index:10;font-family:var(--mono);font-size:9px;
    color:#3b443e;background:rgba(236,234,225,.85);border:1px solid var(--line);border-radius:2px;
    padding:3px 6px;display:none}
  #ruler.on{display:block}

  #fatal{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:99;
    max-width:300px;background:#fdecea;border:1px solid var(--block);border-left-width:3px;
    border-radius:3px;padding:11px 13px;font-size:12px;line-height:1.45;color:#7d2318}
  #fatal b{display:block;margin-bottom:4px}
  #fatal span{display:block;font-family:var(--mono);font-size:10px;opacity:.75;margin-top:5px;word-break:break-all}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="labels"></div>
<div id="docket">
  <div id="dockBody">
    <button id="lvName">—</button>
    <div id="lvHint">—</div>
    <div id="quotas"></div>
    <button id="hold"><div id="holdBar"></div><span id="holdText"></span></button>
  </div>
</div>
<div id="crumbs"></div>
<div id="menu"></div>
<!-- Rotate is the only floating control, and it only exists while it applies. -->
<button class="tbtn" id="rotBtn">Turn</button>
<div id="insp"></div>
<div id="tray">
  <div id="trayScroll"></div>
  <div id="bar2">
    <button class="mini" id="plannerBtn">Show rates</button>
  </div>
</div>
<div id="report"><div id="rcard"></div></div>
<div id="toast"></div>

<script>
window.__fatal = function (msg, detail) {
  var el = document.getElementById('fatal');
  if (!el) { el = document.createElement('div'); el.id = 'fatal'; document.body.appendChild(el); }
  el.innerHTML = '<b>' + msg + '</b>' + (detail ? '<span>' + detail + '</span>' : '');
  el.style.display = 'block';
};
window.addEventListener('error', function (e) {
  window.__fatal(e.message || 'Script error', (e.filename || '') + (e.lineno ? ':' + e.lineno : ''));
});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

if (typeof THREE === 'undefined') {

/*__SIM__*/

/* ============================================================
   LEVELS. Positions are metres now, not tiles. Machine footprints
   are metres too, so "1 tile" from the old build reads as "1 m".

const LEVELS = [

            { x: 13.6, z: 5.4, r: 0.7 }, { x: 13.6, z: 12.6, r: 0.7 }],
    quota: { reinf: 10 },
    tech: ['miner', 'smelter', 'constructor', 'assembler', 'splitter', 'merger'], belts: [1, 2],

  { id: 'Twin', name: 'Two products, one node', rung: 4,
    hint: 'One node, two products. A machine has one output, so place a Splitter to divide it.',
    w: 19, h: 16,
    nodes: [{ x: 3, z: 8, rate: 60 }],
    depot: { x: 15.5, z: 8 },
    rocks: [{ x: 9, z: 3.4, r: 0.8 }, { x: 9, z: 12.6, r: 0.8 }, { x: 12, z: 8, r: 0.65 }],
    quota: { plate: 20, rod: 30 },
    tech: ['miner', 'smelter', 'constructor', 'splitter', 'merger'], belts: [1, 2],

  { id: 'Plant', name: 'Smelting plant', rung: 4,
    hint: '120 ore a minute into four smelters, and the Depot takes ONE belt \u2014 so merge before you deliver. A good candidate for a factory.',

    tech: ['miner', 'smelter', 'splitter', 'merger'], belts: [1, 2],
    par: { machines: 6, belt: 58, ore: 120 } },

    hint: 'Six smelters along one corridor. Run a single fast trunk past them all and tap it with Splitters \u2014 Mk3 carries 240/min. Depot takes two belts.',

  { id: 'Balance', name: 'Balanced load', rung: 6,
    hint: 'Mk1 belts only. No single belt can carry 180/min, so split at the source and keep every line under 60. Two smelters per merger.',

    depot: { x: 21, z: 9.5 }, depotPorts: 3,

    hint: 'Three identical ore-to-plate blocks. Build one factory, then place three copies of it. 90 ore in, 60 plates out on one belt.',

];

const MACHINE_COLOR = {
  miner: 0x474d52, smelter: 0x9c4b36, constructor: 0x3d6a89,
  assembler: 0xa2833c, splitter: 0x5c6660, merger: 0x5c6660, sink: 0x2e5a48,
  factory: 0x4a5b63, termIn: 0x4d7a4f, termOut: 0x7a4d4d,
};
const STATE_COLOR = {
  running: 0x2f9e6f, starved: 0xd99a20, throttled: 0xc9702c,
  blocked: 0xc2402f, stopped: 0x8b8f8a, idle: 0x8b8f8a, passive: 0x8b8f8a,
};

/* Visual belt speed is tuned, not derived (§5.1). The rate an item passes a point
   is BELT_SPEED / spacing, and spacing is BELT_SPEED * 60 / flow, so the two
   cancel and the visible rate always equals the real one no matter what this is
   set to. Lowering it does not lie about throughput — it just spaces items closer
   together and moves them slower, which is what makes 30/min legible as a pulse
   every two seconds instead of a single object flashing past. */
const BELT_SPEED = 1.9;        // m/s
const BELT_HW = 0.15;          // half width of the moving surface
const RAIL_HW = 0.035;         // side rails are strips, not more belt
const BELT_TEX_PERIOD = 0.38;  // metres per cleat
const JAM_SPACING = 0.42;      // packed spacing when a belt has backed up
const BELT_Y = 0.075;
const MAX_ITEMS_PER_TYPE = 900;   // a fully packed factory can hold a lot of one item
const CLEARANCE = 0.34;        // how close a belt may pass a machine or rock
const STROKE_MIN_STEP = 0.16;  // sampling distance while painting
const SIMPLIFY_EPS = 0.24;     // how much finger wobble to discard
const RESAMPLE = 0.3;
const MIN_RADIUS = 0.7;        // conveyors cannot turn on a dime, but a sweeping
                               // curve eats the straight runs that read as a factory
const SMOOTH_CAPS = [40, 20, 10, 4, 0];  // smoothing passes, strongest tried first
const SNAP_RADIUS = 2.2;       // how near a port a stroke must start or end
const BUMP_H = 0.46, BUMP_SIG = 0.62;  // over-under at a crossing
const ENDPOINT_GUARD = 0.55;   // convergence near a shared port is not a crossing

/* ============================================================
   STATE
   ============================================================ */
let L = null, lvIndex = 0;

/* ---- factory designs ----
   A design is just { name, w, h, entities, links }. Placing one deep-copies it onto
   the instance, so every placement is independent: editing a placed factory changes
   only that box, and editing the library entry changes only future placements. That
   costs the "improve once, improve everywhere" property, and buys a model with no
   editing-at-a-distance and no forked-definition bookkeeping.

   Designs live in memory for the session. A static page has nowhere to persist them. */
const library = [];
let libSeq = 0;
const INTERIOR_W = 13, INTERIOR_H = 10;

/* The editing context: the level, or the inside of some factory. Entering pushes,
   exiting pops. Everything below operates on whatever is on top. */
let ctx = null;              /* { kind, ents, links, w, h, ent?, design? } */
const ctxStack = [];
const inFactory = () => ctx && ctx.kind === 'factory';
/* path of instance ids from the level down to here, used to read this instance's
   own rates out of the flattened solve */
const viewPath = () => ctxStack.concat([ctx]).filter((c) => c && c.kind === 'factory')
  .map((c) => c.ent.id).join('/');
const solved = {};
let ents = [], links = [], nextId = 1;
let tool = 'select', pickedType = null, pickedRecipe = null, pickedRot = 0, beltTier = 1;
let selected = null, result = null, plannerOn = false;
let beltFrom = null;      /* first machine tapped while the Belt card is armed */
/* The factory never stops. clockT is a monotonic clock; editT marks the last
   topology change; steadyAt is when the pipeline will have physically filled.
   A level is completed by holding quota for HOLD_REQUIRED seconds after that,
   which is why there is no play button: the verification is the factory simply
