  g.fillRect(0, 0, 8, 128);
  const t = new THREE.CanvasTexture(c);
  scene.background = t;
})();

/* Intensities are chosen so that hemisphere + sun + fill on an up-facing surface
   sums to just under 1.0. Stacking them past that silently clips every pale
   surface to pure white, which is what happened to the concrete slab.
   test/harness.js asserts the sum, so it cannot drift again unnoticed. */
scene.add(new THREE.HemisphereLight(0xdce9f2, 0x6d6a54, 0.45));

const sun = new THREE.DirectionalLight(0xfff2d8, 0.68);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.02;
scene.add(sun);
scene.add(sun.target);

/* a dim fill from the opposite side so shadowed faces do not go to mud */
const fill = new THREE.DirectionalLight(0xc8d8e8, 0.10);
fill.position.set(16, 14, -12);
scene.add(fill);

/* The shadow camera must actually contain the plot or shadows silently vanish at
   the edges. Sized from the level on load rather than guessed once. */
function aimSun() {
  const cx = L ? L.w / 2 : 8, cz = L ? L.h / 2 : 8;
  const span = L ? Math.max(L.w, L.h) : 20;
  sun.target.position.set(cx, 0, cz);
  sun.position.set(cx - span * 0.55, span * 1.15, cz + span * 0.62);
  const r = span * 0.95;
  const s = sun.shadow.camera;
  s.left = -r; s.right = r; s.top = r; s.bottom = -r;
  s.near = 0.5; s.far = span * 3.2;
  s.updateProjectionMatrix();
}

const world = new THREE.Group();
scene.add(world);
const gPad = new THREE.Group(), gMachines = new THREE.Group(), gBelts = new THREE.Group(),
      gRings = new THREE.Group(), gItems = new THREE.Group(), gGhost = new THREE.Group(),
      gEnv = new THREE.Group();
world.add(gEnv, gPad, gBelts, gMachines, gRings, gItems, gGhost);

/* deterministic scatter, so the landscape is identical every reload */
function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

const raycaster = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

function clear(g) {
  while (g.children.length) {
    const c = g.children.pop();
    if (c.geometry) c.geometry.dispose();
    if (c.material) (Array.isArray(c.material) ? c.material : [c.material]).forEach((m) => m.dispose());
  }
}

/* ============================================================
   PLOT — no grid. The edge is a ruler instead, because the
   currency is metres of belt.
   ============================================================ */
function buildPad() {
  clear(gPad);
  clear(gEnv);
  aimSun();

  /* ---- concrete slab: the buildable plot, with a chamfered rim ---- */
  const slabH = 0.55;
  const slab = new THREE.Mesh(new THREE.BoxGeometry(L.w, slabH, L.h),
    new THREE.MeshLambertMaterial({ color: 0xc6c3b4 }));
  slab.position.set(L.w / 2, -slabH / 2 + 0.02, L.h / 2);
  slab.receiveShadow = true;
  gPad.add(slab);

  /* a slightly wider, darker apron so the slab reads as poured, not floating */
  const apron = new THREE.Mesh(new THREE.BoxGeometry(L.w + 0.9, 0.34, L.h + 0.9),
    new THREE.MeshLambertMaterial({ color: 0xa89f8c }));
  apron.position.set(L.w / 2, -0.34, L.h / 2);
  apron.receiveShadow = true;
  gPad.add(apron);

  /* ---- ruler ticks along the slab edge: the currency is metres ---- */
  const ticks = [];
  const y = 0.025;
  for (let x = 0; x <= L.w; x++) { const t = x % 5 === 0 ? 0.66 : 0.28; ticks.push(x, y, 0, x, y, t, x, y, L.h, x, y, L.h - t); }
  for (let z = 0; z <= L.h; z++) { const t = z % 5 === 0 ? 0.66 : 0.28; ticks.push(0, y, z, t, y, z, L.w, y, z, L.w - t, y, z); }
  const tg = new THREE.BufferGeometry();
  tg.setAttribute('position', new THREE.Float32BufferAttribute(ticks, 3));
  gPad.add(new THREE.LineSegments(tg, new THREE.LineBasicMaterial({ color: 0x8d8b7d })));

  /* ---- terrain the slab sits in ---- */
  const PAD = 34;
  const seg = 44;
  const gw = L.w + PAD * 2, gh = L.h + PAD * 2;
  const ground = new THREE.PlaneGeometry(gw, gh, seg, seg);
  ground.rotateX(-Math.PI / 2);
  const pos = ground.attributes.position;
  const col = [];
  const r0 = rng(1337);
  const noise = [];
  for (let i = 0; i < (seg + 1) * (seg + 1); i++) noise.push(r0());
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i) + L.w / 2, z = pos.getZ(i) + L.h / 2;
    /* stay perfectly flat under and near the slab, roll gently further out */
    const outX = Math.max(0, Math.max(-x, x - L.w));
    const outZ = Math.max(0, Math.max(-z, z - L.h));
    const out = Math.hypot(outX, outZ);
    const ramp = Math.min(1, Math.max(0, (out - 3) / 16));
    const n = noise[i % noise.length];
    pos.setY(i, -0.5 + ramp * (n * 2.6 - 0.6) * 1.15);
    const g = 0.5 + n * 0.16 + ramp * 0.06;
    col.push(0.40 * g + 0.10, 0.44 * g + 0.09, 0.30 * g + 0.07);
  }
  ground.computeVertexNormals();
  ground.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  const groundMesh = new THREE.Mesh(ground,
    new THREE.MeshLambertMaterial({ vertexColors: true }));
  groundMesh.position.set(L.w / 2, 0, L.h / 2);
  groundMesh.receiveShadow = true;
  gEnv.add(groundMesh);

  /* ---- scattered boulders and scrub outside the plot ---- */
  const rr = rng(90210);
  const bould = [], tuft = [];
  for (let i = 0; i < 200; i++) {
    const x = -PAD + rr() * (L.w + PAD * 2), z = -PAD + rr() * (L.h + PAD * 2);
    const outside = x < -2.4 || z < -2.4 || x > L.w + 2.4 || z > L.h + 2.4;
    if (!outside) continue;
    (rr() < 0.42 ? bould : tuft).push([x, z, 0.4 + rr() * 1.5, rr() * 6.28]);
  }
  if (bould.length) {
    const m = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1, 0),
      new THREE.MeshLambertMaterial({ color: 0x87897c }), bould.length);
    const mx = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
    bould.forEach(([x, z, s, a], i) => {
      e.set(a * 0.3, a, a * 0.2); q.setFromEuler(e);
      mx.compose(new THREE.Vector3(x, -0.35 + s * 0.3, z), q, new THREE.Vector3(s * 0.6, s * 0.45, s * 0.6));
      m.setMatrixAt(i, mx);
    });
    m.receiveShadow = true;
    gEnv.add(m);
  }
  if (tuft.length) {
    const m = new THREE.InstancedMesh(new THREE.ConeGeometry(0.42, 1.5, 5),
      new THREE.MeshLambertMaterial({ color: 0x5f6b45 }), tuft.length);
    const mx = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
    tuft.forEach(([x, z, s, a], i) => {
      e.set(0, a, 0); q.setFromEuler(e);
      mx.compose(new THREE.Vector3(x, -0.4 + s * 0.5, z), q, new THREE.Vector3(s, s * 1.3, s));
      m.setMatrixAt(i, mx);
    });
    gEnv.add(m);
  }

  /* ---- ore nodes: a cluster of exposed ore, not a plain disc ---- */
  for (const n of L.nodes) {
    const pit = new THREE.Mesh(new THREE.CylinderGeometry(1.16, 1.02, 0.18, 28),
      new THREE.MeshLambertMaterial({ color: 0x6a5b4a }));
    pit.position.set(n.x, 0.05, n.z);
    pit.receiveShadow = true;
    gPad.add(pit);
    const nr = rng(Math.round(n.x * 97 + n.z * 31));
    for (let i = 0; i < 9; i++) {
      const a = nr() * 6.283, d = nr() * 0.82, s = 0.15 + nr() * 0.2;
      const lump = new THREE.Mesh(new THREE.IcosahedronGeometry(s, 0),
        new THREE.MeshLambertMaterial({ color: n.rate >= 60 ? 0xa8734a : 0x8d7b6b }));
      lump.position.set(n.x + Math.cos(a) * d, 0.13 + s * 0.5, n.z + Math.sin(a) * d);
      lump.rotation.set(a, a * 1.7, a * 0.4);
      lump.castShadow = true;
      gPad.add(lump);
    }
    const s = makeSprite(n.rate + '/min');
    s.position.set(n.x, 1.05, n.z);
    gPad.add(s);
  }

  /* ---- obstacle rocks on the plot ---- */
  for (const r of L.rocks) {
    const g = new THREE.Group();
    const main = new THREE.Mesh(new THREE.DodecahedronGeometry(r.r, 0),
      new THREE.MeshLambertMaterial({ color: 0x8b8d83 }));
    main.position.y = r.r * 0.62;
    main.rotation.set(r.x, r.z, 0.4);
    main.scale.set(1, 0.82, 1);
    main.castShadow = true; main.receiveShadow = true;
    g.add(main);
    const chip = new THREE.Mesh(new THREE.DodecahedronGeometry(r.r * 0.42, 0),
      new THREE.MeshLambertMaterial({ color: 0x9a9c91 }));
    chip.position.set(r.r * 0.72, r.r * 0.28, -r.r * 0.5);
    chip.rotation.set(r.z, r.x, 1.1);
    chip.castShadow = true;
    g.add(chip);
    g.position.set(r.x, 0, r.z);
    gPad.add(g);
  }
}

function makeSprite(text) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  g.font = '700 34px ui-monospace, Menlo, monospace';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#2b241c';
  g.fillText(text, 128, 32);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
  sp.scale.set(2.6, 0.65, 1);
  return sp;
}

/* ============================================================
   PLACEMENT
   ============================================================ */
function canPlace(type, x, z, rot, ignore) {
  const probe = { type, x, z, rot };
  if (!inPlot(probe)) return 'Outside the plot.';
  const b = boxOf(probe);
  for (const o of ents) {
    if (o === ignore) continue;
    if (boxesOverlap(b, boxOf(o))) return 'That overlaps ' + MACHINES[o.type].name + '.';
  }
  for (const r of L.rocks) {
    if (inBox({ x: r.x, z: r.z }, { x0: b.x0 - r.r, x1: b.x1 + r.r, z0: b.z0 - r.r, z1: b.z1 + r.r })) return 'There is a rock there.';
  }
  const bi = boxOf(probe, BELT_HW);
  for (const l of links) {
    for (const p of l.path) if (inBox(p, bi)) return 'A belt runs through there.';
  }
  if (MACHINES[type].kind === 'miner') {
    const n = L.nodes.find((n) => dist2(n, { x, z }) < 1.1 * 1.1);
    if (!n) return 'A miner must sit on an ore node.';
  }
  return null;
}

function addEntity(type, x, z, rot) {
  const def = MACHINES[type];
  const e = { id: 'e' + (nextId++), type, x, z, rot: rot || 0, recipe: def.recipes[0] ? def.recipes[0].id : null };
  if (def.kind === 'miner') {
    const n = L.nodes.find((n) => dist2(n, { x, z }) < 1.4 * 1.4);
    e.x = n ? n.x : x; e.z = n ? n.z : z;
    e.nodeRate = n ? n.rate : 30;
  }
  ents.push(e);
  return e;
}
function removeEntity(e) {
  ents = ents.filter((x) => x !== e);
  links = links.filter((l) => l.from !== e.id && l.to !== e.id);
}
const entById = (id) => ents.find((e) => e.id === id);

function entAt(p) {
  for (const e of ents) if (inBox(p, boxOf(e, 0.1))) return e;
  return null;
}
function beltAt(p) {
  for (const l of links) if (distToPath(p, l.path) < BELT_HW + 0.18) return l;
  return null;
}

/* ============================================================
   BELT PAINTING
   ============================================================ */
function outItemOf(e, depth) {
  if (!e || (depth || 0) > 12) return null;
  const d = MACHINES[e.type];
  if (d.kind === 'splitter' || d.kind === 'merger') {
    const up = links.find((l) => l.to === e.id);
    return up ? outItemOf(entById(up.from), (depth || 0) + 1) : null;
  }
  const r = recipeOf(e);
  return (r && Object.keys(r.out)[0]) || null;
}

/* which output port is still free? */
function freeOutPort(e) {
  const ports = portsOf(e).out;
  const used = links.filter((l) => l.from === e.id).map((l) => l.fromPort);
  for (let i = 0; i < ports.length; i++) if (!used.includes(i)) return i;
  return -1;
}
/* which input port accepts this item? */
function freeInPort(e, item) {
  const P = portsOf(e);
  const used = links.filter((l) => l.to === e.id).map((l) => l.toPort);
  for (let i = 0; i < P.in.length; i++) {
    if (used.includes(i)) continue;
    const want = P.inItems[i];
    if (want == null || want === item) return i;
  }
  return -1;
}

function portError(a, b, item) {
  const da = MACHINES[a.type], db = MACHINES[b.type];
  if (a === b) return 'A belt needs two different machines.';
  if (da.kind === 'sink') return 'The depot only receives.';
  if (db.kind === 'miner') return 'A miner takes no input.';
  if (freeOutPort(a) < 0) {
    return da.kind === 'splitter'
      ? 'That splitter is full — three outputs is the limit.'
      : da.name + ' has one output port. Place a splitter to fan the line out.';
  }
  if (db.kind !== 'sink' && db.kind !== 'splitter' && db.kind !== 'merger') {
    const r = recipeOf(b);
    if (!r || !Object.keys(r.in).length) return db.name + ' takes no input.';
    if (item && !r.in[item]) return db.name + ' has no use for ' + ITEMS[item].name + '.';
  }
  if (freeInPort(b, item) < 0) {
    if (db.kind === 'merger') return 'That merger is full — three inputs is the limit.';
    if (db.kind === 'splitter') return 'A splitter takes one input. Use a merger to combine lines.';
    return item ? 'The ' + ITEMS[item].name + ' port is already taken.' : 'All input ports are taken.';
  }
  return null;
}

/* Does a painted route keep clear of everything it should? */
function routeBlocked(pts, srcEnt, dstEnt) {
  for (const e of ents) {
    if (e === srcEnt || e === dstEnt) continue;
    const b = boxOf(e, CLEARANCE);
    for (const p of pts) if (inBox(p, b)) return 'The route runs into ' + MACHINES[e.type].name + '.';
  }
  for (const r of L.rocks) {
    const rr = (r.r + CLEARANCE) ** 2;
    for (const p of pts) if (dist2(p, r) < rr) return 'The route clips a rock.';
  }
  for (const p of pts) {
    if (p.x < 0.2 || p.z < 0.2 || p.x > L.w - 0.2 || p.z > L.h - 0.2) return 'The route leaves the plot.';
  }
  return null;
}

/* Turn a raw finger stroke into a conveyor: simplify, round the corners,
   then keep smoothing until it respects a minimum turn radius. */
function finishStroke(raw, a, aPort, b, bPort) {
  const P = { a: portsOf(a).out[aPort], b: portsOf(b).in[bPort] };
  let pts = [P.a].concat(raw.filter((p) => dist2(p, P.a) > 0.3 * 0.3 && dist2(p, P.b) > 0.3 * 0.3)), out;
  pts.push(P.b);
  pts = simplify(pts, SIMPLIFY_EPS);
  let iters = 2;
  do {
    out = resample(chaikin(pts, iters), RESAMPLE);
    iters++;
  } while (minRadius(out) < MIN_RADIUS && iters <= 6);
  return out;
}

function commitStroke(raw, endPoint) {
  const a = stroke.fromEnt;
  const item = outItemOf(a);
  /* find the target: whatever machine the stroke ended on or nearest to */
  let b = entAt(endPoint);
  if (!b) {
    let best = null, bd = SNAP_RADIUS * SNAP_RADIUS;
    for (const e of ents) {
      if (e === a) continue;
      for (const p of portsOf(e).in) {
        const d = dist2(p, endPoint);
        if (d < bd) { bd = d; best = e; }
      }
    }
    b = best;
  }
  if (!b) return toast('End the stroke on a machine.');
  const pe = portError(a, b, item);
  if (pe) return toast(pe);
  const bPort = freeInPort(b, item), aPort = stroke.fromPort;
  const pts = finishStroke(raw, a, aPort, b, bPort);
  const blocked = routeBlocked(pts, a, b);
  if (blocked) return toast(blocked);
  const arc = arcTable(pts);
  const len = arc[arc.length - 1];
  if (len < 0.4) return toast('Too short to be a belt.');
  const tier = BELTS.find((t) => t.id === beltTier) || BELTS[0];
  links.push({ id: 'l' + (nextId++), from: a.id, to: b.id, fromPort: aPort, toPort: bPort,
               cap: tier.cap, tier: tier.id, path: pts, arc, length: len, bumps: [] });
  computeCrossings();
  resolve();
  toast('Belt ' + tier.name + ' · ' + len.toFixed(1) + ' m');
}

/* Where two belts cross, the later one ramps over. This is what the third
   dimension is for (§5.2). */
function computeCrossings() {
  for (const l of links) l.bumps = [];
  for (let i = 0; i < links.length; i++) {
    for (let j = i + 1; j < links.length; j++) {
      const A = links[i], B = links[j];
      for (let x = 0; x < A.path.length - 1; x++) {
        for (let y = 0; y < B.path.length - 1; y++) {
          const hit = segHit(A.path[x], A.path[x + 1], B.path[y], B.path[y + 1]);
          if (!hit) continue;
          const sA = A.arc[x] + hit.t * (A.arc[x + 1] - A.arc[x]);
          const sB = B.arc[y] + hit.u * (B.arc[y + 1] - B.arc[y]);
          /* Two runs feeding the same machine converge near their ports; that is not a
             crossing to ramp over. Guard by distance from each end, not by topology —
             belts sharing a machine can still genuinely cross out in the open. */
          if (sA < ENDPOINT_GUARD || sA > A.length - ENDPOINT_GUARD) continue;
          if (sB < ENDPOINT_GUARD || sB > B.length - ENDPOINT_GUARD) continue;
          if (!B.bumps.some((bp) => Math.abs(bp.s - sB) < 0.7)) B.bumps.push({ s: sB });
        }
      }
    }
  }
}
function segHit(p1, p2, p3, p4) {
  const d1x = p2.x - p1.x, d1z = p2.z - p1.z, d2x = p4.x - p3.x, d2z = p4.z - p3.z;
  const den = d1x * d2z - d1z * d2x;
  if (Math.abs(den) < 1e-9) return null;
  const t = ((p3.x - p1.x) * d2z - (p3.z - p1.z) * d2x) / den;
  const u = ((p3.x - p1.x) * d1z - (p3.z - p1.z) * d1x) / den;
  if (t < 0 || t > 1 || u < 0 || u > 1) return null;
  return { t, u };
}
function yAt(l, s) {
  let y = BELT_Y;
  for (const b of l.bumps) y += BUMP_H * Math.exp(-((s - b.s) ** 2) / (2 * BUMP_SIG * BUMP_SIG));
  return y;
}

/* ============================================================
   RENDER
   ============================================================ */
/* ---- machine bodies ----
   Each type gets its own silhouette. Colour alone does not survive being shrunk
   to thumb size on a phone, and pillar 4 asks for identification at a glance.
   Moving parts are stashed on userData so the frame loop can animate them
   without rebuilding geometry. */
const MAT = (c) => new THREE.MeshLambertMaterial({ color: c });
const STEEL = 0xc9c5b6, DARK = 0x272c2e, TRIM = 0xa39b86;

function part(group, geo, mat, x, y, z, shadow) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  if (shadow !== false) { m.castShadow = true; m.receiveShadow = true; }
  group.add(m);
  return m;
}

function buildMachines() {
  clear(gMachines);
  for (const e of ents) {
    const def = MACHINES[e.type], b = boxOf(e);
    const g = new THREE.Group();
    g.position.set(e.x, 0, e.z);
    g.rotation.y = machineYaw(e);   /* local +Z is the output face */
    const anim = {};
    const body = MAT(MACHINE_COLOR[e.type]);
    /* footprint in local space: depth along Z, width along X */
    const w = def.w, d = def.h;

    if (def.kind === 'miner') {
      part(g, new THREE.BoxGeometry(w - 0.2, 0.4, d - 0.2), body, 0, 0.2, 0);
      /* four legs and a drill tower */
      for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
        part(g, new THREE.BoxGeometry(0.16, 0.9, 0.16), MAT(DARK), sx * (w / 2 - 0.28), 0.45, sz * (d / 2 - 0.28));
      }
      part(g, new THREE.BoxGeometry(w - 0.55, 0.5, d - 0.55), body, 0, 1.05, 0);
      anim.drum = part(g, new THREE.CylinderGeometry(0.34, 0.34, 0.62, 12), MAT(TRIM), 0, 1.55, 0);
      anim.drum.rotation.z = Math.PI / 2;
      part(g, new THREE.ConeGeometry(0.26, 0.7, 8), MAT(DARK), 0, 0.5, 0);
      part(g, new THREE.BoxGeometry(0.34, 0.2, 0.5), MAT(DARK), 0, 0.45, d / 2 - 0.1);

    } else if (e.type === 'smelter') {
      part(g, new THREE.BoxGeometry(w - 0.18, 0.75, d - 0.18), body, 0, 0.375, 0);
      /* firebox mouth glows when it is actually running */
      anim.glow = part(g, new THREE.BoxGeometry(w * 0.5, 0.26, 0.08),
        new THREE.MeshBasicMaterial({ color: 0x2a1a12 }), 0, 0.34, d / 2 - 0.06, false);
      part(g, new THREE.CylinderGeometry(0.2, 0.26, 1.15, 10), MAT(0x6d5f52), -w / 2 + 0.42, 1.2, -d / 2 + 0.42);
      part(g, new THREE.CylinderGeometry(0.26, 0.2, 0.16, 10), MAT(DARK), -w / 2 + 0.42, 1.85, -d / 2 + 0.42);
      part(g, new THREE.BoxGeometry(w * 0.42, 0.3, d * 0.42), MAT(STEEL), w * 0.15, 0.9, 0);
      anim.puff = part(g, new THREE.SphereGeometry(0.3, 8, 6),
        new THREE.MeshLambertMaterial({ color: 0xd8d2c4, transparent: true, opacity: 0.5 }),
        -w / 2 + 0.42, 2.15, -d / 2 + 0.42, false);

    } else if (e.type === 'constructor') {
      part(g, new THREE.BoxGeometry(w - 0.18, 0.5, d - 0.18), body, 0, 0.25, 0);
      part(g, new THREE.BoxGeometry(w - 0.5, 0.32, d - 1.1), MAT(STEEL), 0, 0.66, 0);
      /* gantry with a press head that strokes up and down */
      for (const sx of [-1, 1]) part(g, new THREE.BoxGeometry(0.14, 0.95, 0.14), MAT(DARK), sx * (w / 2 - 0.24), 0.97, 0);
      part(g, new THREE.BoxGeometry(w - 0.3, 0.16, 0.4), MAT(DARK), 0, 1.42, 0);
      anim.press = part(g, new THREE.BoxGeometry(w - 0.72, 0.3, 0.5), MAT(TRIM), 0, 1.05, 0);
      part(g, new THREE.BoxGeometry(0.3, 0.18, 0.44), MAT(DARK), 0, 0.4, d / 2 - 0.08);

    } else if (e.type === 'assembler') {
      part(g, new THREE.BoxGeometry(w - 0.18, 0.46, d - 0.18), body, 0, 0.23, 0);
      part(g, new THREE.BoxGeometry(w - 0.7, 0.14, d - 0.7), MAT(0x3a3f41), 0, 0.53, 0);
      /* two arms that sweep in opposite directions */
      for (const s of [-1, 1]) {
        const post = new THREE.Group();
        post.position.set(s * (w / 2 - 0.62), 0.6, s * 0.5);
        part(post, new THREE.CylinderGeometry(0.17, 0.2, 0.5, 10), MAT(DARK), 0, 0.25, 0);
        const arm = new THREE.Group();
        arm.position.y = 0.5;
        part(arm, new THREE.BoxGeometry(0.9, 0.13, 0.16), MAT(TRIM), 0.45, 0, 0);
        part(arm, new THREE.BoxGeometry(0.2, 0.26, 0.2), MAT(STEEL), 0.9, -0.08, 0);
        post.add(arm);
        g.add(post);
        (anim.arms = anim.arms || []).push(arm);
      }
      part(g, new THREE.BoxGeometry(w * 0.5, 0.34, 0.3), MAT(STEEL), 0, 0.68, -d / 2 + 0.3);
      part(g, new THREE.BoxGeometry(0.34, 0.2, 0.4), MAT(DARK), 0, 0.4, d / 2 - 0.1);

    } else if (def.kind === 'splitter' || def.kind === 'merger') {
      part(g, new THREE.CylinderGeometry(0.46, 0.5, 0.3, 6), body, 0, 0.15, 0);
      part(g, new THREE.CylinderGeometry(0.2, 0.2, 0.1, 8), MAT(STEEL), 0, 0.33, 0);

    } else if (def.kind === 'sink') {
      /* a depot shed, open toward the plot */
      part(g, new THREE.BoxGeometry(w, 0.22, d), MAT(0x8e8b7a), 0, 0.11, 0);
      part(g, new THREE.BoxGeometry(w - 0.1, 0.9, 0.16), body, 0, 0.55, -d / 2 + 0.08);
      for (const s of [-1, 1]) part(g, new THREE.BoxGeometry(0.16, 0.9, d - 0.2), body, s * (w / 2 - 0.08), 0.55, 0);
      const roof = part(g, new THREE.BoxGeometry(w + 0.3, 0.12, d + 0.3), MAT(0x445a4c), 0, 1.06, 0);
      roof.rotation.x = 0.04;
      part(g, new THREE.BoxGeometry(w * 0.7, 0.1, 0.1), MAT(TRIM), 0, 0.22, d / 2 - 0.2);
    }

    /* ---- ports ----
       Placed in local space. The group is already rotated, so using world offsets
       here would rotate them a second time and put every port on the wrong face. */
    const P = localPorts(e);
    for (const p of P.out) {
      part(g, new THREE.BoxGeometry(0.4, 0.22, 0.3), MAT(DARK), p.x, 0.34, p.z);
      part(g, new THREE.BoxGeometry(0.3, 0.07, 0.18), MAT(0x8f9a5a), p.x, 0.47, p.z, false);
    }
    P.in.forEach((p, i) => {
      const item = P.inItems[i];
      part(g, new THREE.BoxGeometry(0.36, 0.2, 0.28),
        MAT(item ? ITEMS[item].color : 0xd2cdbe), p.x, 0.32, p.z);
    });

    if (e === selected) {
      const halo = new THREE.Mesh(
        new THREE.RingGeometry(Math.max(b.ex, b.ez) + 0.18, Math.max(b.ex, b.ez) + 0.3, 40),
        new THREE.MeshBasicMaterial({ color: 0x161d21, side: THREE.DoubleSide }));
      halo.rotation.x = -Math.PI / 2;
      halo.position.y = 0.04;
      g.add(halo);
    }

    g.userData.anim = anim;
    g.userData.ent = e;
    gMachines.add(g);
  }
}

/* ---- efficiency rings ----
   Built once per solve, not per frame. The previous version disposed and
   recreated ring geometry inside the render loop, which is fine at five machines
   and ruinous at fifty. Only the arc geometry is regenerated, and only when the
   displayed percentage actually moves. */
const ringFor = new Map();
function buildRings() {
  clear(gRings);
  ringFor.clear();
  if (phase === 'edit') return;
  for (const e of ents) {
    const def = MACHINES[e.type];
    if (def.kind === 'splitter' || def.kind === 'merger' || def.kind === 'sink') continue;
    const b = boxOf(e);
    const r = Math.max(b.ex, b.ez) + 0.34;
    const track = new THREE.Mesh(new THREE.RingGeometry(r, r + 0.15, 46),
      new THREE.MeshBasicMaterial({ color: 0x9fa298, side: THREE.DoubleSide, transparent: true, opacity: 0.85 }));
    track.rotation.x = -Math.PI / 2;
    track.position.set(e.x, 0.045, e.z);
    const fill = new THREE.Mesh(new THREE.RingGeometry(r, r + 0.15, 46, 1, Math.PI / 2, -0.001),
      new THREE.MeshBasicMaterial({ color: 0x888888, side: THREE.DoubleSide }));
    fill.rotation.x = -Math.PI / 2;
    fill.position.set(e.x, 0.055, e.z);
    gRings.add(track, fill);
    ringFor.set(e.id, { track, fill, r, shown: -1 });
  }
  updateRings();
}

function updateRings() {
  for (const e of ents) {
    const h = ringFor.get(e.id);
    if (!h) continue;
    const live = isLive(e);
    h.track.visible = live;
    h.fill.visible = live;
    if (!live) continue;
    const frac = Math.max(0.001, Math.min(1, e.f || 0));
    h.fill.material.color.setHex(STATE_COLOR[e.state] || 0x888888);
    if (Math.abs(frac - h.shown) > 0.01) {
      h.shown = frac;
      h.fill.geometry.dispose();
      h.fill.geometry = new THREE.RingGeometry(h.r, h.r + 0.15,
        Math.max(3, Math.ceil(46 * frac)), 1, Math.PI / 2, -Math.PI * 2 * frac);
    }
  }
}

/* one ribbon mesh for every belt, built by hand so it can carry vertex colours
   and per-point elevation for the crossings */
/* ---- conveyor geometry ----
   The belt surface carries a scrolling chevron texture. Because visual belt speed
   is a tuned constant (§5.1) rather than derived from throughput, every belt
   scrolls at the same rate and one shared material can drive them all — the item
   spacing is what conveys the actual rate. UVs run along arc length so the
   pattern does not stretch on curves. */
function beltTexture() {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, 64, 64);
  g.strokeStyle = 'rgba(0,0,0,0.30)';
  g.lineWidth = 9;
  g.beginPath();
  g.moveTo(4, 6); g.lineTo(32, 30); g.lineTo(60, 6);
  g.stroke();
  g.strokeStyle = 'rgba(0,0,0,0.13)';
  g.lineWidth = 5;
  g.beginPath(); g.moveTo(0, 62); g.lineTo(64, 62); g.stroke();
  const t = new THREE.CanvasTexture(c);
  t.wrapS = THREE.RepeatWrapping;
  t.wrapT = THREE.ClampToEdgeWrapping;
  return t;
}
const BELT_TEX = beltTexture();
/* A fresh material per rebuild: clear() disposes the materials of the children it
   removes, so a shared one would be destroyed the first time a belt is edited.
   The texture is shared and survives, which is what the scroll animation needs. */
const newBeltMat = () => new THREE.MeshLambertMaterial({
  vertexColors: true, map: BELT_TEX, side: THREE.DoubleSide });

function ribbon(list, colorFor, withUV) {
  const pos = [], col = [], idx = [], nrm = [], uv = [];
  let base = 0;
  const c = new THREE.Color();
  for (const l of list) {
    const pts = l.path;
    if (!pts || pts.length < 2) continue;
    const arc = l.arc || arcTable(pts);
    colorFor(l, c);
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
      let tx = b.x - a.x, tz = b.z - a.z;
      const tl = Math.hypot(tx, tz) || 1;
      tx /= tl; tz /= tl;
      const y = yAt(l, arc[i]);
      pos.push(p.x - tz * BELT_HW, y, p.z + tx * BELT_HW);
      pos.push(p.x + tz * BELT_HW, y, p.z - tx * BELT_HW);
      nrm.push(0, 1, 0, 0, 1, 0);
      col.push(c.r, c.g, c.b, c.r, c.g, c.b);
      uv.push(arc[i] / 0.9, 0, arc[i] / 0.9, 1);
    }
    for (let i = 0; i < pts.length - 1; i++) {
      const a = base + i * 2;
      idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
    }
    base += pts.length * 2;
  }
  if (!pos.length) return null;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  if (withUV !== false) g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}

function buildBelts() {
  clear(gBelts);
  if (!links.length) return;

  const surface = ribbon(links, (l, c) => {
    const tier = BELTS.find((t) => t.id === l.tier) || BELTS[0];
    c.setHex(tier.color);
    if (phase !== 'edit') {
      const load = Math.min(1, (l.flow || 0) / l.cap);
      c.lerp(new THREE.Color(0xffffff), 0.14 + load * 0.5);
      if (l.saturated && l.overCapacity) c.setHex(0xc2402f);
    } else {
      c.lerp(new THREE.Color(0xffffff), 0.2);
    }
  });
  if (surface) {
    const m = new THREE.Mesh(surface, newBeltMat());
    m.receiveShadow = true;
    gBelts.add(m);
  }

  /* side rails and support legs — this is most of what makes a belt read as a
     structure standing on the ground rather than a painted stripe */
  const railGeo = [], legs = [];
  const rail = new THREE.Group();
  for (const l of links) {
    const pts = l.path, arc = l.arc;
    for (let side = -1; side <= 1; side += 2) {
      const rp = [], ra = [];
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
        let tx = b.x - a.x, tz = b.z - a.z;
        const tl = Math.hypot(tx, tz) || 1;
        tx /= tl; tz /= tl;
        rp.push({ x: p.x + (-tz) * side * (BELT_HW + 0.045), z: p.z + tx * side * (BELT_HW + 0.045) });
        ra.push(arc[i]);
      }
      railGeo.push({ path: rp, arc: ra, bumps: l.bumps, tier: l.tier, off: 0.085 });
    }
    for (let s = 0.45; s < l.length; s += 1.5) legs.push({ l, s });
  }
  const railG = ribbon(railGeo, (l, c) => c.setHex(0x5c6167), false);
  if (railG) {
    /* lift the rails just above the belt surface */
    const p = railG.attributes.position;
    for (let i = 0; i < p.count; i++) p.setY(i, p.getY(i) + 0.085);
    railG.attributes.position.needsUpdate = true;
    const m = new THREE.Mesh(railG, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide }));
    m.castShadow = true;
    gBelts.add(m);
  }
  if (legs.length) {
    const lm = new THREE.InstancedMesh(new THREE.BoxGeometry(0.1, 1, 0.1),
      new THREE.MeshLambertMaterial({ color: 0x4c5257 }), legs.length);
    const mx = new THREE.Matrix4(), q = new THREE.Quaternion(), v = new THREE.Vector3();
    legs.forEach(({ l, s }, i) => {
      const p = posAt(l, s);
      const top = p.y - 0.11;
      const hh = Math.max(0.12, top);
      v.set(p.x, top - hh / 2, p.z);
      mx.compose(v, q, new THREE.Vector3(1, hh, 1));
      lm.setMatrixAt(i, mx);
    });
    lm.castShadow = true;
    gBelts.add(lm);
  }
}

/* ---- items ----
   Distinct shapes per type. An ore lump and an iron plate should be tellable
   apart while zoomed out, which colour alone does not manage. */
const ITEM_GEO = {
  ore:   () => new THREE.IcosahedronGeometry(0.15, 0),
  ingot: () => new THREE.BoxGeometry(0.3, 0.13, 0.19),
  plate: () => new THREE.BoxGeometry(0.34, 0.06, 0.26),
  rod:   () => new THREE.CylinderGeometry(0.06, 0.06, 0.4, 7),
  screw: () => new THREE.CylinderGeometry(0.05, 0.05, 0.17, 6),
  reinf: () => new THREE.BoxGeometry(0.36, 0.1, 0.3),
};
const itemMeshes = {};
function buildItemPools() {
  clear(gItems);
  for (const k of Object.keys(itemMeshes)) delete itemMeshes[k];
  for (const key of Object.keys(ITEMS)) {
    const geo = (ITEM_GEO[key] || (() => new THREE.BoxGeometry(0.24, 0.18, 0.24)))();
    const m = new THREE.InstancedMesh(geo,
      new THREE.MeshLambertMaterial({ color: ITEMS[key].color }), MAX_ITEMS_PER_TYPE);
    m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    m.count = 0; m.frustumCulled = false;
    m.castShadow = true;
    itemMeshes[key] = m;
    gItems.add(m);
  }
}

function posAt(l, s) {
  const arc = l.arc, pts = l.path;
  let i = 1;
  while (i < arc.length - 1 && arc[i] < s) i++;
  const t = (s - arc[i - 1]) / Math.max(1e-6, arc[i] - arc[i - 1]);
  return {
    x: pts[i - 1].x + (pts[i].x - pts[i - 1].x) * t,
    z: pts[i - 1].z + (pts[i].z - pts[i - 1].z) * t,
    y: yAt(l, s) + 0.11,
  };
}

const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _sc = new THREE.Vector3(1, 1, 1),
      _v = new THREE.Vector3(), _e = new THREE.Euler();
function updateItems(t) {
  const counts = {};
  for (const k of Object.keys(itemMeshes)) counts[k] = 0;
  if (phase !== 'edit') {
    for (const l of links) {
      if (!l.item || !l.flow || l.flow < 1e-4) continue;
      const mesh = itemMeshes[l.item];
      if (!mesh) continue;
      const len = l.length;
      let spacing = BELT_SPEED * 60 / l.flow;
      if (len / spacing > MAX_ITEMS_PER_TYPE / 6) spacing = len / (MAX_ITEMS_PER_TYPE / 6);
      const front = (t - (l.startT || 0)) * BELT_SPEED;
      if (front <= 0) continue;
      const lie = l.item === 'rod' || l.item === 'screw';   /* cylinders lie down */
      for (let s = front % spacing; s <= Math.min(len, front); s += spacing) {
        if (counts[l.item] >= MAX_ITEMS_PER_TYPE) break;
        const p = posAt(l, s);
        const q = posAt(l, Math.min(len, s + 0.25));
        const head = Math.atan2(q.x - p.x, q.z - p.z);
        _e.set(lie ? Math.PI / 2 : 0, head, 0, 'YXZ');
        _q.setFromEuler(_e);
        _v.set(p.x, p.y, p.z);
        _m.compose(_v, _q, _sc);
        mesh.setMatrixAt(counts[l.item]++, _m);
      }
    }
  }
  for (const k of Object.keys(itemMeshes)) {
    itemMeshes[k].count = counts[k];
    itemMeshes[k].instanceMatrix.needsUpdate = true;
  }
}

/* ============================================================
   SOLVE + SPIN-UP
   ============================================================ */
function resolve() {
  result = solve({ entities: ents, links });
  scheduleSpinUp();
  buildAll();
  refreshQuotas();
  updateRuler();
}
function scheduleSpinUp() {
  const inL = new Map(ents.map((e) => [e.id, []]));
  for (const l of links) if (inL.has(l.to)) inL.get(l.to).push(l);
  for (const e of ents) e.startT = MACHINES[e.type].kind === 'miner' ? 0.35 : Infinity;
  for (const l of links) l.startT = Infinity;
  let changed = true, guard = 0;
  while (changed && guard++ < 200) {
    changed = false;
    for (const l of links) {
      const src = entById(l.from);
      if (src && src.startT < l.startT - 1e-6) { l.startT = src.startT; changed = true; }
    }
    for (const e of ents) {
      const ins = inL.get(e.id) || [];
      if (!ins.length) continue;
      let ready = 0;
      for (const l of ins) {
        if (l.startT === Infinity) { ready = Infinity; break; }
        ready = Math.max(ready, l.startT + l.length / BELT_SPEED);
      }
      const t = ready === Infinity ? Infinity : ready + 0.3;
      if (t < e.startT - 1e-6) { e.startT = t; changed = true; }
    }
  }
  spinUp = 0;
  for (const e of ents) if (isFinite(e.startT) && (e.f || 0) > 1e-4) spinUp = Math.max(spinUp, e.startT);
  for (const l of links) if (isFinite(l.startT) && (l.flow || 0) > 1e-4) spinUp = Math.max(spinUp, l.startT + l.length / BELT_SPEED);
  spinUp += 0.5;
}
const isLive = (e) => phase !== 'edit' && isFinite(e.startT) && runT >= e.startT;
function buildAll() { buildMachines(); buildBelts(); buildRings(); }

function beltMetres() { let s = 0; for (const l of links) s += l.length; return s; }

/* ============================================================
   UI
   ============================================================ */
const $ = (s) => document.querySelector(s);
const fmt = (v) => (Math.abs(v - Math.round(v)) < 0.05 ? String(Math.round(v)) : v.toFixed(1));
let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2100);
}
function updateRuler() {
  const el = $('#ruler');
  el.classList.toggle('on', links.length > 0);
  el.textContent = beltMetres().toFixed(1) + ' m of belt · ' + links.length + ' run' + (links.length === 1 ? '' : 's');
}

function buildTray() {
  const el = $('#trayScroll');
  el.innerHTML = '';
  for (const type of L.tech) {
    const def = MACHINES[type];
    for (const r of (def.recipes.length ? def.recipes : [null])) {
      const card = document.createElement('button');
      card.className = 'card' + (pickedType === type && (!r || pickedRecipe === r.id) ? ' on' : '');
      const ins = r && Object.keys(r.in).length ? Object.entries(r.in).map(([k, v]) => v + ' ' + ITEMS[k].short).join(' + ') : '—';
      const outs = r && Object.keys(r.out).length ? Object.entries(r.out).map(([k, v]) => v + ' ' + ITEMS[k].short).join(' + ') : 'pass through';
      card.innerHTML = '<div class="bar" style="background:#' + MACHINE_COLOR[type].toString(16).padStart(6, '0') + '"></div>'
        + '<div class="cn">' + (r && def.recipes.length > 1 ? r.label : def.name) + '</div>'
        + '<div class="cr">' + ins + '<br>&#8595; ' + outs + '</div>';
      card.onclick = () => { pickedType = type; pickedRecipe = r ? r.id : null; setTool('place'); buildTray(); };
      el.appendChild(card);
    }
  }
  for (const t of L.belts) {
    const tier = BELTS.find((b) => b.id === t);
    const card = document.createElement('button');
    card.className = 'card' + (tool === 'belt' && beltTier === t ? ' on' : '');
    card.innerHTML = '<div class="bar" style="background:#' + tier.color.toString(16).padStart(6, '0') + '"></div>'
      + '<div class="cn">Belt ' + tier.name + '</div><div class="cr">' + tier.cap + '/min cap</div>';
    card.onclick = () => { beltTier = t; setTool('belt'); buildTray(); };
    el.appendChild(card);
  }
}

function setTool(t) {
  tool = t;
  stroke = null;
  document.querySelectorAll('.tbtn[data-tool]').forEach((b) => b.classList.toggle('on', b.dataset.tool === t));
  if (t !== 'place') { pickedType = null; pickedRecipe = null; }
  clear(gGhost);
}

function refreshQuotas() {
  const box = $('#quotas');
  box.innerHTML = '';
  const got = (result && result.output) || {};
  for (const [item, need] of Object.entries(L.quota)) {
    const have = got[item] || 0;
    const d = document.createElement('div');
    d.className = 'q' + (have >= need - 1e-4 && phase === 'validated' ? ' met' : '');
    d.innerHTML = '<span class="sw" style="background:#' + ITEMS[item].color.toString(16).padStart(6, '0') + '"></span>'
      + ITEMS[item].name + ' <b>' + need + '</b>/min<span class="got">· '
      + (phase === 'edit' ? 'idle' : fmt(have)) + '</span>';
    box.appendChild(d);
  }
}

function buildLevelBar() {
  const el = $('#levelBar');
  el.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const b = document.createElement('button');
    b.className = 'lv' + (i === lvIndex ? ' on' : '') + (solved[lv.id] ? ' done' : '');
    b.textContent = i + 1;
    b.onclick = () => loadLevel(i);
    el.appendChild(b);
  });
}

function showInspector(e) {
  const box = $('#insp');
  if (!e) { box.style.display = 'none'; return; }
  const def = MACHINES[e.type], r = recipeOf(e);
  let html = '<h4>' + def.name + (r && def.recipes.length > 1 ? ' · ' + r.label : '') + '</h4>';
  if (phase !== 'edit' && def.kind !== 'sink' && def.kind !== 'splitter' && def.kind !== 'merger') {
    html += '<div class="row"><span>Running at</span><b style="color:#'
      + (STATE_COLOR[e.state] || 0x888888).toString(16).padStart(6, '0') + '">'
      + Math.round((e.f || 0) * 100) + '%</b></div>';
    if (r) {
      for (const [it, need] of Object.entries(r.in))
        html += '<div class="row"><span>' + ITEMS[it].short + ' in</span><span>'
          + fmt((e.avail && e.avail[it]) || 0) + ' / ' + need + '</span></div>';
      for (const [it, out] of Object.entries(r.out))
        html += '<div class="row"><span>' + ITEMS[it].short + ' out</span><span>'
          + fmt(out * (e.f || 0)) + ' / ' + out + '</span></div>';
    }
    const d = Object.entries(e.deficits || {});
    if (d.length) {
      html += '<div class="why">Short ' + d.map(([k, v]) => fmt(v) + ' ' + ITEMS[k].short).join(', ') + ' per minute.';
      if (e.limitedBy) {
        const l = e.limitedBy;
        html += ' Traced to the ' + BELTS.find((b) => b.id === l.tier).name + ' belt carrying '
          + ITEMS[l.item].name + ' — caps at ' + l.cap + '/min, wants ' + fmt(l.potFlow || 0) + '.';
      }
      html += '</div>';
    } else if (e.isRootCause) {
      html += '<div class="why">This is the bottleneck. Its output belt is full.</div>';
    }
  } else if (r) {
    html += '<div class="row"><span>Takes</span><span>'
      + (Object.entries(r.in).map(([k, v]) => v + ' ' + ITEMS[k].short).join(' + ') || '—') + '/min</span></div>';
    html += '<div class="row"><span>Makes</span><span>'
      + (Object.entries(r.out).map(([k, v]) => v + ' ' + ITEMS[k].short).join(' + ') || '—') + '/min</span></div>';
  }
  html += '<div class="acts">';
  if (def.recipes.length > 1) html += '<button data-act="recipe">Change recipe</button>';
  if (def.kind !== 'sink') html += '<button data-act="del">Remove</button>';
  html += '</div>';
  box.innerHTML = html;
  box.style.display = 'block';
  box.querySelectorAll('button').forEach((b) => b.onclick = () => {
    if (b.dataset.act === 'del') { removeEntity(e); selected = null; showInspector(null); computeCrossings(); resolve(); }
    if (b.dataset.act === 'recipe') {
      const rs = def.recipes, i = rs.findIndex((x) => x.id === e.recipe);
      e.recipe = rs[(i + 1) % rs.length].id;
      /* input ports may have changed identity — drop links that no longer fit */
      links = links.filter((l) => {
        if (l.to !== e.id) return true;
        const P = portsOf(e);
        return l.toPort < P.in.length;
      });
      computeCrossings(); resolve(); showInspector(e);
    }
  });
}

function showBeltInspector(l) {
  const box = $('#insp');
  const tier = BELTS.find((b) => b.id === l.tier);
  let html = '<h4>Belt ' + tier.name + '</h4>'
    + '<div class="row"><span>Capacity</span><span>' + l.cap + '/min</span></div>'
    + '<div class="row"><span>Length</span><span>' + l.length.toFixed(1) + ' m</span></div>';
  if (l.bumps.length) html += '<div class="row"><span>Crossings</span><span>' + l.bumps.length + ' over</span></div>';
  if (phase !== 'edit') {
    html += '<div class="row"><span>Carrying</span><span>' + (l.item ? ITEMS[l.item].short : '—') + '</span></div>'
      + '<div class="row"><span>Load</span><span>' + fmt(l.flow || 0) + ' / ' + l.cap + '</span></div>';
    if (l.overCapacity) html += '<div class="why">Wants ' + fmt(l.potFlow) + '/min. This belt is the bottleneck.</div>';
  }
  html += '<div class="acts">';
  for (const u of L.belts.filter((t) => t !== l.tier)) html += '<button data-tier="' + u + '">To ' + BELTS.find((b) => b.id === u).name + '</button>';
  html += '<button data-act="del">Remove</button></div>';
  box.innerHTML = html;
  box.style.display = 'block';
  box.querySelectorAll('button').forEach((b) => b.onclick = () => {
    if (b.dataset.act === 'del') links = links.filter((x) => x !== l);
    else { const t = +b.dataset.tier; l.tier = t; l.cap = BELTS.find((x) => x.id === t).cap; }
    selected = null; showInspector(null); computeCrossings(); resolve();
  });
}

const labelPool = [];
function updateLabels() {
  const host = $('#labels');
  host.classList.toggle('on', plannerOn);
  if (!plannerOn) return;
  let n = 0;
  const put = (x, y, z, text, cls) => {
    let el = labelPool[n];
    if (!el) { el = document.createElement('div'); el.className = 'tag'; host.appendChild(el); labelPool[n] = el; }
    const p = new THREE.Vector3(x, y, z).project(camera);
    el.style.left = ((p.x * 0.5 + 0.5) * innerWidth) + 'px';
    el.style.top = ((-p.y * 0.5 + 0.5) * innerHeight) + 'px';
    el.className = 'tag ' + (cls || '');
    el.innerHTML = text;
    el.style.display = 'block';
    n++;
  };
  for (const e of ents) {
    const def = MACHINES[e.type];
    if (def.kind === 'sink') continue;
    if (phase === 'edit') {
      const r = recipeOf(e);
      if (!r) continue;
      put(e.x, 1.2, e.z, Object.entries(r.out).map(([k, v]) => v + ' ' + ITEMS[k].short).join('+') + '/min');
    } else if (isLive(e) && def.kind !== 'splitter' && def.kind !== 'merger') {
      const pct = Math.round((e.f || 0) * 100);
      const cls = pct >= 100 ? 'ok' : (e.state === 'blocked' ? 'bad' : 'warn');
      let txt = '<b>' + pct + '%</b>';
      const d = Object.entries(e.deficits || {});
      if (d.length) txt += ' ' + d.map(([k, v]) => '&minus;' + fmt(v) + ' ' + ITEMS[k].short).join(' ');
      put(e.x, 1.2, e.z, txt, cls);
    }
  }
  for (const l of links) {
    const mid = l.path[Math.floor(l.path.length / 2)];
    if (!mid) continue;
    if (phase === 'edit') put(mid.x, 0.8, mid.z, l.length.toFixed(1) + ' m · ' + l.cap + ' cap');
    else {
      const cls = l.saturated && l.overCapacity ? 'bad' : (l.saturated ? 'warn' : '');
      put(mid.x, 0.8, mid.z, fmt(l.flow || 0) + ' / ' + l.cap, cls);
    }
  }
  for (let i = n; i < labelPool.length; i++) labelPool[i].style.display = 'none';
}

/* ============================================================
   RUN
   ============================================================ */
function startRun() {
  resolve();
  phase = 'running'; runT = 0;
  $('#run').textContent = 'Stop'; $('#run').classList.add('live');
  setTool('select');
  buildItemPools(); buildAll();
  toast('Cold start — ' + spinUp.toFixed(1) + 's to steady state');
}
function stopRun() {
  phase = 'edit'; runT = 0;
  $('#run').textContent = 'Run factory'; $('#run').classList.remove('live');
  $('#report').style.display = 'none';
  buildAll(); refreshQuotas();
}
function validate() {
  phase = 'validated';
  const got = result.output || {};
  const met = Object.entries(L.quota).every(([k, v]) => (got[k] || 0) >= v - 1e-4);
  refreshQuotas(); buildAll();
  if (met) { solved[L.id] = true; buildLevelBar(); }
  showReport(met);
}
function showReport(met) {
  const sc = score({ entities: ents, links }, result);
  const rows = [
    ['Machines', sc.machines, L.par.machines, 'fewer is better'],
    ['Belt', +beltMetres().toFixed(1), L.par.belt, 'metres painted — short, clean runs win'],
    ['Ore', Math.round(sc.ore), L.par.ore, 'raw ore per minute'],
  ];
  let html = '<h3>' + (met ? 'Quota met' : 'Quota not met') + '</h3>'
    + '<div class="sub">' + L.name + ' · steady state in ' + spinUp.toFixed(1) + 's</div>';
  if (!met) {
    const got = result.output || {};
    html += '<div class="sub">Output: ' + Object.entries(L.quota)
      .map(([k, v]) => fmt(got[k] || 0) + ' of ' + v + ' ' + ITEMS[k].short).join(' · ') + '</div>';
    const bn = result.bottlenecks[0];
    if (bn) html += '<div class="sub">The ' + BELTS.find((b) => b.id === bn.tier).name + ' belt carrying '
      + ITEMS[bn.item].name + ' is the bottleneck: ' + bn.cap + '/min cap, ' + fmt(bn.potFlow) + '/min wanted.</div>';
    else html += '<div class="sub">Turn on the planner to see which machines are short.</div>';
  } else {
    for (const [name, val, par, cap] of rows) {
      const worst = Math.max(val, par) * 1.6 || 1;
      html += '<div class="metric"><div class="top"><span>' + name + '</span><span>' + val
        + '<span style="color:#6d7570"> · target ' + par + '</span></span></div>'
        + '<div class="track"><div class="fill" style="width:' + (100 * val / worst) + '%;'
        + (val <= par ? 'background:#2f9e6f' : '') + '"></div>'
        + '<div class="par" style="left:' + (100 * par / worst) + '%"></div></div>'
        + '<div class="cap">' + cap + '</div></div>';
    }
  }
  html += '<div class="acts">'
    + (met && lvIndex < LEVELS.length - 1 ? '<button data-a="next">Next level</button>' : '')
    + '<button class="ghost" data-a="back">Keep tinkering</button></div>';
  const card = $('#rcard');
  card.innerHTML = html;
  card.querySelectorAll('button').forEach((b) => b.onclick = () => {
    $('#report').style.display = 'none';
    if (b.dataset.a === 'next') loadLevel(lvIndex + 1); else stopRun();
  });
  $('#report').style.display = 'flex';
}

/* ============================================================
   INPUT
   ============================================================ */
const pointers = new Map();
/* panStart and zoomStart are deliberately separate. They used to be one variable
   holding either a Vector3 or a number depending on the gesture; a third finger
   landing during a pinch assigned the Vector3 while the pinch was still active,
   and Vector3 * number is NaN. That poisoned the zoom permanently and left the
   camera frustum non-finite, so nothing rendered but the sky. */
let dragMode = null, dragStart = null, pinchStart = 0, moved = 0;
let panStart = new THREE.Vector3(), zoomStart = 0;

let zoomMin = 8, zoomMax = 80;
function setZoom(v) {
  if (!Number.isFinite(v)) return;          /* never let NaN reach the camera */
  zoom = Math.max(zoomMin, Math.min(zoomMax, v));
  layoutCamera();
}
/* last-resort recovery: if the frustum is ever non-finite the view is dead and
   cannot fix itself, so snap back to a sane framing */
function cameraIsSane() {
  return Number.isFinite(camera.left) && Number.isFinite(camera.right)
    && Number.isFinite(camera.top) && Number.isFinite(camera.bottom)
    && Number.isFinite(camCenter.x) && Number.isFinite(camCenter.z);
}
function resetView() {
  zoom = L ? Math.max(L.w, L.h) * 1.5 : 24;
  camCenter.set(L ? L.w / 2 : 8, 0, L ? L.h / 2 : 8);
  layoutCamera();
}

function groundAt(cx, cy) {
  raycaster.setFromCamera(new THREE.Vector2((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1), camera);
  const hit = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(groundPlane, hit)) return null;
  return { x: hit.x, z: hit.z };
}

const cv = renderer.domElement;
cv.addEventListener('pointerdown', (ev) => {
  cv.setPointerCapture(ev.pointerId);
  pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  moved = 0;
  if (pointers.size >= 2) {
    const p = [...pointers.values()];
    pinchStart = Math.max(1, Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y));
    dragMode = 'pinch'; zoomStart = zoom;
    stroke = null; clear(gGhost);
    return;
  }
  dragStart = { x: ev.clientX, y: ev.clientY };
  panStart.copy(camCenter);
  const g = groundAt(ev.clientX, ev.clientY);
  if (tool === 'belt' && g) {
    /* begin a stroke at the nearest free output port */
    let bestE = null, bestP = -1, bd = SNAP_RADIUS * SNAP_RADIUS;
    for (const e of ents) {
      const free = freeOutPort(e);
      if (free < 0) continue;
      const p = portsOf(e).out[free];
      const d = dist2(p, g);
      const onBody = inBox(g, boxOf(e, 0.2));
      if (onBody || d < bd) { bd = onBody ? -1 : d; bestE = e; bestP = free; }
    }
    if (bestE) {
      stroke = { fromEnt: bestE, fromPort: bestP, pts: [] };
      dragMode = 'paint';
      return;
    }
    const blocked = ents.find((e) => inBox(g, boxOf(e, 0.2)));
    if (blocked) toast(portError(blocked, blocked, null) || (MACHINES[blocked.type].name + ' has no free output port.'));
  }
  dragMode = 'maybe';
});

cv.addEventListener('pointermove', (ev) => {
  if (!pointers.has(ev.pointerId)) {
    if (tool === 'place' && pickedType) ghostAt(ev.clientX, ev.clientY);
    return;
  }
  pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (dragMode === 'pinch') {
    if (pointers.size < 2) return;        /* wait for a second finger again */
    const p = [...pointers.values()];
    const d = Math.max(1, Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y));
    setZoom(zoomStart * (pinchStart / d));
    return;
  }
  const dx = ev.clientX - dragStart.x, dy = ev.clientY - dragStart.y;
  moved = Math.max(moved, Math.hypot(dx, dy));

  if (dragMode === 'paint' && stroke) {
    const g = groundAt(ev.clientX, ev.clientY);
    if (!g) return;
    const last = stroke.pts[stroke.pts.length - 1];
    if (!last || dist2(last, g) > STROKE_MIN_STEP * STROKE_MIN_STEP) stroke.pts.push(g);
    drawStrokePreview();
    return;
  }
  if (moved > 9) dragMode = 'pan';
  if (dragMode === 'pan') {
    const scale = zoom / innerHeight;
    const rx = -dx * scale, rz = -dy * scale / Math.cos(PITCH);
    const s = Math.sin(yaw), c = Math.cos(yaw);
    /* keep the plot within reach: panning into empty terrain is disorienting and
       there is nothing out there to look at */
    const m = 14;
    camCenter.set(
      Math.max(-m, Math.min((L ? L.w : 16) + m, panStart.x + rx * c + rz * s)), 0,
      Math.max(-m, Math.min((L ? L.h : 16) + m, panStart.z - rx * s + rz * c)));
  }
});

cv.addEventListener('pointerup', (ev) => {
  const wasTap = moved < 9 && pointers.size === 1;
  const painting = dragMode === 'paint' && stroke;
  const g = groundAt(ev.clientX, ev.clientY);
  pointers.delete(ev.pointerId);
  if (painting) {
    clear(gGhost);
    if (stroke.pts.length >= 1 && g) commitStroke(stroke.pts, g);
    else toast('Drag from one machine to another to lay a belt.');
    stroke = null;
  } else if (wasTap && g) {
    handleTap(g);
  }
  if (pointers.size < 2 && dragMode === 'pinch') dragMode = null;
  if (!pointers.size) dragMode = null;
});
cv.addEventListener('pointercancel', (ev) => {
  pointers.delete(ev.pointerId);
  if (!pointers.size) dragMode = null;
  stroke = null; clear(gGhost);
});
/* a finger that leaves the surface without a pointerup would otherwise linger in
   the map forever and make every later single touch look like a pinch */
addEventListener('blur', () => { pointers.clear(); dragMode = null; stroke = null; });
cv.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  setZoom(zoom * (1 + Math.sign(ev.deltaY) * 0.09));
}, { passive: false });

function drawStrokePreview() {
  clear(gGhost);
  const a = stroke.fromEnt;
  const start = portsOf(a).out[stroke.fromPort];
  const pts = resample(chaikin(simplify([start].concat(stroke.pts), SIMPLIFY_EPS), 2), RESAMPLE);
  if (pts.length < 2) return;
  const bad = routeBlocked(pts, a, entAt(pts[pts.length - 1]));
  const fake = { path: pts, arc: arcTable(pts), tier: beltTier, bumps: [] };
  const g = ribbon([fake], (l, c) => c.setHex(bad ? 0xc2402f : 0x2f9e6f));
  if (g) gGhost.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.55, side: THREE.DoubleSide })));
}

function handleTap(g) {
  if (tool === 'place' && pickedType) {
    const err = canPlace(pickedType, g.x, g.z, pickedRot);
    if (err) return toast(err);
    const e = addEntity(pickedType, g.x, g.z, pickedRot);
    if (pickedRecipe) e.recipe = pickedRecipe;
    resolve();
    return;
  }
  if (tool === 'erase') {
    const e = entAt(g);
    if (e && MACHINES[e.type].kind !== 'sink') { removeEntity(e); computeCrossings(); resolve(); return; }
    const l = beltAt(g);
    if (l) { links = links.filter((x) => x !== l); computeCrossings(); resolve(); return; }
    return;
  }
  const e = entAt(g);
  if (e) { selected = e; buildMachines(); showInspector(e); return; }
  const l = beltAt(g);
  if (l) { selected = null; buildMachines(); showBeltInspector(l); return; }
  selected = null; buildMachines(); showInspector(null);
}

function ghostAt(cx, cy) {
  clear(gGhost);
  const g = groundAt(cx, cy);
  if (!g) return;
  const err = canPlace(pickedType, g.x, g.z, pickedRot);
  const probe = { type: pickedType, x: g.x, z: g.z, rot: pickedRot };
  const b = boxOf(probe);
  const m = new THREE.Mesh(new THREE.BoxGeometry(b.ex * 2, 0.6, b.ez * 2),
    new THREE.MeshBasicMaterial({ color: err ? 0xc2402f : 0x2f9e6f, transparent: true, opacity: 0.34 }));
  m.position.set(g.x, 0.3, g.z);
  gGhost.add(m);
  const dir = DIRS[pickedRot % 4];
  const nib = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.3, 0.34),
    new THREE.MeshBasicMaterial({ color: 0x1b2124, transparent: true, opacity: 0.6 }));
  nib.position.set(g.x + dir[0] * b.ez, 0.4, g.z + dir[1] * b.ez);
  gGhost.add(nib);
}

document.querySelectorAll('.tbtn[data-tool]').forEach((b) => b.onclick = () => setTool(b.dataset.tool));
$('#rotBtn').onclick = () => {
  if (selected && MACHINES[selected.type].kind !== 'sink') {
    const old = selected.rot;
    selected.rot = (selected.rot + 1) % 4;
    const err = canPlace(selected.type, selected.x, selected.z, selected.rot, selected);
    if (err) { selected.rot = old; return toast('No room to turn that.'); }
    links = links.filter((l) => l.from !== selected.id && l.to !== selected.id);
    computeCrossings(); resolve();
    toast('Turned. Belts on that machine were removed.');
  } else {
    pickedRot = (pickedRot + 1) % 4;
    toast('Placing at ' + (pickedRot * 90) + '°');
  }
};
$('#camBtn').onclick = () => { yawTarget += Math.PI / 2; };
$('#run').onclick = () => (phase === 'edit' ? startRun() : stopRun());
$('#plannerBtn').onclick = () => { plannerOn = !plannerOn; $('#plannerBtn').classList.toggle('on', plannerOn); };
$('#clearBtn').onclick = () => {
  ents = ents.filter((e) => MACHINES[e.type].kind === 'sink');
  links = []; selected = null; showInspector(null);
  stopRun(); resolve();
};
addEventListener('resize', layoutCamera);

/* ============================================================
   LEVEL LOAD
   ============================================================ */
function loadLevel(i) {
  lvIndex = Math.max(0, Math.min(LEVELS.length - 1, i));
  L = LEVELS[lvIndex];
  ents = []; links = []; nextId = 1;
  selected = null; stroke = null; result = null;
  phase = 'edit'; runT = 0; plannerOn = false;
  $('#plannerBtn').classList.remove('on');
  $('#run').textContent = 'Run factory'; $('#run').classList.remove('live');
  $('#report').style.display = 'none';
  showInspector(null);

  addEntity('sink', L.depot.x, L.depot.z, 2);
  beltTier = L.belts[0];
  camCenter.set(L.w / 2, 0, L.h / 2);
  zoomMin = 7;
  zoomMax = Math.max(L.w, L.h) * 2.4;   /* stays within the terrain we actually built */
  zoom = Math.max(L.w, L.h) * 1.5;
  yaw = yawTarget = 0;
  layoutCamera();

  $('#lvId').textContent = 'LV ' + String(lvIndex + 1).padStart(2, '0');
  $('#lvName').textContent = L.name;
  $('#lvHint').textContent = L.hint;
  buildPad(); buildTray(); buildLevelBar(); buildItemPools();
  setTool('select');
  resolve();
  $('#levelBar').style.top = ($('#docket').offsetHeight + 8) + 'px';
}

/* ============================================================
   LOOP
   ============================================================ */
/* ---- moving parts ----
   Design doc §11: a machine should animate so 100% vs 60% is felt, not only read.
   Speed is proportional to the machine's actual rate, so a starved machine
   visibly labours. */
function animateMachines(t) {
  for (const g of gMachines.children) {
    const e = g.userData.ent;
    const a = g.userData.anim;
    if (!e || !a) continue;
    const f = (phase !== 'edit' && isLive(e)) ? (e.f || 0) : 0;
    if (a.drum) a.drum.rotation.x = t * f * 5.5;
    if (a.press) a.press.position.y = 1.05 - (f > 0 ? Math.abs(Math.sin(t * f * 3.4)) * 0.3 : 0);
    if (a.arms) a.arms.forEach((arm, i) => {
      arm.rotation.y = Math.sin(t * f * 2.6 + i * Math.PI) * (0.5 + 0.35 * f);
    });
    if (a.glow) {
      const heat = f > 0 ? 0.35 + 0.65 * Math.abs(Math.sin(t * 2.2)) * f : 0;
      a.glow.material.color.setRGB(0.16 + heat * 0.84, 0.10 + heat * 0.42, 0.07 + heat * 0.05);
    }
    if (a.puff) {
      if (f <= 0.001) { a.puff.visible = false; }
      else {
        a.puff.visible = true;
        const cyc = (t * (0.35 + f * 0.55)) % 1;
        a.puff.position.y = 2.15 + cyc * 1.5;
        a.puff.scale.setScalar(0.5 + cyc * 1.5);
        a.puff.material.opacity = 0.45 * (1 - cyc) * f;
      }
    }
  }
}

let last = performance.now(), clock = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  clock += dt;
  if (Math.abs(yawTarget - yaw) > 1e-4) yaw += (yawTarget - yaw) * Math.min(1, dt * 9);
  if (!cameraIsSane()) { resetView(); toast('View reset.'); }
  placeCamera();
  if (phase === 'running') {
    runT += dt;
    if (runT >= spinUp) validate();
  }
  if (phase !== 'edit') {
    updateRings();
    /* one shared scroll: visual belt speed is constant by design, and 0.9 is the
       texture's world period in metres */
    BELT_TEX.offset.x = -(runT * BELT_SPEED) / 0.9;
  }
  animateMachines(clock);
  updateItems(runT);
  updateLabels();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

layoutCamera();
loadLevel(0);
requestAnimationFrame(frame);
</script>
</body>
</html>
