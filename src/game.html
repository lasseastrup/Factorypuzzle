<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>RATIO — prototype</title>
<style>
  :root{
    --ink:#161d21; --ink-2:#2b363d; --panel:#eceae1; --panel-2:#dcd9cc;
    --line:#b6b2a3; --accent:#2f6f8f;
    --run:#2f9e6f; --starve:#d99a20; --throttle:#c9702c; --block:#c2402f; --stop:#8b8f8a;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#a8ada1;font-family:var(--ui);color:var(--ink)}
  canvas{display:block;touch-action:none}

  #docket{position:fixed;top:0;left:0;right:0;padding:8px 10px;
    background:linear-gradient(#161d21,#1d262b);color:#e8e6dd;
    display:flex;gap:10px;align-items:stretch;z-index:10}
  #docket .id{font-family:var(--mono);font-size:10px;color:#7f8b84;writing-mode:vertical-rl;
    transform:rotate(180deg);letter-spacing:.2em;padding:2px 6px 2px 0;border-right:1px solid #333e44}
  #dockBody{flex:1;min-width:0}
  #lvName{font:600 13px/1.2 var(--ui)}
  #lvHint{font-size:10.5px;color:#95a09a;margin-top:2px;line-height:1.3}
  #quotas{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .q{display:flex;align-items:center;gap:5px;background:#232d33;border:1px solid #334047;
     border-radius:2px;padding:3px 6px;font-family:var(--mono);font-size:11px}
  .q .sw{width:8px;height:8px;border-radius:1px}
  .q .got{color:#7f8b84}
  .q.met{border-color:#2f9e6f;background:#1b2f28}
  .q.met .got{color:#5fd0a8}

  #tools{position:fixed;right:8px;top:50%;transform:translateY(-50%);z-index:10;
    display:flex;flex-direction:column;gap:5px}
  .tbtn{width:44px;height:44px;border:1px solid var(--line);background:var(--panel);
    border-radius:3px;display:grid;place-items:center;font:600 8.5px/1.15 var(--ui);
    letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);cursor:pointer;padding:3px;text-align:center}
  .tbtn.on{background:var(--ink);color:#f0eee5;border-color:var(--ink)}

  #tray{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--panel);
    border-top:1px solid var(--line)}
  #trayScroll{display:flex;gap:6px;overflow-x:auto;padding:7px 8px;scrollbar-width:none}
  #trayScroll::-webkit-scrollbar{display:none}
  .card{flex:0 0 auto;width:82px;border:1px solid var(--line);border-radius:3px;
    background:#f6f4ed;padding:5px 6px;cursor:pointer;text-align:left}
  .card.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
  .card .cn{font:600 10.5px/1.2 var(--ui)}
  .card .cr{font-family:var(--mono);font-size:9px;color:#6d7570;margin-top:3px;line-height:1.35}
  .card .bar{height:3px;border-radius:2px;margin-bottom:4px}
  #bar2{display:flex;gap:6px;padding:0 8px 7px;align-items:center}
  #run{flex:1;height:38px;border:0;border-radius:3px;background:var(--ink);color:#f0eee5;
    font:600 12px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
  #run.live{background:var(--block)}
  .mini{height:38px;padding:0 10px;border:1px solid var(--line);background:#f6f4ed;
    border-radius:3px;font:600 10px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .mini.on{background:var(--ink);color:#f0eee5;border-color:var(--ink)}

  #insp{position:fixed;left:8px;bottom:104px;z-index:11;width:214px;background:var(--panel);
    border:1px solid var(--line);border-radius:3px;padding:8px 9px;display:none}
  #insp h4{margin:0 0 5px;font:600 11.5px/1.2 var(--ui)}
  #insp .row{display:flex;justify-content:space-between;font-family:var(--mono);
    font-size:10px;padding:2px 0;border-bottom:1px dotted #c9c5b6}
  #insp .row:last-of-type{border:0}
  #insp .why{margin-top:6px;font-size:10px;line-height:1.4;color:#4a534d;
    border-left:2px solid var(--throttle);padding-left:6px}
  #insp .acts{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
  #insp button{flex:1;min-width:56px;padding:5px 4px;border:1px solid var(--line);background:#f6f4ed;
    border-radius:2px;font:600 9px/1 var(--ui);letter-spacing:.05em;text-transform:uppercase;cursor:pointer}

  #report{position:fixed;inset:0;z-index:30;background:rgba(20,26,30,.82);display:none;
    align-items:center;justify-content:center;padding:18px}
  #rcard{background:var(--panel);border-radius:4px;padding:16px;width:100%;max-width:330px}
  #rcard h3{margin:0;font:600 15px/1.2 var(--ui)}
  #rcard .sub{font-size:10.5px;color:#6d7570;margin:3px 0 12px;line-height:1.4}
  .metric{margin-bottom:9px}
  .metric .top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px}
  .metric .track{height:5px;background:var(--panel-2);border-radius:3px;margin-top:3px;position:relative}
  .metric .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
  .metric .par{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--ink)}
  .metric .cap{font-size:9px;color:#6d7570;margin-top:2px}
  #rcard .acts{display:flex;gap:6px;margin-top:12px}
  #rcard button{flex:1;padding:10px;border:0;border-radius:3px;background:var(--ink);color:#f0eee5;
    font:600 11px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  #rcard button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}

  #labels{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
  #labels.on{display:block}
  .tag{position:absolute;transform:translate(-50%,-50%);font-family:var(--mono);font-size:9.5px;
    line-height:1.25;white-space:nowrap;padding:1px 4px;border-radius:2px;
    background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.16);color:#1d2529}
  .tag.bad{background:#fdecea;border-color:var(--block);color:#7d2318}
  .tag.warn{background:#fdf3e2;border-color:var(--throttle);color:#7a4413}
  .tag.ok{background:#e9f6ef;border-color:var(--run);color:#1b5b41}

  #toast{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);z-index:20;
    background:var(--ink);color:#f0eee5;padding:7px 12px;border-radius:3px;font-size:11px;
    opacity:0;transition:opacity .18s;pointer-events:none;max-width:78vw;text-align:center}
  #toast.on{opacity:1}

  #levelBar{position:fixed;left:8px;z-index:10;display:flex;gap:4px}
  .lv{width:26px;height:26px;border:1px solid var(--line);background:var(--panel);border-radius:2px;
    font-family:var(--mono);font-size:10px;cursor:pointer;display:grid;place-items:center;padding:0}
  .lv.on{background:var(--ink);color:#f0eee5;border-color:var(--ink)}
  .lv.done{border-color:var(--run);color:var(--run)}
  .lv.done.on{color:#5fd0a8}

  #ruler{position:fixed;left:8px;bottom:78px;z-index:10;font-family:var(--mono);font-size:9px;
    color:#3b443e;background:rgba(236,234,225,.85);border:1px solid var(--line);border-radius:2px;
    padding:3px 6px;display:none}
  #ruler.on{display:block}

  #fatal{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:99;
    max-width:300px;background:#fdecea;border:1px solid var(--block);border-left-width:3px;
    border-radius:3px;padding:11px 13px;font-size:12px;line-height:1.45;color:#7d2318}
  #fatal b{display:block;margin-bottom:4px}
  #fatal span{display:block;font-family:var(--mono);font-size:10px;opacity:.75;margin-top:5px;word-break:break-all}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="labels"></div>
<div id="docket">
  <div class="id" id="lvId">LV 01</div>

  </div>
</div>

<div id="tools">
  <button class="tbtn on" data-tool="select">Select</button>
  <button class="tbtn" data-tool="belt">Paint belt</button>
  <button class="tbtn" data-tool="erase">Erase</button>
  <button class="tbtn" id="rotBtn">Turn 90&deg;</button>
  <button class="tbtn" id="camBtn">Rotate view</button>
</div>

<script>
window.__fatal = function (msg, detail) {
  var el = document.getElementById('fatal');
  if (!el) { el = document.createElement('div'); el.id = 'fatal'; document.body.appendChild(el); }
  el.innerHTML = '<b>' + msg + '</b>' + (detail ? '<span>' + detail + '</span>' : '');
  el.style.display = 'block';
};
window.addEventListener('error', function (e) {
  window.__fatal(e.message || 'Script error', (e.filename || '') + (e.lineno ? ':' + e.lineno : ''));
});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
if (typeof THREE === 'undefined') {
  window.__fatal('three.js did not load.',
    'The prototype needs three.js from cdnjs. Check the connection and reload.');
  throw new Error('three.js missing');
}

/*__SIM__*/

/* ============================================================
   LEVELS. Positions are metres now, not tiles. Machine footprints
   are metres too, so "1 tile" from the old build reads as "1 m".
   ============================================================ */
const LEVELS = [
  { id: 'Ingots', name: 'First ingots', rung: 1,
    hint: 'Paint a belt: press on a machine and drag to the next one. Curves are fine.',
    w: 15, h: 14,
    nodes: [{ x: 3.5, z: 4, rate: 30 }],
    depot: { x: 11.5, z: 10 },
    rocks: [{ x: 7.4, z: 2.6, r: 0.7 }, { x: 8.1, z: 4.2, r: 0.55 }],
    quota: { ingot: 30 },
    tech: ['miner', 'smelter'], belts: [1],
    par: { machines: 2, belt: 10, ore: 30 } },

  { id: 'Plates', name: 'Plate line', rung: 2,
    hint: 'A Constructor turns 30 ingots into 20 plates. Watch the efficiency ring.',
    w: 17, h: 14,
    nodes: [{ x: 3, z: 3.5, rate: 30 }],
    depot: { x: 13.5, z: 10.5 },
    rocks: [{ x: 8, z: 6.5, r: 0.8 }, { x: 9.3, z: 7.4, r: 0.6 }, { x: 6.4, z: 10.8, r: 0.65 }],
    quota: { plate: 20 },
    tech: ['miner', 'smelter', 'constructor'], belts: [1],
    par: { machines: 3, belt: 14, ore: 30 } },

  { id: 'Screws', name: 'Ninety screws', rung: 2,
    hint: 'A Constructor makes 90 screws a minute. A Mk1 belt carries 60. Find the bottleneck.',
    w: 17, h: 16,
    nodes: [{ x: 3, z: 4.5, rate: 30 }],
    depot: { x: 13.5, z: 11.5 },
    rocks: [{ x: 8.6, z: 2.8, r: 0.75 }, { x: 8.9, z: 4.3, r: 0.6 }, { x: 6.8, z: 13.4, r: 0.7 }],
    quota: { screw: 90 },
    tech: ['miner', 'smelter', 'constructor'], belts: [1, 2],
    par: { machines: 4, belt: 17, ore: 30 } },

  { id: 'Reinf', name: 'Reinforced plate', rung: 2,
    hint: 'Plates and screws into one Assembler. Two nodes, and Mk2 belts are unlocked.',
    w: 21, h: 18,
    nodes: [{ x: 3, z: 3.5, rate: 30 }, { x: 3, z: 13.5, rate: 30 }],
    depot: { x: 17.5, z: 9 },
    rocks: [{ x: 10, z: 1.2, r: 0.8 }, { x: 10, z: 16.6, r: 0.8 },
            { x: 13.6, z: 5.4, r: 0.7 }, { x: 13.6, z: 12.6, r: 0.7 }],
    quota: { reinf: 10 },
    tech: ['miner', 'smelter', 'constructor', 'assembler', 'splitter', 'merger'], belts: [1, 2],
    par: { machines: 8, belt: 46, ore: 60 } },

  { id: 'Twin', name: 'Two products, one node', rung: 4,
    hint: 'A pure node gives 60 ore. Both outputs draw on it — the split is the puzzle.',
    w: 19, h: 16,
    nodes: [{ x: 3, z: 8, rate: 60 }],
    depot: { x: 15.5, z: 8 },
    rocks: [{ x: 9, z: 3.4, r: 0.8 }, { x: 9, z: 12.6, r: 0.8 }, { x: 12, z: 8, r: 0.65 }],
    quota: { plate: 20, rod: 30 },
    tech: ['miner', 'smelter', 'constructor', 'splitter', 'merger'], belts: [1, 2],
    par: { machines: 5, belt: 34, ore: 60 } },
];

const MACHINE_COLOR = {
  miner: 0x474d52, smelter: 0x9c4b36, constructor: 0x3d6a89,
  assembler: 0xa2833c, splitter: 0x5c6660, merger: 0x5c6660, sink: 0x2e5a48,
};
const STATE_COLOR = {
  running: 0x2f9e6f, starved: 0xd99a20, throttled: 0xc9702c,
  blocked: 0xc2402f, stopped: 0x8b8f8a, idle: 0x8b8f8a, passive: 0x8b8f8a,
};

const BELT_SPEED = 4.2;        // m/s, tuned for spin-up budget (§5.1)
const BELT_HW = 0.30;          // half width
const BELT_Y = 0.075;
const MAX_ITEMS_PER_TYPE = 500;
const CLEARANCE = 0.34;        // how close a belt may pass a machine or rock
const STROKE_MIN_STEP = 0.16;  // sampling distance while painting
const SIMPLIFY_EPS = 0.13;
const RESAMPLE = 0.34;
const MIN_RADIUS = 0.85;       // conveyors cannot turn on a dime
const SNAP_RADIUS = 2.2;       // how near a port a stroke must start or end
const BUMP_H = 0.46, BUMP_SIG = 0.62;  // over-under at a crossing
const ENDPOINT_GUARD = 0.55;   // convergence near a shared port is not a crossing

/* ============================================================
   STATE
   ============================================================ */
let L = null, lvIndex = 0;
const solved = {};
let ents = [], links = [], nextId = 1;
let tool = 'select', pickedType = null, pickedRecipe = null, pickedRot = 0, beltTier = 1;
let selected = null, result = null, phase = 'edit', runT = 0, spinUp = 0, plannerOn = false;
let stroke = null;   // { fromEnt, fromPort, pts[] }

/* ============================================================
   GEOMETRY
   ============================================================ */
const DIRS = [[0, 1], [1, 0], [0, -1], [-1, 0]];

/* axis-aligned box, because rotation is in 90° steps even though position is free */
function boxOf(e, inflate) {
  const d = MACHINES[e.type];
  const ex = (e.rot % 2 ? d.h : d.w) / 2 + (inflate || 0);
  const ez = (e.rot % 2 ? d.w : d.h) / 2 + (inflate || 0);
  return { x0: e.x - ex, x1: e.x + ex, z0: e.z - ez, z1: e.z + ez, ex, ez };
}
const boxesOverlap = (a, b) => a.x0 < b.x1 && b.x0 < a.x1 && a.z0 < b.z1 && b.z0 < a.z1;
const inBox = (p, b) => p.x >= b.x0 && p.x <= b.x1 && p.z >= b.z0 && p.z <= b.z1;

function inPlot(e) {
  const b = boxOf(e);
  return b.x0 >= 0.1 && b.z0 >= 0.1 && b.x1 <= L.w - 0.1 && b.z1 <= L.h - 0.1;
}

/* Ports. A machine's output leaves the face it is turned toward; inputs enter
   the opposite face, one per required item, so a port means something. */
/* Ports in the machine's own frame: +z is the face it is turned toward, x is
   across. Kept separate from the world-space version so the renderer can place
   port meshes as children of an already-rotated group without rotating twice. */
function localPorts(e) {
  const d = MACHINES[e.type];
  const fd = d.h / 2, cr = d.w / 2;
  const at = (fwd, side) => ({ x: side, z: fwd });
  if (d.kind === 'splitter') {
    return { out: [at(fd, 0), at(0, cr), at(0, -cr)], in: [at(-fd, 0)], inItems: [null] };
  }
  if (d.kind === 'merger') {
    return { out: [at(fd, 0)], in: [at(-fd, 0), at(0, cr), at(0, -cr)], inItems: [null, null, null] };
  }
  if (d.kind === 'sink') {
    return { out: [], in: [at(fd, 0), at(-fd, 0), at(0, cr), at(0, -cr)], inItems: [null, null, null, null] };
  }
  const r = recipeOf(e);
  const items = r ? Object.keys(r.in) : [];
  const ins = items.map((_, i) => {
    const spread = items.length > 1 ? (i / (items.length - 1) - 0.5) * (cr * 1.25) : 0;
    return at(-fd, spread);
  });
  return { out: [at(fd, 0)], in: ins, inItems: items };
}

/* rotation for the renderer, and the matching local -> world transform.
   rotation.y = rot * 90 deg maps local (x=side, z=fwd) to the same world offset
   portsOf produces; the opposite sign puts every port 180 degrees out. */
const machineYaw = (e) => (e.rot % 4) * Math.PI / 2;

function portsOf(e) {
  const dir = DIRS[e.rot % 4];
  const perp = [dir[1], -dir[0]];
  const lp = localPorts(e);
  const tf = (p) => ({
    x: e.x + dir[0] * p.z + perp[0] * p.x,
    z: e.z + dir[1] * p.z + perp[1] * p.x,
  });
  return { out: lp.out.map(tf), in: lp.in.map(tf), inItems: lp.inItems, local: lp };
}

const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.z - b.z) ** 2;

/* distance from a point to a segment, for hit-testing painted belts */
function distToSeg(p, a, b) {
  const vx = b.x - a.x, vz = b.z - a.z;
  const wx = p.x - a.x, wz = p.z - a.z;
  const L2 = vx * vx + vz * vz;
  let t = L2 ? (wx * vx + wz * vz) / L2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (a.x + vx * t), p.z - (a.z + vz * t));
}
function distToPath(p, pts) {
  let m = Infinity;
  for (let i = 0; i < pts.length - 1; i++) m = Math.min(m, distToSeg(p, pts[i], pts[i + 1]));
  return m;
}

/* Ramer–Douglas–Peucker */
function simplify(pts, eps) {
  if (pts.length < 3) return pts.slice();
  const keep = new Array(pts.length).fill(false);
  keep[0] = keep[pts.length - 1] = true;
  (function rec(a, b) {
    let worst = -1, wi = -1;
    for (let i = a + 1; i < b; i++) {
      const d = distToSeg(pts[i], pts[a], pts[b]);
      if (d > worst) { worst = d; wi = i; }
    }
    if (worst > eps && wi > 0) { keep[wi] = true; rec(a, wi); rec(wi, b); }
  })(0, pts.length - 1);
  return pts.filter((_, i) => keep[i]);
}

/* Chaikin corner cutting, endpoints pinned */
function chaikin(pts, iters) {
  let p = pts;
  for (let k = 0; k < iters; k++) {
    if (p.length < 3) break;
    const out = [p[0]];
    for (let i = 0; i < p.length - 1; i++) {
      const a = p[i], b = p[i + 1];
      out.push({ x: a.x * 0.75 + b.x * 0.25, z: a.z * 0.75 + b.z * 0.25 });
      out.push({ x: a.x * 0.25 + b.x * 0.75, z: a.z * 0.25 + b.z * 0.75 });
    }
    out.push(p[p.length - 1]);
    p = out;
  }
  return p;
}

function resample(pts, step) {
  if (pts.length < 2) return pts.slice();
  const out = [pts[0]];
  let carry = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    let seg = Math.hypot(b.x - a.x, b.z - a.z);
    if (seg < 1e-6) continue;
    let t = (step - carry) / seg;
    while (t <= 1) {
      out.push({ x: a.x + (b.x - a.x) * t, z: a.z + (b.z - a.z) * t });
      t += step / seg;
    }
    carry = (carry + seg) % step;
  }
  const last = pts[pts.length - 1];
  if (dist2(out[out.length - 1], last) > 1e-4) out.push(last);
  return out;
}

function minRadius(pts) {
  let m = Infinity;
  for (let i = 1; i < pts.length - 1; i++) {
    const a = pts[i - 1], b = pts[i], c = pts[i + 1];
    const ab = Math.hypot(b.x - a.x, b.z - a.z);
    const bc = Math.hypot(c.x - b.x, c.z - b.z);
    const ac = Math.hypot(c.x - a.x, c.z - a.z);
    const area = Math.abs((b.x - a.x) * (c.z - a.z) - (c.x - a.x) * (b.z - a.z)) / 2;
    if (area < 1e-7) continue;
    m = Math.min(m, (ab * bc * ac) / (4 * area));
  }
  return m;
}

function arcTable(pts) {
  const arc = [0];
  for (let i = 1; i < pts.length; i++) arc.push(arc[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].z - pts[i - 1].z));
  return arc;
}

/* ============================================================
   THREE SETUP
   ============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa8ada1);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
/* Shadows are the single biggest cue that this is a solid world rather than
   coloured shapes on a plane. Kept cheap: one shadow-casting light, a map sized
   to the plot, and soft filtering. */
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const PITCH = 58 * Math.PI / 180;
let yaw = 0, yawTarget = 0, zoom = 34, camCenter = new THREE.Vector3(7, 0, 7);
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 400);

function layoutCamera() {
  renderer.setSize(innerWidth, innerHeight);
  const aspect = innerWidth / innerHeight;
  camera.left = -zoom * aspect / 2; camera.right = zoom * aspect / 2;
  camera.top = zoom / 2; camera.bottom = -zoom / 2;
  camera.updateProjectionMatrix();
}
function placeCamera() {
  const d = 100;
  camera.position.set(
    camCenter.x + Math.sin(yaw) * Math.cos(PITCH) * d,
    Math.sin(PITCH) * d,
    camCenter.z + Math.cos(yaw) * Math.cos(PITCH) * d
  );
  camera.up.set(0, 1, 0);
  camera.lookAt(camCenter);
}

/* sky gradient as the background, so the horizon is not a flat wash */
(function sky() {
  const c = document.createElement('canvas');
  c.width = 8; c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 128);
  grad.addColorStop(0.00, '#9fb6c4');
  grad.addColorStop(0.55, '#c2cbc6');
  grad.addColorStop(1.00, '#d8d6c6');
