let clockT = 0, editT = 0, spinUp = 0;
let reported = false;
/* Completion is measured, not predicted. The depot records every item it receives
   and the level is passed when the last DELIVER_WINDOW seconds contain a full
   window's worth of each quota item. There is no "line filling" state because
   there is nothing to wait out: until material arrives, the count is simply low,
   and the belts themselves show it travelling. */
const DELIVER_WINDOW = 8;
let deliveries = [];
const phase = 'live';
let stroke = null;   // { fromEnt, fromPort, pts[] }

/* ============================================================
   GEOMETRY
   ============================================================ */
const DIRS = [[0, 1], [1, 0], [0, -1], [-1, 0]];

/* axis-aligned box, because rotation is in 90° steps even though position is free */
function boxOf(e, inflate) {
  const d = MACHINES[e.type];
  const ex = (e.rot % 2 ? d.h : d.w) / 2 + (inflate || 0);
  const ez = (e.rot % 2 ? d.w : d.h) / 2 + (inflate || 0);
  return { x0: e.x - ex, x1: e.x + ex, z0: e.z - ez, z1: e.z + ez, ex, ez };
}
const boxesOverlap = (a, b) => a.x0 < b.x1 && b.x0 < a.x1 && a.z0 < b.z1 && b.z0 < a.z1;
const inBox = (p, b) => p.x >= b.x0 && p.x <= b.x1 && p.z >= b.z0 && p.z <= b.z1;

/* How many belts the Depot accepts on this level. Capping it at one is what lets a
   level ask for its output on a single high-speed belt: the merge has to happen in the
   factory rather than being spread across four lines into the wall. */
const depotCap = () => (L && L.depotPorts) || 4;

function inPlot(e) {
  const b = boxOf(e);
  return b.x0 >= 0.1 && b.z0 >= 0.1 && b.x1 <= L.w - 0.1 && b.z1 <= L.h - 0.1;
}

/* Ports. A machine's output leaves the face it is turned toward; inputs enter
   the opposite face, one per required item, so a port means something. */
/* Ports in the machine's own frame: +z is the face it is turned toward, x is
   across. Kept separate from the world-space version so the renderer can place
   port meshes as children of an already-rotated group without rotating twice. */
/* A factory's ports come from the terminals its designer placed on the interior
   walls. A terminal's wall and its position along that wall map onto the matching
   face of the box, so the interface you draw inside is the interface you see out. */
function factoryPorts(e) {
  const def = e.def || { entities: [] };
  const d = MACHINES.factory;
  const hx = d.w / 2, hz = d.h / 2;
  const outP = [], inP = [], inItems = [], outIdx = [], inIdx = [];
  const terms = (def.entities || []).filter((t) => t.type === 'termIn' || t.type === 'termOut');
  terms.sort((a, b) => (a.index || 0) - (b.index || 0));
  for (const t of terms) {
    const iw = def.w || INTERIOR_W, ih = def.h || INTERIOR_H;
    /* normalised position along the wall the terminal sits on */
    let p;
    if (t.wall === 'n' || t.wall === 's') p = { x: (t.x / iw - 0.5) * (d.w - 0.8), z: (t.wall === 'n' ? -hz : hz) };
    else p = { x: (t.wall === 'w' ? -hx : hx), z: (t.z / ih - 0.5) * (d.h - 0.8) };
    if (t.type === 'termOut') { outP.push(p); outIdx.push(t.index || 0); }
    else { inP.push(p); inItems.push(null); inIdx.push(t.index || 0); }
  }
  return { out: outP, in: inP, inItems, outIdx, inIdx };
}

function localPorts(e) {
  if (MACHINES[e.type] && MACHINES[e.type].kind === 'factory') return factoryPorts(e);
  if (e.type === 'termIn') return { out: [{ x: 0, z: 0.9 }], in: [], inItems: [] };
  /* Both terminals face inward: rotation already points their front at the interior,
     so an output's input port belongs at the front too, not behind it against the wall. */
  if (e.type === 'termOut') return { out: [], in: [{ x: 0, z: 0.9 }], inItems: [null] };
  const d = MACHINES[e.type];
  const fd = d.h / 2, cr = d.w / 2;
  const at = (fwd, side) => ({ x: side, z: fwd });
  if (d.kind === 'splitter') {
    return { out: [at(fd, 0), at(0, cr), at(0, -cr)], in: [at(-fd, 0)], inItems: [null] };
  }
  if (d.kind === 'merger') {
    return { out: [at(fd, 0)], in: [at(-fd, 0), at(0, cr), at(0, -cr)], inItems: [null, null, null] };
  }
  if (d.kind === 'sink') {
    return { out: [], in: [at(fd, 0), at(-fd, 0), at(0, cr), at(0, -cr)], inItems: [null, null, null, null] };
  }
  const r = recipeOf(e);
  const items = r ? Object.keys(r.in) : [];
  const ins = items.map((_, i) => {
    const spread = items.length > 1 ? (i / (items.length - 1) - 0.5) * (cr * 1.25) : 0;
    return at(-fd, spread);
  });
  return { out: [at(fd, 0)], in: ins, inItems: items };
}

/* rotation for the renderer, and the matching local -> world transform.
   rotation.y = rot * 90 deg maps local (x=side, z=fwd) to the same world offset
   portsOf produces; the opposite sign puts every port 180 degrees out. */
const machineYaw = (e) => (e.rot % 4) * Math.PI / 2;

function portsOf(e) {
  const dir = DIRS[e.rot % 4];
  const perp = [dir[1], -dir[0]];
  const lp = localPorts(e);
  const tf = (p) => ({
    x: e.x + dir[0] * p.z + perp[0] * p.x,
    z: e.z + dir[1] * p.z + perp[1] * p.x,
  });
  return { out: lp.out.map(tf), in: lp.in.map(tf), inItems: lp.inItems, local: lp };
}

const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.z - b.z) ** 2;

/* distance from a point to a segment, for hit-testing painted belts */
function distToSeg(p, a, b) {
  const vx = b.x - a.x, vz = b.z - a.z;
  const wx = p.x - a.x, wz = p.z - a.z;
  const L2 = vx * vx + vz * vz;
  let t = L2 ? (wx * vx + wz * vz) / L2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (a.x + vx * t), p.z - (a.z + vz * t));
}
function distToPath(p, pts) {
  let m = Infinity;
  for (let i = 0; i < pts.length - 1; i++) m = Math.min(m, distToSeg(p, pts[i], pts[i + 1]));
  return m;
}

/* Ramer–Douglas–Peucker */
function simplify(pts, eps) {
  if (pts.length < 3) return pts.slice();
  const keep = new Array(pts.length).fill(false);
  keep[0] = keep[pts.length - 1] = true;
  (function rec(a, b) {
    let worst = -1, wi = -1;
    for (let i = a + 1; i < b; i++) {
      const d = distToSeg(pts[i], pts[a], pts[b]);
      if (d > worst) { worst = d; wi = i; }
    }
    if (worst > eps && wi > 0) { keep[wi] = true; rec(a, wi); rec(wi, b); }
  })(0, pts.length - 1);
  return pts.filter((_, i) => keep[i]);
}

/* Chaikin corner cutting, endpoints pinned */
function chaikin(pts, iters) {
  let p = pts;
  for (let k = 0; k < iters; k++) {
    if (p.length < 3) break;
    const out = [p[0]];
    for (let i = 0; i < p.length - 1; i++) {
      const a = p[i], b = p[i + 1];
      out.push({ x: a.x * 0.75 + b.x * 0.25, z: a.z * 0.75 + b.z * 0.25 });
      out.push({ x: a.x * 0.25 + b.x * 0.75, z: a.z * 0.25 + b.z * 0.75 });
    }
    out.push(p[p.length - 1]);
    p = out;
  }
  return p;
}

/* Laplacian smoothing with the endpoints pinned. Chaikin rounds corners but
   leaves the wander of a dragged finger intact; averaging each interior point
   against its neighbours is what actually takes the jitter out of a hand-drawn
   line. */
function smoothPath(pts, iters) {
  if (pts.length < 3 || iters <= 0) return pts.slice();
  let p = pts.map((q) => ({ x: q.x, z: q.z }));
  for (let k = 0; k < iters; k++) {
    const out = [p[0]];
    for (let i = 1; i < p.length - 1; i++) {
      out.push({
        x: p[i].x * 0.5 + (p[i - 1].x + p[i + 1].x) * 0.25,
        z: p[i].z * 0.5 + (p[i - 1].z + p[i + 1].z) * 0.25,
      });
    }
    out.push(p[p.length - 1]);
    p = out;
  }
  return p;
}

function resample(pts, step) {
  if (pts.length < 2) return pts.slice();
  const out = [pts[0]];
  let carry = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    let seg = Math.hypot(b.x - a.x, b.z - a.z);
    if (seg < 1e-6) continue;
    let t = (step - carry) / seg;
    while (t <= 1) {
      out.push({ x: a.x + (b.x - a.x) * t, z: a.z + (b.z - a.z) * t });
      t += step / seg;
    }
    carry = (carry + seg) % step;
  }
  const last = pts[pts.length - 1];
  if (dist2(out[out.length - 1], last) > 1e-4) out.push(last);
  return out;
}

function minRadius(pts) {
  let m = Infinity;
  for (let i = 1; i < pts.length - 1; i++) {
    const a = pts[i - 1], b = pts[i], c = pts[i + 1];
    const ab = Math.hypot(b.x - a.x, b.z - a.z);
    const bc = Math.hypot(c.x - b.x, c.z - b.z);
    const ac = Math.hypot(c.x - a.x, c.z - a.z);
    /* Resampling leaves a sliver at the tail. A triple containing one is not a real
       corner, and including it made the metric report radii that no part of the belt
       actually turns through. */
    if (ab < 0.05 || bc < 0.05) continue;
    const area = Math.abs((b.x - a.x) * (c.z - a.z) - (c.x - a.x) * (b.z - a.z)) / 2;
    if (area < 1e-7) continue;
    m = Math.min(m, (ab * bc * ac) / (4 * area));
  }
  return m;
}

function arcTable(pts) {
  const arc = [0];
  for (let i = 1; i < pts.length; i++) arc.push(arc[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].z - pts[i - 1].z));
  return arc;
}

/* ============================================================
   THREE SETUP
   ============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa8ada1);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
/* Shadows are the single biggest cue that this is a solid world rather than
   coloured shapes on a plane. Kept cheap: one shadow-casting light, a map sized
   to the plot, and soft filtering. */
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* Camera elevation above the horizon. Lower is more three-quarter and shows the
   solidity of the world; higher keeps belt routes legible because tall machines
   occlude less. Three fixed steps, no free orbit (§10). */
const PITCH_STEPS = [36, 44, 54].map((d) => d * Math.PI / 180);
let pitchIdx = 2, pitch = PITCH_STEPS[pitchIdx], pitchTarget = pitch;
let yaw = 0, yawTarget = 0, zoom = 34, camCenter = new THREE.Vector3(7, 0, 7);
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 400);

function layoutCamera() {
  renderer.setSize(innerWidth, innerHeight);
  const aspect = innerWidth / innerHeight;
  camera.left = -zoom * aspect / 2; camera.right = zoom * aspect / 2;
  camera.top = zoom / 2; camera.bottom = -zoom / 2;
  camera.updateProjectionMatrix();
}
function placeCamera() {
  const d = 100;
  camera.position.set(
    camCenter.x + Math.sin(yaw) * Math.cos(pitch) * d,
    Math.sin(pitch) * d,
    camCenter.z + Math.cos(yaw) * Math.cos(pitch) * d
  );
  camera.up.set(0, 1, 0);
  camera.lookAt(camCenter);
}

/* sky gradient as the background, so the horizon is not a flat wash */
(function sky() {
  const c = document.createElement('canvas');
  c.width = 8; c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 128);
  grad.addColorStop(0.00, '#9fb6c4');
  grad.addColorStop(0.55, '#c2cbc6');
  grad.addColorStop(1.00, '#d8d6c6');
  g.fillStyle = grad;
  g.fillRect(0, 0, 8, 128);
  const t = new THREE.CanvasTexture(c);
  scene.background = t;
})();

/* Intensities are chosen so that hemisphere + sun + fill on an up-facing surface
   sums to just under 1.0. Stacking them past that silently clips every pale
   surface to pure white, which is what happened to the concrete slab.
   test/harness.js asserts the sum, so it cannot drift again unnoticed. */
scene.add(new THREE.HemisphereLight(0xdce9f2, 0x6d6a54, 0.45));

const sun = new THREE.DirectionalLight(0xfff2d8, 0.68);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.02;
scene.add(sun);
scene.add(sun.target);

/* a dim fill from the opposite side so shadowed faces do not go to mud */
const fill = new THREE.DirectionalLight(0xc8d8e8, 0.10);
fill.position.set(16, 14, -12);
scene.add(fill);

/* The shadow camera must actually contain the plot or shadows silently vanish at
   the edges. Sized from the level on load rather than guessed once. */
function aimSun() {
  const cx = L ? L.w / 2 : 8, cz = L ? L.h / 2 : 8;
  const span = L ? Math.max(L.w, L.h) : 20;
  sun.target.position.set(cx, 0, cz);
  sun.position.set(cx - span * 0.55, span * 1.15, cz + span * 0.62);
  const r = span * 0.95;
  const s = sun.shadow.camera;
  s.left = -r; s.right = r; s.top = r; s.bottom = -r;
  s.near = 0.5; s.far = span * 3.2;
  s.updateProjectionMatrix();
}

const world = new THREE.Group();
scene.add(world);
const gPad = new THREE.Group(), gMachines = new THREE.Group(), gBelts = new THREE.Group(),
      gRings = new THREE.Group(), gItems = new THREE.Group(), gGhost = new THREE.Group(),
      gEnv = new THREE.Group();
world.add(gEnv, gPad, gBelts, gMachines, gRings, gItems, gGhost);

/* deterministic scatter, so the landscape is identical every reload */
function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

const raycaster = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

function clear(g) {
  while (g.children.length) {
    const c = g.children.pop();
    if (c.geometry) c.geometry.dispose();
    if (c.material) (Array.isArray(c.material) ? c.material : [c.material]).forEach((m) => m.dispose());
  }
}

/* ============================================================
   PLOT — no grid. The edge is a ruler instead, because the
   currency is metres of belt.
   ============================================================ */
function buildPad() {
  clear(gPad);
  clear(gEnv);
  aimSun();

  if (inFactory()) {
    /* Inside a factory: a floor with walls. Terminals go on the walls, and their
       position along a wall is where the port appears on the outside of the box. */
    const fl = new THREE.Mesh(new THREE.BoxGeometry(L.w, 0.5, L.h),
      new THREE.MeshLambertMaterial({ color: 0xb9b6a6 }));
    fl.position.set(L.w / 2, -0.25, L.h / 2);
    fl.receiveShadow = true;
    gPad.add(fl);
    const wallMat = new THREE.MeshLambertMaterial({ color: 0x8e8b7c });
    const wh = 1.1, th = 0.3;
    const walls = [
      [L.w / 2, -th / 2, L.w + th * 2, th], [L.w / 2, L.h + th / 2, L.w + th * 2, th],
    ];
    for (const [x, z, w, d] of walls) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, wh, d), wallMat);
      m.position.set(x, wh / 2 - 0.02, z);
      m.castShadow = true; m.receiveShadow = true;
      gPad.add(m);
    }
    for (const x of [-th / 2, L.w + th / 2]) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(th, wh, L.h + th * 2), wallMat);
      m.position.set(x, wh / 2 - 0.02, L.h / 2);
      m.castShadow = true; m.receiveShadow = true;
      gPad.add(m);
    }
    const ticks = [];
    for (let x = 0; x <= L.w; x++) ticks.push(x, 0.02, 0, x, 0.02, x % 5 === 0 ? 0.5 : 0.22);
    for (let z = 0; z <= L.h; z++) ticks.push(0, 0.02, z, z % 5 === 0 ? 0.5 : 0.22, 0.02, z);
    const tg = new THREE.BufferGeometry();
    tg.setAttribute('position', new THREE.Float32BufferAttribute(ticks, 3));
    gPad.add(new THREE.LineSegments(tg, new THREE.LineBasicMaterial({ color: 0x74705f })));
    return;
  }

  /* ---- concrete slab: the buildable plot, with a chamfered rim ---- */
  const slabH = 0.55;
  const slab = new THREE.Mesh(new THREE.BoxGeometry(L.w, slabH, L.h),
    new THREE.MeshLambertMaterial({ color: 0xc6c3b4 }));
  slab.position.set(L.w / 2, -slabH / 2 + 0.02, L.h / 2);
  slab.receiveShadow = true;
  gPad.add(slab);

  /* a slightly wider, darker apron so the slab reads as poured, not floating */
  const apron = new THREE.Mesh(new THREE.BoxGeometry(L.w + 0.9, 0.34, L.h + 0.9),
    new THREE.MeshLambertMaterial({ color: 0xa89f8c }));
  apron.position.set(L.w / 2, -0.34, L.h / 2);
  apron.receiveShadow = true;
  gPad.add(apron);

  /* ---- ruler ticks along the slab edge: the currency is metres ---- */
  const ticks = [];
  const y = 0.025;
  for (let x = 0; x <= L.w; x++) { const t = x % 5 === 0 ? 0.66 : 0.28; ticks.push(x, y, 0, x, y, t, x, y, L.h, x, y, L.h - t); }
  for (let z = 0; z <= L.h; z++) { const t = z % 5 === 0 ? 0.66 : 0.28; ticks.push(0, y, z, t, y, z, L.w, y, z, L.w - t, y, z); }
  const tg = new THREE.BufferGeometry();
  tg.setAttribute('position', new THREE.Float32BufferAttribute(ticks, 3));
  gPad.add(new THREE.LineSegments(tg, new THREE.LineBasicMaterial({ color: 0x8d8b7d })));

  /* ---- terrain the slab sits in ---- */
  const PAD = 60;   /* wide enough that a shallow pitch never shows the terrain edge */
  const seg = 44;
  const gw = L.w + PAD * 2, gh = L.h + PAD * 2;
  const ground = new THREE.PlaneGeometry(gw, gh, seg, seg);
  ground.rotateX(-Math.PI / 2);
  const pos = ground.attributes.position;
  const col = [];
  const r0 = rng(1337);
  const noise = [];
  for (let i = 0; i < (seg + 1) * (seg + 1); i++) noise.push(r0());
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i) + L.w / 2, z = pos.getZ(i) + L.h / 2;
    /* stay perfectly flat under and near the slab, roll gently further out */
    const outX = Math.max(0, Math.max(-x, x - L.w));
    const outZ = Math.max(0, Math.max(-z, z - L.h));
    const out = Math.hypot(outX, outZ);
    const ramp = Math.min(1, Math.max(0, (out - 3) / 16));
    const n = noise[i % noise.length];
    pos.setY(i, -0.5 + ramp * (n * 2.6 - 0.6) * 1.15);
    const g = 0.5 + n * 0.16 + ramp * 0.06;
    col.push(0.40 * g + 0.10, 0.44 * g + 0.09, 0.30 * g + 0.07);
  }
  ground.computeVertexNormals();
  ground.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  const groundMesh = new THREE.Mesh(ground,
    new THREE.MeshLambertMaterial({ vertexColors: true }));
  groundMesh.position.set(L.w / 2, 0, L.h / 2);
  groundMesh.receiveShadow = true;
  gEnv.add(groundMesh);

  /* ---- scattered boulders and scrub outside the plot ---- */
  const rr = rng(90210);
  const bould = [], tuft = [];
  const scatter = Math.round(200 * ((L.w + PAD * 2) * (L.h + PAD * 2)) / 6000);
  for (let i = 0; i < scatter; i++) {
    const x = -PAD + rr() * (L.w + PAD * 2), z = -PAD + rr() * (L.h + PAD * 2);
    const outside = x < -2.4 || z < -2.4 || x > L.w + 2.4 || z > L.h + 2.4;
    if (!outside) continue;
    (rr() < 0.42 ? bould : tuft).push([x, z, 0.4 + rr() * 1.5, rr() * 6.28]);
  }
  if (bould.length) {
    const m = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1, 0),
      new THREE.MeshLambertMaterial({ color: 0x87897c }), bould.length);
    const mx = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
    bould.forEach(([x, z, s, a], i) => {
      e.set(a * 0.3, a, a * 0.2); q.setFromEuler(e);
      mx.compose(new THREE.Vector3(x, -0.35 + s * 0.3, z), q, new THREE.Vector3(s * 0.6, s * 0.45, s * 0.6));
      m.setMatrixAt(i, mx);
    });
    m.receiveShadow = true;
    gEnv.add(m);
  }
  if (tuft.length) {
    const m = new THREE.InstancedMesh(new THREE.ConeGeometry(0.42, 1.5, 5),
      new THREE.MeshLambertMaterial({ color: 0x5f6b45 }), tuft.length);
    const mx = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
    tuft.forEach(([x, z, s, a], i) => {
      e.set(0, a, 0); q.setFromEuler(e);
      mx.compose(new THREE.Vector3(x, -0.4 + s * 0.5, z), q, new THREE.Vector3(s, s * 1.3, s));
      m.setMatrixAt(i, mx);
    });
    gEnv.add(m);
  }

  /* ---- ore nodes: a cluster of exposed ore, not a plain disc ---- */
  for (const n of L.nodes) {
    const pit = new THREE.Mesh(new THREE.CylinderGeometry(1.16, 1.02, 0.18, 28),
      new THREE.MeshLambertMaterial({ color: 0x6a5b4a }));
    pit.position.set(n.x, 0.05, n.z);
    pit.receiveShadow = true;
    gPad.add(pit);
    const nr = rng(Math.round(n.x * 97 + n.z * 31));
    for (let i = 0; i < 9; i++) {
      const a = nr() * 6.283, d = nr() * 0.82, s = 0.15 + nr() * 0.2;
      const lump = new THREE.Mesh(new THREE.IcosahedronGeometry(s, 0),
        new THREE.MeshLambertMaterial({ color: n.rate >= 60 ? 0xa8734a : 0x8d7b6b }));
      lump.position.set(n.x + Math.cos(a) * d, 0.13 + s * 0.5, n.z + Math.sin(a) * d);
      lump.rotation.set(a, a * 1.7, a * 0.4);
      lump.castShadow = true;
      gPad.add(lump);
    }
    const s = makeSprite(n.rate + '/min');
    s.position.set(n.x, 1.05, n.z);
    gPad.add(s);
  }

  /* ---- obstacle rocks on the plot ---- */
  for (const r of L.rocks) {
    const g = new THREE.Group();
    const main = new THREE.Mesh(new THREE.DodecahedronGeometry(r.r, 0),
      new THREE.MeshLambertMaterial({ color: 0x8b8d83 }));
    main.position.y = r.r * 0.62;
    main.rotation.set(r.x, r.z, 0.4);
    main.scale.set(1, 0.82, 1);
    main.castShadow = true; main.receiveShadow = true;
    g.add(main);
    const chip = new THREE.Mesh(new THREE.DodecahedronGeometry(r.r * 0.42, 0),
      new THREE.MeshLambertMaterial({ color: 0x9a9c91 }));
    chip.position.set(r.r * 0.72, r.r * 0.28, -r.r * 0.5);
    chip.rotation.set(r.z, r.x, 1.1);
    chip.castShadow = true;
    g.add(chip);
    g.position.set(r.x, 0, r.z);
    gPad.add(g);
  }
}

function makeSprite(text) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  g.font = '700 34px ui-monospace, Menlo, monospace';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#2b241c';
  g.fillText(text, 128, 32);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
  sp.scale.set(2.6, 0.65, 1);
  return sp;
}

/* ============================================================
   PLACEMENT
   ============================================================ */
function canPlace(type, x, z, rot, ignore) {
  const probe = { type, x, z, rot };
  if (MACHINES[type].wallFixture) {
    /* A wall fixture is meant to be flush with the boundary, so the margin the plot
       check enforces would always reject it. It only has to stay within the plot. */
    const wb = boxOf(probe);
    if (wb.x0 < -0.02 || wb.z0 < -0.02 || wb.x1 > L.w + 0.02 || wb.z1 > L.h + 0.02) {
      return 'Must sit against a wall.';
    }
  } else if (!inPlot(probe)) return 'Outside the plot.';
  const b = boxOf(probe);
  for (const o of ents) {
    if (o === ignore) continue;
    if (boxesOverlap(b, boxOf(o))) return 'That overlaps ' + MACHINES[o.type].name + '.';
  }
  for (const r of L.rocks) {
    if (inBox({ x: r.x, z: r.z }, { x0: b.x0 - r.r, x1: b.x1 + r.r, z0: b.z0 - r.r, z1: b.z1 + r.r })) return 'There is a rock there.';
  }
  const bi = boxOf(probe, BELT_HW);
  for (const l of links) {
    for (const p of l.path) if (inBox(p, bi)) return 'A belt runs through there.';
  }
  if (MACHINES[type].kind === 'miner') {
    const n = L.nodes.find((n) => dist2(n, { x, z }) < 1.1 * 1.1);
    if (!n) return 'A miner must sit on an ore node.';
  }
  return null;
}

function addEntity(type, x, z, rot) {
  const def = MACHINES[type];
  const e = { id: 'e' + (nextId++), type, x, z, rot: rot || 0, recipe: def.recipes[0] ? def.recipes[0].id : null };
  if (def.kind === 'miner') {
    const n = L.nodes.find((n) => dist2(n, { x, z }) < 1.4 * 1.4);
    e.x = n ? n.x : x; e.z = n ? n.z : z;
    e.nodeRate = n ? n.rate : 30;
  }
  ents.push(e);
  return e;
}
/* Edit the arrays in place. Inside a factory, `ents` and `links` ARE the design's
   arrays; reassigning them detaches the edit from the design, so a change made inside
   a placed box quietly failed to stick. */
function dropWhere(arr, pred) {
  for (let i = arr.length - 1; i >= 0; i--) if (pred(arr[i])) arr.splice(i, 1);
}

function removeEntity(e) {
  dropWhere(ents, (x) => x === e);
  dropWhere(links, (l) => l.from === e.id || l.to === e.id);
}
const entById = (id) => ents.find((e) => e.id === id);

function entAt(p) {
  for (const e of ents) if (inBox(p, boxOf(e, 0.1))) return e;
  return null;
}
function beltAt(p) {
  for (const l of links) if (distToPath(p, l.path) < BELT_HW + 0.18) return l;
  return null;
}

/* ============================================================
   BELT PAINTING
   ============================================================ */
function outItemOf(e, depth) {
  if (!e || (depth || 0) > 12) return null;
  const d = MACHINES[e.type];
  if (d.kind === 'factory') {
    const pi = e.portItems || {};
    const k = Object.keys(pi);
    return k.length ? pi[k[0]] : null;      /* null means "unknown yet", not "wrong" */
  }
  if (e.type === 'termIn') {
    const up = links.find((l) => l.to === e.id);
    return up ? outItemOf(entById(up.from), (depth || 0) + 1) : (e.feedItem || null);
  }
  if (d.kind === 'splitter' || d.kind === 'merger') {
    const up = links.find((l) => l.to === e.id);
    return up ? outItemOf(entById(up.from), (depth || 0) + 1) : null;
  }
  const r = recipeOf(e);
  return (r && Object.keys(r.out)[0]) || null;
}

/* which output port is still free? */
function freeOutPort(e) {
  const ports = portsOf(e).out;
  const used = links.filter((l) => l.from === e.id).map((l) => (l.slotFrom == null ? l.fromPort : l.slotFrom));
  for (let i = 0; i < ports.length; i++) if (!used.includes(i)) return i;
  return -1;
}
/* which input port accepts this item? */
/* Which items are already arriving here. Resolved from a belt's actual contents where
   the line has run, and from the source's recipe otherwise. */
function inboundItems(e, exclude) {
  const set = new Set();
  for (const l of links) {
    if (l.to !== e.id || l === exclude) continue;
    const it = l.item || outItemOf(entById(l.from));
    if (it) set.add(it);
  }
  return set;
}

function freeInPort(e, item) {
  const P = portsOf(e);
  const def = MACHINES[e.type];
  const inbound = links.filter((l) => l.to === e.id);
  const slots = inbound.map((l) => (l.slotTo == null ? l.toPort : l.slotTo));

  if (def.kind === 'sink') {
    return inbound.length >= depotCap() ? -1 : Math.min(inbound.length, P.in.length - 1);
  }

  /* Untyped inputs — splitters, mergers, factory terminals — accept whatever arrives, so
     for them a slot really is a position, claimed first come first served. */
  const typed = P.inItems.some((x) => x != null);
  if (!typed) {
    for (let i = 0; i < P.in.length; i++) if (!slots.includes(i)) return i;
    return -1;
  }

  /* Typed inputs: what matters is one belt per required item, not which slot index it
     happened to claim. Claiming by position became wrong the moment attachment stopped
     being positional — a screw belt whose item was not yet known, arriving from a merger
     with nothing upstream, would claim slot 0, the PLATE slot, and plates were then
     refused as already taken even though none were arriving. */
  const taken = inboundItems(e);
  if (item) {
    const i = P.inItems.indexOf(item);
    return (i < 0 || taken.has(item)) ? -1 : i;
  }
  for (let i = 0; i < P.inItems.length; i++) {
    if (!taken.has(P.inItems[i]) && !slots.includes(i)) return i;
  }
  return -1;
}

function portError(a, b, item) {
  const da = MACHINES[a.type], db = MACHINES[b.type];
  if (a === b) return 'A belt needs two different machines.';
  if (da.kind === 'sink') return 'The depot only receives.';
  if (db.kind === 'miner') return 'A miner takes no input.';
  if (freeOutPort(a) < 0) {
    return da.kind === 'splitter'
      ? 'That splitter is full — three outputs is the limit.'
      : da.name + ' has one output port. Place a splitter to fan the line out.';
  }
  if (db.kind === 'factory' || db.type === 'termOut' || db.kind === 'pass') {
    /* a factory or a terminal takes whatever is offered; the interior decides */
  } else if (db.kind !== 'sink' && db.kind !== 'splitter' && db.kind !== 'merger') {
    const r = recipeOf(b);
    if (!r || !Object.keys(r.in).length) return db.name + ' takes no input.';
    if (item && !r.in[item]) return db.name + ' has no use for ' + ITEMS[item].name + '.';
  }
  if (freeInPort(b, item) < 0) {
    if (db.kind === 'sink') {
      const n = depotCap();
      return 'The Depot accepts ' + n + ' belt' + (n === 1 ? '' : 's') + ' here — merge your lines first.';
    }
    if (db.kind === 'merger') return 'That merger is full — three inputs is the limit.';
    if (db.kind === 'splitter') return 'A splitter takes one input. Use a merger to combine lines.';
    if (item && inboundItems(b).has(item)) return 'A belt is already delivering ' + ITEMS[item].name + ' here.';
    return item ? db.name + ' cannot take more ' + ITEMS[item].name + '.' : 'All inputs are fed.';
  }
  return null;
}

/* Does a painted route keep clear of everything it should? */
function routeBlocked(pts, srcEnt, dstEnt) {
  for (const e of ents) {
    if (e === srcEnt || e === dstEnt) continue;
    const b = boxOf(e, CLEARANCE);
    for (const p of pts) if (inBox(p, b)) return 'The route runs into ' + MACHINES[e.type].name + '.';
  }
  for (const r of L.rocks) {
    const rr = (r.r + CLEARANCE) ** 2;
    for (const p of pts) if (dist2(p, r) < rr) return 'The route clips a rock.';
  }
  for (const p of pts) {
    if (p.x < 0.2 || p.z < 0.2 || p.x > L.w - 0.2 || p.z > L.h - 0.2) return 'The route leaves the plot.';
  }
  return null;
}

/* Turn a raw finger stroke into a conveyor: simplify, round the corners,
   then keep smoothing until it respects a minimum turn radius. */
/* ---- rectilinear routing ----
   A hand-drawn curve looks organic; a factory looks orthogonal. So the preferred
   route is axis-aligned runs joined by filleted corners, following the shape the
   player drew rather than replacing it. The old organic smoothing is kept as a
   fallback for when a right-angled route will not fit past an obstacle. */

/* ---- where a belt meets a machine ----
   Machines used to expose a single fixed output point on one face. That is a
   geometric constraint masquerading as a logical one: what the puzzle needs is that a
   machine has one output *connection*, not that the connection lives at one *spot*.
   The fixed spot only made routing awkward — a machine turned toward the plot edge
   forced the belt to loop out of bounds — so a belt now meets the machine at the point
   on its perimeter nearest whatever it is connecting to.

   Factories keep designed positions, because there a port's place on the box is how
   the player tells one terminal from another. */
function attachOn(e, toward) {
  const b = boxOf(e, 0.06);
  const cx = (b.x0 + b.x1) / 2, cz = (b.z0 + b.z1) / 2;
  const ex = (b.x1 - b.x0) / 2, ez = (b.z1 - b.z0) / 2;
  const dx = toward.x - cx, dz = toward.z - cz;
  /* pick the face the target is most clearly on, measured relative to the footprint */
  if (Math.abs(dx) / Math.max(0.01, ex) >= Math.abs(dz) / Math.max(0.01, ez)) {
    const nx = Math.sign(dx) || 1;
    return { x: cx + nx * ex, z: Math.max(b.z0 + 0.3, Math.min(b.z1 - 0.3, toward.z)),
             n: { x: nx, z: 0 } };
  }
  const nz = Math.sign(dz) || 1;
  return { x: Math.max(b.x0 + 0.3, Math.min(b.x1 - 0.3, toward.x)), z: cz + nz * ez,
           n: { x: 0, z: nz } };
}

const hasFixedPorts = (e) => MACHINES[e.type].kind === 'factory' || MACHINES[e.type].kind === 'pass';

/* Resolve both ends of a belt: fixed geometry where it carries meaning, otherwise the
   nearest perimeter point to the other end. */
function beltEnds(a, aSlot, b, bSlot, raw) {
  const aim = (from, to, hintPt) => hintPt || { x: to.x, z: to.z };
  let pa, na, pb, nb;
  if (hasFixedPorts(a)) {
    pa = portsOf(a).out[aSlot];
    na = portNormal(a, pa);
  } else {
    const t = attachOn(a, aim(a, b, raw && raw.length > 2 ? raw[Math.min(2, raw.length - 1)] : null));
    pa = { x: t.x, z: t.z }; na = t.n;
  }
  if (hasFixedPorts(b)) {
    pb = portsOf(b).in[bSlot];
    nb = portNormal(b, pb);
  } else {
    const t = attachOn(b, aim(b, a, raw && raw.length > 2 ? raw[Math.max(0, raw.length - 3)] : null));
    pb = { x: t.x, z: t.z }; nb = t.n;
  }

  /* Where a belt meets a face, the coordinate ALONG that face is free. If both ends are
     free and their faces are parallel, choose a shared value so the run lines up — two
     approach runs that differ by a few centimetres would otherwise force an elbow too
     short to fillet, which is the ugliest thing a corner can be. */
  if (!hasFixedPorts(a) && !hasFixedPorts(b) && na.x === 0 && nb.x === 0) {
    const ba = boxOf(a, 0.06), bb = boxOf(b, 0.06);
    const lo = Math.max(ba.x0 + 0.3, bb.x0 + 0.3), hi = Math.min(ba.x1 - 0.3, bb.x1 - 0.3);
    if (lo <= hi) { const x = Math.max(lo, Math.min(hi, (pa.x + pb.x) / 2)); pa.x = x; pb.x = x; }
  } else if (!hasFixedPorts(a) && !hasFixedPorts(b) && na.z === 0 && nb.z === 0) {
    const ba = boxOf(a, 0.06), bb = boxOf(b, 0.06);
    const lo = Math.max(ba.z0 + 0.3, bb.z0 + 0.3), hi = Math.min(ba.z1 - 0.3, bb.z1 - 0.3);
    if (lo <= hi) { const z = Math.max(lo, Math.min(hi, (pa.z + pb.z) / 2)); pa.z = z; pb.z = z; }
  }
  return { pa, na, pb, nb };
}

/* which way a port faces, taken from where it sits relative to the machine centre */
function portNormal(e, p) {
  const dx = p.x - e.x, dz = p.z - e.z;
  return Math.abs(dx) >= Math.abs(dz)
    ? { x: Math.sign(dx) || 1, z: 0 }
    : { x: 0, z: Math.sign(dz) || 1 };
}

function mergeCollinear(pts) {
  if (pts.length < 3) return pts.slice();
  const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++) {
    const a = out[out.length - 1], b = pts[i], c = pts[i + 1];
    const cross = (b.x - a.x) * (c.z - a.z) - (c.x - a.x) * (b.z - a.z);
    if (Math.abs(cross) > 1e-6) out.push(b);
  }
  out.push(pts[pts.length - 1]);
  return out.filter((p, i, arr) => i === 0 || dist2(p, arr[i - 1]) > 1e-9);
}

/* Straighten out small jogs before routing. A waypoint that sits only a little off
   the previous one's axis would otherwise produce a stub leg too short to fillet, so
   the corner ends up sharp and the run looks fussy. Snapping it into line gives one
   long straight instead — which is also what a tidy factory looks like. */
function deJog(waypoints, minLeg, lockHead, lockTail) {
  if (waypoints.length < 3) return waypoints.slice();
  const out = waypoints.map((p) => ({ x: p.x, z: p.z }));
  const first = Math.max(1, lockHead || 1);
  const last = out.length - 1 - Math.max(1, lockTail || 1);
  /* Only the free middle may move. The port and its approach point are structural:
     nudging the approach off the port's axis is what put a 0.11 m jog immediately
     before the port and left that corner unfilletable. */
  const align = (b, a) => {
    const dx = Math.abs(b.x - a.x), dz = Math.abs(b.z - a.z);
    if (dx < minLeg && dx <= dz) b.x = a.x;
    else if (dz < minLeg && dz < dx) b.z = a.z;
  };
  /* First discard middle waypoints that barely deviate from the line between their
     neighbours. Aligning such a point can only ever satisfy one side, leaving a stub
     against the other — the two passes below used to undo each other over exactly this.
     Dropping it satisfies both. */
  let i = first, lastIdx = last;
  while (i <= lastIdx && out.length > 3) {
    if (distToSeg(out[i], out[i - 1], out[i + 1]) < minLeg * 0.6) { out.splice(i, 1); lastIdx--; }
    else i++;
  }
  for (let k = first; k <= lastIdx; k++) align(out[k], out[k - 1]);
  for (let k = lastIdx; k >= first; k--) align(out[k], out[k + 1]);
  return mergeCollinear(out);
}

/* Replace each leg with an L, choosing the elbow that stays closer to what the
   player actually drew. */
function rectilinear(waypoints, raw) {
  if (waypoints.length < 2) return waypoints.slice();
  const out = [waypoints[0]];
  for (let i = 1; i < waypoints.length; i++) {
    const a = out[out.length - 1], b = waypoints[i];
    if (Math.abs(b.x - a.x) < 1e-4 || Math.abs(b.z - a.z) < 1e-4) { out.push(b); continue; }
    const e1 = { x: b.x, z: a.z }, e2 = { x: a.x, z: b.z };
    const d1 = raw && raw.length > 1 ? distToPath(e1, raw) : 0;
    const d2 = raw && raw.length > 1 ? distToPath(e2, raw) : 1;
    out.push(d1 <= d2 ? e1 : e2);
    out.push(b);
  }
  return mergeCollinear(out);
}

/* Round every corner with a real arc, so the radius is guaranteed rather than
   approached by repeated averaging. */
function filletCorners(pts, r) {
  if (pts.length < 3) return pts.slice();
  const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++) {
    const a = pts[i - 1], b = pts[i], c = pts[i + 1];
    const l1 = Math.hypot(a.x - b.x, a.z - b.z), l2 = Math.hypot(c.x - b.x, c.z - b.z);
    if (l1 < 1e-6 || l2 < 1e-6) continue;
    const v1 = { x: (a.x - b.x) / l1, z: (a.z - b.z) / l1 };
    const v2 = { x: (c.x - b.x) / l2, z: (c.z - b.z) / l2 };
    let cosA = v1.x * v2.x + v1.z * v2.z;
    cosA = Math.max(-1, Math.min(1, cosA));
    const ang = Math.acos(cosA);
    if (ang > Math.PI - 0.02) continue;                 /* straight through */
    const tanHalf = Math.tan(ang / 2);
    if (!isFinite(tanHalf) || tanHalf < 1e-6) { out.push(b); continue; }
    const d = Math.min(r / tanHalf, l1 * 0.49, l2 * 0.49);
    const rad = d * tanHalf;
    const p1 = { x: b.x + v1.x * d, z: b.z + v1.z * d };
    const p2 = { x: b.x + v2.x * d, z: b.z + v2.z * d };
    let bx = v1.x + v2.x, bz = v1.z + v2.z;
    const bl = Math.hypot(bx, bz);
    if (bl < 1e-6) { out.push(b); continue; }
    bx /= bl; bz /= bl;
    const cen = { x: b.x + bx * (rad / Math.sin(ang / 2)), z: b.z + bz * (rad / Math.sin(ang / 2)) };
    const a1 = Math.atan2(p1.z - cen.z, p1.x - cen.x);
    let a2 = Math.atan2(p2.z - cen.z, p2.x - cen.x);
    let sweep = a2 - a1;
    while (sweep > Math.PI) sweep -= 2 * Math.PI;
    while (sweep < -Math.PI) sweep += 2 * Math.PI;
    /* Sample finer than RESAMPLE. A coarse arc is a polygon, and resampling along
       its chords lands points inside the circle, so the measured radius came out
       well below the radius actually built. */
    const steps = Math.max(4, Math.ceil((Math.abs(sweep) * rad) / (RESAMPLE * 0.5)));
    for (let k = 0; k <= steps; k++) {
      const t = a1 + sweep * (k / steps);
      out.push({ x: cen.x + Math.cos(t) * rad, z: cen.z + Math.sin(t) * rad });
    }
  }
  out.push(pts[pts.length - 1]);
  return out;
}

/* Keep smoothing until the path actually respects the minimum turn radius, rather
   than applying a fixed amount and hoping. A fixed number of passes leaves shaky
   input well short of the target, which made MIN_RADIUS decorative. Smoothing is
   monotonically calmer, so this converges. */
function smoothToRadius(pts, maxIter) {
  let p = pts, out = resample(p, RESAMPLE), it = 0;
  while (it < maxIter && minRadius(out) < MIN_RADIUS) {
    p = smoothPath(p, 2);
    it += 2;
    out = resample(p, RESAMPLE);
  }
  return out;
}

const PORT_STUB = 1.2;    /* belts leave and enter square to the machine face */
const MIN_LEG = 1.8;      /* shorter legs than this get straightened out */
let lastOrtho = null;     /* the most recent orthogonal route, for tests */

function buildPath(raw, a, aPort, b, bPort, maxIter) {
  const E = beltEnds(a, aPort, b, bPort, raw);
  const P = { a: E.pa, b: E.pb };
  let pts = [P.a]
    .concat(raw.filter((p) => dist2(p, P.a) > 0.3 * 0.3 && dist2(p, P.b) > 0.3 * 0.3))
    .concat([P.b]);
  pts = simplify(pts, SIMPLIFY_EPS);
  return smoothToRadius(chaikin(pts, 3), maxIter);
}

/* the axis-aligned route: a stub square out of each port, an L through every
   waypoint the player's stroke implies, then real arcs at the corners */
function buildOrthoPath(raw, a, aPort, b, bPort) {
  const E = beltEnds(a, aPort, b, bPort, raw);
  const pa = E.pa, pb = E.pb, na = E.na, nb = E.nb;
  /* The approach runs are deliberately long. With a port pinned in place, an elbow
     landing near it leaves a leg too short to fillet, so the corner comes out sharp
     right where it is most visible. Turning further out fixes it by construction. */
  const span = Math.hypot(pb.x - pa.x, pb.z - pa.z);
  let reach = Math.max(PORT_STUB, Math.min(PORT_STUB + MIN_LEG, span * 0.35));
  let reachA = reach, reachB = reach;
  /* When the two faces look at each other, meet halfway. Using the same fixed reach
     from each end leaves the two approach runs on lines a few centimetres apart, and
     that gap becomes an elbow too short to fillet — the single most persistent source
     of sharp corners in this router. Splitting the distance puts both runs on one line
     and the elbow disappears entirely. */
  const anti = (na.x === -nb.x && na.z === -nb.z) && (na.x !== 0 || na.z !== 0);
  if (anti) {
    const ax = na.x !== 0 ? 'x' : 'z';
    const along = (pb[ax] - pa[ax]) * na[ax];
    if (along > 2 * PORT_STUB) { reachA = along / 2; reachB = along / 2; }
  }
  const apA = { x: pa.x + na.x * reachA, z: pa.z + na.z * reachA };
  const apB = { x: pb.x + nb.x * reachB, z: pb.z + nb.z * reachB };
  /* The approach corridors belong to the approach runs. Filtering the middle by plain
     distance let a stroke point that had already travelled PAST the exit approach
     survive, so the waypoint list zigzagged out and back and left an unfilletable stub
     right at the machine. Measure along each normal instead: only keep points still
     clearly outside both corridors. */
  const outOf = (p, port, nrm) => (p.x - port.x) * nrm.x + (p.z - port.z) * nrm.z;
  const mid = simplify(
    raw.filter((p) => outOf(p, pa, na) > reachA * 0.6 && outOf(p, pb, nb) > reachB * 0.6),
    Math.max(SIMPLIFY_EPS, 0.5));
  const waypoints = deJog(mergeCollinear([pa, apA].concat(mid).concat([apB, pb])), MIN_LEG, 2, 2);
  const ortho = rectilinear(waypoints, raw);
  lastOrtho = { waypoints, ortho, reach };   /* kept for diagnostics */
  return resample(filletCorners(ortho, MIN_RADIUS), RESAMPLE);
}

/* Smoothest first, easing off only as far as needed. Heavy smoothing pulls the
   path away from where the finger actually went, which can push it into an
   obstacle — so clearance is the hard constraint and smoothness gives way to it. */
function finishStroke(raw, a, aPort, b, bPort) {
  /* orthogonal first: it is what makes a plot read as a factory */
  const ortho = buildOrthoPath(raw, a, aPort, b, bPort);
  if (!routeBlocked(ortho, a, b)) return ortho;
  /* if a right-angled route will not fit, fall back to the organic one */
  for (const cap of SMOOTH_CAPS) {
    const out = buildPath(raw, a, aPort, b, bPort, cap);
    if (!routeBlocked(out, a, b)) return out;
  }
  return ortho;   /* commitStroke reports why it will not fit */
}

function commitStroke(raw, endPoint, pickedEnd) {
  const a = stroke.fromEnt;
  const item = outItemOf(a);
  /* find the target: whatever machine the stroke ended on or nearest to */
  let b = (pickedEnd && pickedEnd !== a) ? pickedEnd : entAt(endPoint);
  if (!b) {
    let best = null, bd = SNAP_RADIUS * SNAP_RADIUS;
    for (const e of ents) {
      if (e === a) continue;
      for (const p of portsOf(e).in) {
        const d = dist2(p, endPoint);
        if (d < bd) { bd = d; best = e; }
      }
    }
    b = best;
  }
  if (!b) return toast('End the stroke on a machine.');
  const pe = portError(a, b, item);
  if (pe) return toast(pe);
  const bPort = freeInPort(b, item), aPort = stroke.fromPort;
  const pts = finishStroke(raw, a, aPort, b, bPort);
  const blocked = routeBlocked(pts, a, b);
  if (blocked) return toast(blocked);
  const arc = arcTable(pts);
  const len = arc[arc.length - 1];
  if (len < 0.4) return toast('Too short to be a belt.');
  const tier = BELTS.find((t) => t.id === beltTier) || BELTS[0];
  /* For a factory the port slot and the terminal index are different things: slots
     are ordered for the UI, indices identify the terminal inside. */
  const fp = MACHINES[a.type].kind === 'factory' ? (factoryPorts(a).outIdx[aPort] || 0) : aPort;
  const tp = MACHINES[b.type].kind === 'factory' ? (factoryPorts(b).inIdx[bPort] || 0) : bPort;
  links.push({ id: 'l' + (nextId++), from: a.id, to: b.id, fromPort: fp, toPort: tp,
               slotFrom: aPort, slotTo: bPort,
               cap: tier.cap, tier: tier.id, path: pts, arc, length: len, bumps: [] });
  computeCrossings();
  resolve();
  toast('Belt ' + tier.name + ' · ' + len.toFixed(1) + ' m');
}

/* Where two belts cross, the later one ramps over. This is what the third
   dimension is for (§5.2). */
function computeCrossings() {
  for (const l of links) l.bumps = [];
  for (let i = 0; i < links.length; i++) {
    for (let j = i + 1; j < links.length; j++) {
      const A = links[i], B = links[j];
      for (let x = 0; x < A.path.length - 1; x++) {
        for (let y = 0; y < B.path.length - 1; y++) {
          const hit = segHit(A.path[x], A.path[x + 1], B.path[y], B.path[y + 1]);
          if (!hit) continue;
          const sA = A.arc[x] + hit.t * (A.arc[x + 1] - A.arc[x]);
          const sB = B.arc[y] + hit.u * (B.arc[y + 1] - B.arc[y]);
          /* Two runs feeding the same machine converge near their ports; that is not a
             crossing to ramp over. Guard by distance from each end, not by topology —
             belts sharing a machine can still genuinely cross out in the open. */
          if (sA < ENDPOINT_GUARD || sA > A.length - ENDPOINT_GUARD) continue;
          if (sB < ENDPOINT_GUARD || sB > B.length - ENDPOINT_GUARD) continue;
          if (!B.bumps.some((bp) => Math.abs(bp.s - sB) < 0.7)) B.bumps.push({ s: sB });
        }
      }
    }
  }
}
function segHit(p1, p2, p3, p4) {
  const d1x = p2.x - p1.x, d1z = p2.z - p1.z, d2x = p4.x - p3.x, d2z = p4.z - p3.z;
  const den = d1x * d2z - d1z * d2x;
  if (Math.abs(den) < 1e-9) return null;
  const t = ((p3.x - p1.x) * d2z - (p3.z - p1.z) * d2x) / den;
  const u = ((p3.x - p1.x) * d1z - (p3.z - p1.z) * d1x) / den;
  if (t < 0 || t > 1 || u < 0 || u > 1) return null;
  return { t, u };
}
function yAt(l, s) {
  let y = BELT_Y;
  for (const b of l.bumps) y += BUMP_H * Math.exp(-((s - b.s) ** 2) / (2 * BUMP_SIG * BUMP_SIG));
  return y;
}

/* ============================================================
   RENDER
   ============================================================ */
/* ---- machine bodies ----
   Each type gets its own silhouette. Colour alone does not survive being shrunk
   to thumb size on a phone, and pillar 4 asks for identification at a glance.
   Moving parts are stashed on userData so the frame loop can animate them
   without rebuilding geometry. */
const MAT = (c) => new THREE.MeshLambertMaterial({ color: c });
const STEEL = 0xc9c5b6, DARK = 0x272c2e, TRIM = 0xa39b86;

function part(group, geo, mat, x, y, z, shadow) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  if (shadow !== false) { m.castShadow = true; m.receiveShadow = true; }
  group.add(m);
  return m;
}

function buildMachines() {
  clear(gMachines);
  for (const e of ents) {
    const def = MACHINES[e.type], b = boxOf(e);
    const g = new THREE.Group();
    g.position.set(e.x, 0, e.z);
    g.rotation.y = machineYaw(e);   /* local +Z is the output face */
    const anim = {};
    const body = MAT(MACHINE_COLOR[e.type]);
    /* footprint in local space: depth along Z, width along X */
    const w = def.w, d = def.h;

    if (def.kind === 'miner') {
      part(g, new THREE.BoxGeometry(w - 0.2, 0.4, d - 0.2), body, 0, 0.2, 0);
      /* four legs and a drill tower */
      for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
        part(g, new THREE.BoxGeometry(0.16, 0.9, 0.16), MAT(DARK), sx * (w / 2 - 0.28), 0.45, sz * (d / 2 - 0.28));
      }
      part(g, new THREE.BoxGeometry(w - 0.55, 0.5, d - 0.55), body, 0, 1.05, 0);
      anim.drum = part(g, new THREE.CylinderGeometry(0.34, 0.34, 0.62, 12), MAT(TRIM), 0, 1.55, 0);
      anim.drum.rotation.z = Math.PI / 2;
      part(g, new THREE.ConeGeometry(0.26, 0.7, 8), MAT(DARK), 0, 0.5, 0);
      part(g, new THREE.BoxGeometry(0.34, 0.2, 0.5), MAT(DARK), 0, 0.45, d / 2 - 0.1);

    } else if (e.type === 'smelter') {
      part(g, new THREE.BoxGeometry(w - 0.18, 0.75, d - 0.18), body, 0, 0.375, 0);
      /* firebox mouth glows when it is actually running */
      anim.glow = part(g, new THREE.BoxGeometry(w * 0.5, 0.26, 0.08),
        new THREE.MeshBasicMaterial({ color: 0x2a1a12 }), 0, 0.34, d / 2 - 0.06, false);
      part(g, new THREE.CylinderGeometry(0.2, 0.26, 1.15, 10), MAT(0x6d5f52), -w / 2 + 0.42, 1.2, -d / 2 + 0.42);
      part(g, new THREE.CylinderGeometry(0.26, 0.2, 0.16, 10), MAT(DARK), -w / 2 + 0.42, 1.85, -d / 2 + 0.42);
      part(g, new THREE.BoxGeometry(w * 0.42, 0.3, d * 0.42), MAT(STEEL), w * 0.15, 0.9, 0);
      anim.puff = part(g, new THREE.SphereGeometry(0.3, 8, 6),
        new THREE.MeshLambertMaterial({ color: 0xd8d2c4, transparent: true, opacity: 0.5 }),
        -w / 2 + 0.42, 2.15, -d / 2 + 0.42, false);

    } else if (e.type === 'constructor') {
      part(g, new THREE.BoxGeometry(w - 0.18, 0.5, d - 0.18), body, 0, 0.25, 0);
      part(g, new THREE.BoxGeometry(w - 0.5, 0.32, d - 1.1), MAT(STEEL), 0, 0.66, 0);
      /* gantry with a press head that strokes up and down */
      for (const sx of [-1, 1]) part(g, new THREE.BoxGeometry(0.14, 0.95, 0.14), MAT(DARK), sx * (w / 2 - 0.24), 0.97, 0);
      part(g, new THREE.BoxGeometry(w - 0.3, 0.16, 0.4), MAT(DARK), 0, 1.42, 0);
      anim.press = part(g, new THREE.BoxGeometry(w - 0.72, 0.3, 0.5), MAT(TRIM), 0, 1.05, 0);
      part(g, new THREE.BoxGeometry(0.3, 0.18, 0.44), MAT(DARK), 0, 0.4, d / 2 - 0.08);

    } else if (e.type === 'assembler') {
      part(g, new THREE.BoxGeometry(w - 0.18, 0.46, d - 0.18), body, 0, 0.23, 0);
      part(g, new THREE.BoxGeometry(w - 0.7, 0.14, d - 0.7), MAT(0x3a3f41), 0, 0.53, 0);
      /* two arms that sweep in opposite directions */
      for (const s of [-1, 1]) {
        const post = new THREE.Group();
        post.position.set(s * (w / 2 - 0.62), 0.6, s * 0.5);
        part(post, new THREE.CylinderGeometry(0.17, 0.2, 0.5, 10), MAT(DARK), 0, 0.25, 0);
        const arm = new THREE.Group();
        arm.position.y = 0.5;
        part(arm, new THREE.BoxGeometry(0.9, 0.13, 0.16), MAT(TRIM), 0.45, 0, 0);
        part(arm, new THREE.BoxGeometry(0.2, 0.26, 0.2), MAT(STEEL), 0.9, -0.08, 0);
        post.add(arm);
        g.add(post);
        (anim.arms = anim.arms || []).push(arm);
      }
      part(g, new THREE.BoxGeometry(w * 0.5, 0.34, 0.3), MAT(STEEL), 0, 0.68, -d / 2 + 0.3);
      part(g, new THREE.BoxGeometry(0.34, 0.2, 0.4), MAT(DARK), 0, 0.4, d / 2 - 0.1);

    } else if (def.kind === 'splitter' || def.kind === 'merger') {
      part(g, new THREE.CylinderGeometry(0.46, 0.5, 0.3, 6), body, 0, 0.15, 0);
      part(g, new THREE.CylinderGeometry(0.2, 0.2, 0.1, 8), MAT(STEEL), 0, 0.33, 0);

    } else if (def.kind === 'factory') {
      /* a shell, deliberately blank: what matters is inside */
      part(g, new THREE.BoxGeometry(w - 0.15, 0.9, d - 0.15), MAT(0x4a5b63), 0, 0.45, 0);
      part(g, new THREE.BoxGeometry(w - 0.9, 0.16, d - 0.9), MAT(0x8fa0a8), 0, 0.96, 0);
      for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
        part(g, new THREE.BoxGeometry(0.22, 1.0, 0.22), MAT(0x2f3a40), sx * (w / 2 - 0.2), 0.5, sz * (d / 2 - 0.2));
      }
    } else if (e.type === 'termIn' || e.type === 'termOut') {
      const c = e.type === 'termIn' ? 0x4d7a4f : 0x7a4d4d;
      part(g, new THREE.BoxGeometry(0.9, 0.75, 1.7), MAT(c), 0, 0.375, 0);
      part(g, new THREE.BoxGeometry(0.5, 0.2, 0.5), MAT(0xe0dccd), 0, 0.8, 0);
    } else if (def.kind === 'sink') {
      /* a depot shed, open toward the plot */
      part(g, new THREE.BoxGeometry(w, 0.22, d), MAT(0x8e8b7a), 0, 0.11, 0);
      part(g, new THREE.BoxGeometry(w - 0.1, 0.9, 0.16), body, 0, 0.55, -d / 2 + 0.08);
      for (const s of [-1, 1]) part(g, new THREE.BoxGeometry(0.16, 0.9, d - 0.2), body, s * (w / 2 - 0.08), 0.55, 0);
      const roof = part(g, new THREE.BoxGeometry(w + 0.3, 0.12, d + 0.3), MAT(0x445a4c), 0, 1.06, 0);
      roof.rotation.x = 0.04;
      part(g, new THREE.BoxGeometry(w * 0.7, 0.1, 0.1), MAT(TRIM), 0, 0.22, d / 2 - 0.2);
    }

    /* ---- ports ----
       Placed in local space. The group is already rotated, so using world offsets
       here would rotate them a second time and put every port on the wrong face. */
    const P = localPorts(e);
    P.out.forEach((p, i) => {
      part(g, new THREE.BoxGeometry(0.4, 0.22, 0.3), MAT(DARK), p.x, 0.34, p.z);
      part(g, new THREE.BoxGeometry(0.3, 0.07, 0.18), MAT(0x8f9a5a), p.x, 0.47, p.z, false);
      /* An unused output gets a bobbing arrow. Removing the Belt cards and the Paint
         belt tool in the same pass left nothing in the interface hinting that belts
         exist at all, so the gesture had to be taught where it is performed. */
      const used = links.some((l) => l.from === e.id && (l.slotFrom == null ? l.fromPort : l.slotFrom) === i);
      if (!used && def.kind !== 'sink') {
        const arrow = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.34, 4),
          new THREE.MeshBasicMaterial({ color: 0x2f6f8f, transparent: true, opacity: 0.85 }));
        arrow.position.set(p.x, 0.78, p.z);
        arrow.rotation.x = Math.PI;
        g.add(arrow);
        (anim.hints = anim.hints || []).push(arrow);
      }
    });
    P.in.forEach((p, i) => {
      const item = P.inItems[i];
      part(g, new THREE.BoxGeometry(0.36, 0.2, 0.28),
        MAT(item ? ITEMS[item].color : 0xd2cdbe), p.x, 0.32, p.z);
    });

    if (e === selected) {
      /* corner brackets rather than a ring: marks the footprint without adding
         another big circle to the floor */
      const bm = new THREE.MeshBasicMaterial({ color: 0x161d21 });
      const ax = w / 2 + 0.1, az = d / 2 + 0.1, len = 0.36, th = 0.055;
      for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
        const a = new THREE.Mesh(new THREE.BoxGeometry(len, 0.02, th), bm);
        a.position.set(sx * (ax - len / 2), 0.05, sz * az);
        g.add(a);
        const b2 = new THREE.Mesh(new THREE.BoxGeometry(th, 0.02, len), bm);
        b2.position.set(sx * ax, 0.05, sz * (az - len / 2));
        g.add(b2);
      }
    }

    g.userData.anim = anim;
    g.userData.ent = e;
    gMachines.add(g);
  }
}

/* Machine state was shown by a ring on the floor, then by a lamp on a mast. Both
   are gone at the player's request. What remains is quieter and arguably better: a
   machine animates at a speed proportional to its actual rate, so a starved one
   visibly labours and a blocked one stands still. Exact figures live in the planner
   overlay and the inspector, and belts show their own backlog.
   Kept as no-ops so callers do not have to care. */
function buildStatus() {}
function updateStatus() {}

/* ---- conveyor geometry ----
   The belt surface carries a scrolling chevron texture. Because visual belt speed
   is a tuned constant (§5.1) rather than derived from throughput, every belt
   scrolls at the same rate and one shared material can drive them all — the item
   spacing is what conveys the actual rate. UVs run along arc length so the
   pattern does not stretch on curves. */
/* u runs ALONG the belt and v ACROSS it, so canvas x is length and canvas y is
   width. The pattern therefore has to span the full canvas height or only a strip
   of the belt appears to move — which is exactly what went wrong before: the
   chevron covered v 0.09..0.47 and read as a thin line snaking down the middle. */
function beltTexture() {
  const N = 64;
  const c = document.createElement('canvas');
  c.width = N; c.height = N;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, N, N);

  /* a transverse cleat, edge to edge: the clearest possible motion cue */
  g.fillStyle = 'rgba(0,0,0,0.34)';
  g.fillRect(0, 0, 10, N);

  /* and a chevron pointing the way the belt travels, also edge to edge */
  g.strokeStyle = 'rgba(0,0,0,0.22)';
  g.lineWidth = 9;
  g.beginPath();
  g.moveTo(24, 0); g.lineTo(50, N / 2); g.lineTo(24, N);
  g.stroke();

  /* static darkening at both edges so the belt reads as having sides */
  g.fillStyle = 'rgba(0,0,0,0.26)';
  g.fillRect(0, 0, N, 4);
  g.fillRect(0, N - 4, N, 4);

  const t = new THREE.CanvasTexture(c);
  t.wrapS = THREE.RepeatWrapping;
  t.wrapT = THREE.ClampToEdgeWrapping;
  return t;
}
const BELT_TEX = beltTexture();
/* A fresh material per rebuild: clear() disposes the materials of the children it
   removes, so a shared one would be destroyed the first time a belt is edited.
   The texture is shared and survives, which is what the scroll animation needs. */
const newBeltMat = () => new THREE.MeshLambertMaterial({
  vertexColors: true, map: BELT_TEX, side: THREE.DoubleSide });

function ribbon(list, colorFor, withUV, halfWidth) {
  const pos = [], col = [], idx = [], nrm = [], uv = [];
  let base = 0;
  const c = new THREE.Color();
  for (const l of list) {
    const pts = l.path;
    if (!pts || pts.length < 2) continue;
    const arc = l.arc || arcTable(pts);
    colorFor(l, c);
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
      let tx = b.x - a.x, tz = b.z - a.z;
      const tl = Math.hypot(tx, tz) || 1;
      tx /= tl; tz /= tl;
      const y = yAt(l, arc[i]);
      const hw = halfWidth == null ? BELT_HW : halfWidth;
      pos.push(p.x - tz * hw, y, p.z + tx * hw);
      pos.push(p.x + tz * hw, y, p.z - tx * hw);
      nrm.push(0, 1, 0, 0, 1, 0);
      col.push(c.r, c.g, c.b, c.r, c.g, c.b);
      uv.push(arc[i] / BELT_TEX_PERIOD, 0, arc[i] / BELT_TEX_PERIOD, 1);
    }
    for (let i = 0; i < pts.length - 1; i++) {
      const a = base + i * 2;
      idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
    }
    base += pts.length * 2;
  }
  if (!pos.length) return null;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  if (withUV !== false) g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}

function buildBelts() {
  clear(gBelts);
  if (!links.length) return;

  const surface = ribbon(links, (l, c) => {
    const tier = BELTS.find((t) => t.id === l.tier) || BELTS[0];
    c.setHex(tier.color);
    const load = Math.min(1, (l.flow || 0) / l.cap);
    c.lerp(new THREE.Color(0xffffff), 0.02 + load * 0.34);
    if (l.saturated && l.overCapacity) c.setHex(0xc2402f);
  });
  if (surface) {
    const m = new THREE.Mesh(surface, newBeltMat());
    m.receiveShadow = true;
    gBelts.add(m);
  }

  /* side rails and support legs — this is most of what makes a belt read as a
     structure standing on the ground rather than a painted stripe */
  const railGeo = [], legs = [];
  const rail = new THREE.Group();
  for (const l of links) {
    const pts = l.path, arc = l.arc;
    for (let side = -1; side <= 1; side += 2) {
      const rp = [], ra = [];
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
        let tx = b.x - a.x, tz = b.z - a.z;
        const tl = Math.hypot(tx, tz) || 1;
        tx /= tl; tz /= tl;
        rp.push({ x: p.x + (-tz) * side * (BELT_HW + 0.03), z: p.z + tx * side * (BELT_HW + 0.03) });
        ra.push(arc[i]);
      }
      railGeo.push({ path: rp, arc: ra, bumps: l.bumps, tier: l.tier, off: 0.07 });
    }
    for (let s = 0.45; s < l.length; s += 1.5) legs.push({ l, s });
  }
  /* thin strips, not more full-width belt: they used to inherit BELT_HW, which
     tripled the apparent width of every conveyor with untextured grey */
  const railG = ribbon(railGeo, (l, c) => c.setHex(0x545a60), false, RAIL_HW);
  if (railG) {
    /* lift the rails just above the belt surface */
    const p = railG.attributes.position;
    for (let i = 0; i < p.count; i++) p.setY(i, p.getY(i) + 0.055);
    railG.attributes.position.needsUpdate = true;
    const m = new THREE.Mesh(railG, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide }));
    m.castShadow = true;
    gBelts.add(m);
  }
  if (legs.length) {
    const lm = new THREE.InstancedMesh(new THREE.BoxGeometry(0.075, 1, 0.075),
      new THREE.MeshLambertMaterial({ color: 0x4c5257 }), legs.length);
    const mx = new THREE.Matrix4(), q = new THREE.Quaternion(), v = new THREE.Vector3();
    legs.forEach(({ l, s }, i) => {
      const p = posAt(l, s);
      const top = p.y - 0.11;
      const hh = Math.max(0.12, top);
      v.set(p.x, top - hh / 2, p.z);
      mx.compose(v, q, new THREE.Vector3(1, hh, 1));
      lm.setMatrixAt(i, mx);
    });
    lm.castShadow = true;
    gBelts.add(lm);
  }
}

/* ---- items ----
   Distinct shapes per type. An ore lump and an iron plate should be tellable
   apart while zoomed out, which colour alone does not manage. */
const ITEM_GEO = {
  ore:   () => new THREE.IcosahedronGeometry(0.14, 0),
  ingot: () => new THREE.BoxGeometry(0.26, 0.13, 0.17),
  plate: () => new THREE.BoxGeometry(0.28, 0.07, 0.2),
  rod:   () => new THREE.CylinderGeometry(0.055, 0.055, 0.32, 7),
  screw: () => new THREE.CylinderGeometry(0.05, 0.05, 0.17, 6),
  reinf: () => new THREE.BoxGeometry(0.3, 0.1, 0.24),
};
const itemMeshes = {};
function buildItemPools() {
  clear(gItems);
  for (const k of Object.keys(itemMeshes)) delete itemMeshes[k];
  for (const key of Object.keys(ITEMS)) {
    const geo = (ITEM_GEO[key] || (() => new THREE.BoxGeometry(0.24, 0.18, 0.24)))();
    const m = new THREE.InstancedMesh(geo,
      new THREE.MeshLambertMaterial({ color: ITEMS[key].color }), MAX_ITEMS_PER_TYPE);
    m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    m.count = 0; m.frustumCulled = false;
    m.castShadow = true;
    itemMeshes[key] = m;
    gItems.add(m);
  }
}

function posAt(l, s) {
  const arc = l.arc, pts = l.path;
  let i = 1;
  while (i < arc.length - 1 && arc[i] < s) i++;
  const t = (s - arc[i - 1]) / Math.max(1e-6, arc[i] - arc[i - 1]);
  return {
    x: pts[i - 1].x + (pts[i].x - pts[i - 1].x) * t,
    z: pts[i - 1].z + (pts[i].z - pts[i - 1].z) * t,
    y: yAt(l, s) + 0.13,
  };
}

/* ---- items on belts ----
   Each belt keeps an ordered list of item positions along its own arc length,
   front-most first. Every frame each item advances at belt speed but may not come
   closer than JAM_SPACING to the one ahead, so a queue forms by itself where the
   line is blocked.

   The previous version modelled a moving stream and a packed queue as two separate
   things, drawn from different maths: a lattice locked to absolute time, and a
   block of items measured back from the belt's end. Nothing kept the two in step,
   so an arriving item slid over the queue and then snapped to a lattice position up
   to one whole spacing further back. Simulating the items directly removes the seam
   because there is no longer a seam — there is one list. */
function advanceBelts(dt) {
  for (const l of links) {
    if (!l.items) l.items = [];
    if (l.spawnAcc == null) l.spawnAcc = 0;
    if (l.drainAcc == null) l.drainAcc = 0;
    const len = l.length;
    const items = l.items;

    /* the destination removes material at the rate it actually consumes */
    l.drainAcc = Math.min(2, l.drainAcc + ((l.drain || 0) / 60) * dt);
    const intoDepot = MACHINES[(entById(l.to) || {}).type || ''] &&
                      MACHINES[entById(l.to).type].kind === 'sink';
    while (items.length && items[0] >= len - 1e-3 && l.drainAcc >= 1) {
      items.shift();
      l.drainAcc -= 1;
      if (intoDepot && l.item) deliveries.push({ item: l.item, t: clockT });
    }

    /* advance, never overtaking the item ahead */
    for (let i = 0; i < items.length; i++) {
      const limit = i === 0 ? len : items[i - 1] - JAM_SPACING;
      items[i] = Math.min(items[i] + BELT_SPEED * dt, limit);
      if (items[i] < 0) items[i] = 0;
    }

    /* put new material on at the source, if there is room at the back */
    const live = isFinite(l.startT) && clockT >= l.startT;
    l.spawnAcc = Math.min(3, l.spawnAcc + (live ? ((l.flow || 0) / 60) * dt : 0));
    while (l.spawnAcc >= 1) {
      const back = items.length ? items[items.length - 1] : Infinity;
      if (back < JAM_SPACING) break;          /* belt is full at the input end */
      if (items.length >= Math.ceil(len / JAM_SPACING) + 1) break;
      items.push(0);
      l.spawnAcc -= 1;
    }
  }
}

/* room at the input end is what decides whether a source can keep pushing */
function beltHasRoom(l) {
  if (!l.items || !l.items.length) return true;
  return l.items[l.items.length - 1] >= JAM_SPACING;
}
/* how much of the belt is standing still, for the inspector */
function queuedOn(l) {
  if (!l.items || !l.items.length) return 0;
  let n = 0;
  for (let i = 0; i < l.items.length; i++) {
    const limit = i === 0 ? l.length : l.items[i - 1] - JAM_SPACING;
    if (l.items[i] >= limit - 1e-3) n++; else break;
  }
  return n;
}

const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _sc = new THREE.Vector3(1, 1, 1),
      _v = new THREE.Vector3(), _e = new THREE.Euler();
function updateItems(t) {
  const counts = {};
  for (const k of Object.keys(itemMeshes)) counts[k] = 0;
  for (const l of links) {
    if (!l.item || !l.items || !l.items.length) continue;
    const mesh = itemMeshes[l.item];
    if (!mesh) continue;
    const lie = l.item === 'rod' || l.item === 'screw';   /* cylinders lie down */
    for (const s of l.items) {
      if (counts[l.item] >= MAX_ITEMS_PER_TYPE) break;
      const p = posAt(l, s);
      const q = posAt(l, Math.min(l.length, s + 0.25));
      const head = Math.atan2(q.x - p.x, q.z - p.z);
      _e.set(lie ? Math.PI / 2 : 0, head, 0, 'YXZ');
      _q.setFromEuler(_e);
      _v.set(p.x, p.y, p.z);
      _m.compose(_v, _q, _sc);
      mesh.setMatrixAt(counts[l.item]++, _m);
    }
  }
  for (const k of Object.keys(itemMeshes)) {
    itemMeshes[k].count = counts[k];
    itemMeshes[k].instanceMatrix.needsUpdate = true;
  }
}

/* ============================================================
   SOLVE + SPIN-UP
   ============================================================ */
/* A belt with physical space left will accept material at capacity. This is what
   makes a half-built line fill from the front instead of sitting dead: each machine
   works until its own output belt is full, then blocks, and the jam walks
   backwards. */
const roomy = (l) => beltHasRoom(l);

/* Re-solve because the belts filled up, not because the player changed anything.
   Keeps the schedule and the hold timer intact. */
let roomSig = '';
function resolveFlow() {
  const keep = links.map((l) => l.startT);
  const root = rootContext();
  result = solveNested({ entities: root.ents, links: root.links }, {}, { roomy });
  applyViewResults(result);
  links.forEach((l, i) => { l.startT = keep[i]; });
  buildAll();
  refreshQuotas();
}

/* The level is always what gets solved, even while the player is inside a factory:
   an interior only has real rates in the context of the instance feeding it. After
   solving the flattened hierarchy, the results belonging to the instance being
   viewed are copied onto the entities on screen. */
function rootContext() {
  return ctxStack.length ? ctxStack[0] : { ents, links };
}

function applyViewResults(res) {
  if (!res || !res.flat || !inFactory()) return;
  const chain = ctxStack.concat([ctx]).filter((c) => c && c.kind === 'factory');
  const prefix = chain.map((c) => c.ent.id).join('/') + '/';
  const byId = new Map(res.flat.entities.map((e) => [e.id, e]));
  for (const e of ents) {
    const fe = byId.get(prefix + e.id);
    if (!fe) { e.f = 0; e.state = 'idle'; continue; }
    e.f = fe.f; e.state = fe.state; e.avail = fe.avail; e.deficits = fe.deficits;
    e.accept = fe.accept; e.fIn = fe.fIn; e.isRootCause = fe.isRootCause; e.limitedBy = fe.limitedBy;
  }
  const linkById = new Map();
  for (const fl of res.flat.links) linkById.set(String(fl.id).replace(/^f\d+:/, ''), fl);
  for (const l of links) {
    const fl = linkById.get(prefix + l.id);
    if (!fl) { l.flow = 0; l.want = 0; l.drain = 0; continue; }
    l.flow = fl.flow; l.want = fl.want; l.drain = fl.drain; l.item = fl.item;
    l.potFlow = fl.potFlow; l.saturated = fl.saturated; l.overCapacity = fl.overCapacity;
  }
}

function resolve() {
  const prev = new Map(links.map((l) => [l.id, { flow: l.flow, startT: l.startT }]));
  const root = rootContext();
  result = solveNested({ entities: root.ents, links: root.links }, {}, { roomy });
  applyViewResults(result);
  repairInputSlots();
  scheduleSpinUp(prev);
  editT = clockT;
  /* When the last belt actually finishes filling, using the shifted schedule. A
     belt that was already running keeps its old start, so editing one corner of a
     factory no longer makes the player wait out a full cold start again. */
  spinUp = 0;
  for (const l of links) {
    if (!isFinite(l.startT) || (l.flow || 0) <= 1e-4) continue;
    spinUp = Math.max(spinUp, l.startT + l.length / BELT_SPEED - clockT);
  }
  deliveries = [];           /* the line must run undisturbed to count */
  buildAll();
  refreshQuotas();
  refreshHint();
  updateRuler();
}
function scheduleSpinUp(prev) {
  const inL = new Map(ents.map((e) => [e.id, []]));
  for (const l of links) if (inL.has(l.to)) inL.get(l.to).push(l);
  for (const e of ents) e.startT = MACHINES[e.type].kind === 'miner' ? 0.25 : Infinity;
  const T0 = clockT;
  for (const l of links) l.startT = Infinity;
  let changed = true, guard = 0;
  while (changed && guard++ < 200) {
    changed = false;
    for (const l of links) {
      const src = entById(l.from);
      if (src && src.startT < l.startT - 1e-6) { l.startT = src.startT; changed = true; }
    }
    for (const e of ents) {
      const ins = inL.get(e.id) || [];
      if (!ins.length) continue;
      let ready = 0;
      for (const l of ins) {
        if (l.startT === Infinity) { ready = Infinity; break; }
        ready = Math.max(ready, l.startT + l.length / BELT_SPEED);
      }
      const t = ready === Infinity ? Infinity : ready + 0.18;
      if (t < e.startT - 1e-6) { e.startT = t; changed = true; }
    }
  }
  spinUp = 0;
  for (const e of ents) if (isFinite(e.startT) && (e.f || 0) > 1e-4) spinUp = Math.max(spinUp, e.startT);
  for (const l of links) if (isFinite(l.startT) && (l.flow || 0) > 1e-4) spinUp = Math.max(spinUp, l.startT + l.length / BELT_SPEED);
  spinUp += 0.35;

  /* Shift the schedule onto the running clock. A belt that already existed and is
     still carrying the same rate keeps its original start, so it does not visibly
     restart every time something elsewhere is edited. */
  for (const e of ents) if (isFinite(e.startT)) e.startT += T0;
  for (const l of links) {
    if (!isFinite(l.startT)) continue;
    const was = prev && prev.get(l.id);
    const unchanged = was && isFinite(was.startT) && Math.abs((was.flow || 0) - (l.flow || 0)) < 1e-6
      && T0 >= was.startT + l.length / BELT_SPEED;
    l.startT = unchanged ? was.startT : l.startT + T0;
  }
}
const isLive = (e) => isFinite(e.startT) && clockT >= e.startT;
function buildAll() { buildMachines(); buildBelts(); }

function beltMetres() { let s = 0; for (const l of links) s += l.length; return s; }

function buildTray() {
  const el = $('#trayScroll');
  el.innerHTML = '';

    const def = MACHINES[type];
    for (const r of (def.recipes.length ? def.recipes : [null])) {
      const card = document.createElement('button');
      card.className = 'card' + (pickedType === type && (!r || pickedRecipe === r.id) ? ' on' : '');
      const ins = r && Object.keys(r.in).length ? Object.entries(r.in).map(([k, v]) => v + ' ' + ITEMS[k].short).join(' + ') : '—';
      const outs = r && Object.keys(r.out).length ? Object.entries(r.out).map(([k, v]) => v + ' ' + ITEMS[k].short).join(' + ') : 'pass through';

        + '<div class="cr">' + ins + '<br>&#8595; ' + outs + '</div>';

        buildTray();
      };

    }
  }
  /* inside a factory: the wall terminals that define its ports */
  if (inFactory()) {
    for (const [type, label, sub] of [['termIn', 'Input', 'port on a wall'], ['termOut', 'Output', 'port on a wall']]) {
      const card = document.createElement('button');

        + (type === 'termIn' ? '4d7a4f' : '7a4d4d') + '"></div>'
        + '<div class="cn">' + label + '</div><div class="cr">' + sub + '</div>';
      card.onclick = () => {
        if (pickedType === type) setTool('select');

  for (const d of library) {

    del.textContent = '\u00d7';

    del.onclick = (ev) => { ev.stopPropagation(); deleteDesign(d); };
    card.appendChild(del);
    el.appendChild(card);

    + '<div class="cn">+ Build factory</div><div class="cr">design it, then<br>place copies</div>';
  nb.onclick = () => editDesign(newDesign());

  /* Belts belong in the tray. Taking them out was a mistake: dragging from a machine
     works, but with no card and no tool nothing in the interface said belts existed, and
     an invisible gesture is the same as a missing feature. The card arms a tap-then-tap
     mode for players who never find the drag; the drag keeps working with no mode. */
  for (const t of L.belts) {
    const tier = BELTS.find((b) => b.id === t);

      + '<div class="cr">' + tier.cap + '/min<br>tap 2 machines</div>';

      if (tool === 'belt' && beltTier === t) setTool('select');
      else { beltTier = t; beltFrom = null; setTool('belt'); }
      buildTray();
    };
    el.appendChild(card);
  }
}
