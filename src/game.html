        const l = e.limitedBy;
        html += ' Traced to the ' + BELTS.find((b) => b.id === l.tier).name + ' belt carrying '
          + ITEMS[l.item].name + ' — caps at ' + l.cap + '/min, wants ' + fmt(l.potFlow || 0) + '.';
      }
      html += '</div>';
    } else if (e.isRootCause) {
      html += '<div class="why">This is the bottleneck. Its output belt is full.</div>';
    }
  } else if (r) {
    html += '<div class="row"><span>Takes</span><span>'
      + (Object.entries(r.in).map(([k, v]) => v + ' ' + ITEMS[k].short).join(' + ') || '—') + '/min</span></div>';
    html += '<div class="row"><span>Makes</span><span>'
      + (Object.entries(r.out).map(([k, v]) => v + ' ' + ITEMS[k].short).join(' + ') || '—') + '/min</span></div>';
  }
  html += '<div class="acts">';
  if (def.kind === 'factory') {
    html += '<button data-act="enter">Enter</button>';
    html += '<button data-act="save">Save to library</button>';
  }
  if (def.recipes.length > 1) html += '<button data-act="recipe">Change recipe</button>';
  if (def.kind !== 'sink') html += '<button data-act="del">Remove</button>';
  html += '</div>';
  box.innerHTML = html;
  box.style.display = 'block';
  box.querySelectorAll('button').forEach((b) => b.onclick = () => {
    if (b.dataset.act === 'close') { deselect(); return; }
    if (b.dataset.act === 'enter') { enterFactory(e); return; }
    if (b.dataset.act === 'save') {
      const copy = JSON.parse(JSON.stringify(e.def || { w: INTERIOR_W, h: INTERIOR_H, entities: [], links: [] }));
      copy.id = 'd' + (++libSeq);
      copy.name = (e.def && e.def.name) || 'Factory';
      library.push(copy);
      buildTray();
      toast('Saved. Place copies from the tray.');
      return;
    }
    if (b.dataset.act === 'del') { removeEntity(e); selected = null; showInspector(null); computeCrossings(); resolve(); }
    if (b.dataset.act === 'recipe') {
      const rs = def.recipes, i = rs.findIndex((x) => x.id === e.recipe);
      e.recipe = rs[(i + 1) % rs.length].id;
      /* input ports may have changed identity — drop links that no longer fit */
      dropWhere(links, (l) => {
        if (l.to !== e.id) return false;
        const P = portsOf(e);
        return (l.slotTo == null ? l.toPort : l.slotTo) >= P.in.length;
      });
      computeCrossings(); resolve(); showInspector(e);
    }
  });
}

function showBeltInspector(l) {
  const box = $('#insp');
  const tier = BELTS.find((b) => b.id === l.tier);
  let html = '<button class="inspClose" data-act="close">&times;</button>'
    + '<h4>Belt ' + tier.name + '</h4>'
    + '<div class="row"><span>Capacity</span><span>' + l.cap + '/min</span></div>'
    + '<div class="row"><span>Length</span><span>' + l.length.toFixed(1) + ' m</span></div>';
  if (l.bumps.length) html += '<div class="row"><span>Crossings</span><span>' + l.bumps.length + ' over</span></div>';
  const q = queuedOn(l);
  if (q) html += '<div class="row"><span>Queued</span><span>' + q + ' item' + (q === 1 ? '' : 's') + ' waiting</span></div>';
  {
    html += '<div class="row"><span>Carrying</span><span>' + (l.item ? ITEMS[l.item].short : '—') + '</span></div>'
      + '<div class="row"><span>Load</span><span>' + fmt(l.flow || 0) + ' / ' + l.cap + '</span></div>';
    if (l.overCapacity) html += '<div class="why">Wants ' + fmt(l.potFlow) + '/min. This belt is the bottleneck.</div>';
  }
  html += '<div class="acts">';
  for (const u of L.belts.filter((t) => t !== l.tier)) html += '<button data-tier="' + u + '">To ' + BELTS.find((b) => b.id === u).name + '</button>';
  html += '<button data-act="del">Remove</button></div>';
  box.innerHTML = html;
  box.style.display = 'block';
  box.querySelectorAll('button').forEach((b) => b.onclick = () => {
    if (b.dataset.act === 'close') { deselect(); return; }
    if (b.dataset.act === 'del') dropWhere(links, (x) => x === l);
    else { const t = +b.dataset.tier; l.tier = t; l.cap = BELTS.find((x) => x.id === t).cap; }
    selected = null; showInspector(null); computeCrossings(); resolve();
  });
}

const labelPool = [];
function updateLabels() {
  const host = $('#labels');
  host.classList.toggle('on', plannerOn);
  if (!plannerOn) return;
  let n = 0;
  const put = (x, y, z, text, cls) => {
    let el = labelPool[n];
    if (!el) { el = document.createElement('div'); el.className = 'tag'; host.appendChild(el); labelPool[n] = el; }
    const p = new THREE.Vector3(x, y, z).project(camera);
    el.style.left = ((p.x * 0.5 + 0.5) * innerWidth) + 'px';
    el.style.top = ((-p.y * 0.5 + 0.5) * innerHeight) + 'px';
    el.className = 'tag ' + (cls || '');
    el.innerHTML = text;
    el.style.display = 'block';
    n++;
  };
  for (const e of ents) {
    const def = MACHINES[e.type];
    if (def.kind === 'sink') continue;
    if (isLive(e) && def.kind !== 'splitter' && def.kind !== 'merger') {
      const pct = Math.round((e.f || 0) * 100);
      const cls = pct >= 100 ? 'ok' : (e.state === 'blocked' ? 'bad' : 'warn');
      let txt = '<b>' + pct + '%</b>';
      const d = Object.entries(e.deficits || {});
      if (d.length) txt += ' ' + d.map(([k, v]) => '&minus;' + fmt(v) + ' ' + ITEMS[k].short).join(' ');
      put(e.x, 1.2, e.z, txt, cls);
    }
  }
  for (const l of links) {
    const mid = l.path[Math.floor(l.path.length / 2)];
    if (!mid) continue;
    const cls = l.saturated && l.overCapacity ? 'bad' : (l.saturated ? 'warn' : '');
    put(mid.x, 0.8, mid.z, fmt(l.flow || 0) + ' / ' + l.cap, cls);
  }
  for (let i = n; i < labelPool.length; i++) labelPool[i].style.display = 'none';
}

/* ============================================================
   RUN
   ============================================================ */
/* The rate the design is capable of, which is what the ratios are about. */
function rateMet() {
  const got = (result && result.output) || {};
  return Object.entries(L.quota).every(([k, v]) => (got[k] || 0) >= v - 1e-4);
}

/* A stream at R items per minute puts at least floor(R * W / 60) items through any
   window of W seconds, so that is what the depot has to show. Never rounds up:
   asking for more than the quota implies would fail a correct factory. */
const neededIn = (rate) => Math.max(1, Math.floor(rate * DELIVER_WINDOW / 60));

function deliveryProgress() {
  const cut = clockT - DELIVER_WINDOW;
  while (deliveries.length && deliveries[0].t < cut) deliveries.shift();
  const counts = {};
  for (const d of deliveries) counts[d.item] = (counts[d.item] || 0) + 1;
  let worst = null;
  let ok = true;
  for (const [item, rate] of Object.entries(L.quota)) {
    const need = neededIn(rate), have = counts[item] || 0;
    if (have < need) ok = false;
    const frac = have / need;
    if (!worst || frac < worst.frac) worst = { item, have, need, frac };
  }
  return { ok, worst };
}

function quotaMet() { return rateMet(); }

function showReport(met) {
  const sc = score({ entities: ents, links }, result);
  const rows = [
    ['Machines', sc.machines, L.par.machines, 'fewer is better'],
    ['Belt', +beltMetres().toFixed(1), L.par.belt, 'metres painted — short, clean runs win'],
    ['Ore', Math.round(sc.ore), L.par.ore, 'raw ore per minute'],
  ];
  let html = '<h3>' + (met ? 'Quota met' : 'Quota not met') + '</h3>'
    + '<div class="sub">' + L.name + ' · quota delivered over ' + DELIVER_WINDOW + 's</div>';
  if (!met) {
    const got = result.output || {};
    html += '<div class="sub">Output: ' + Object.entries(L.quota)
      .map(([k, v]) => fmt(got[k] || 0) + ' of ' + v + ' ' + ITEMS[k].short).join(' · ') + '</div>';
    const bn = result.bottlenecks[0];
    if (bn) html += '<div class="sub">The ' + BELTS.find((b) => b.id === bn.tier).name + ' belt carrying '
      + ITEMS[bn.item].name + ' is the bottleneck: ' + bn.cap + '/min cap, ' + fmt(bn.potFlow) + '/min wanted.</div>';
    else html += '<div class="sub">Turn on the planner to see which machines are short.</div>';
  } else {
    for (const [name, val, par, cap] of rows) {
      const worst = Math.max(val, par) * 1.6 || 1;
      html += '<div class="metric"><div class="top"><span>' + name + '</span><span>' + val
        + '<span style="color:#6d7570"> · target ' + par + '</span></span></div>'
        + '<div class="track"><div class="fill" style="width:' + (100 * val / worst) + '%;'
        + (val <= par ? 'background:#2f9e6f' : '') + '"></div>'
        + '<div class="par" style="left:' + (100 * par / worst) + '%"></div></div>'
        + '<div class="cap">' + cap + '</div></div>';
    }
  }
  html += '<div class="acts">'
    + (met && lvIndex < LEVELS.length - 1 ? '<button data-a="next">Next level</button>' : '')
    + '<button class="ghost" data-a="back">Keep tinkering</button></div>';
  const card = $('#rcard');
  card.innerHTML = html;
  card.querySelectorAll('button').forEach((b) => b.onclick = () => {
    $('#report').style.display = 'none';
    if (b.dataset.a === 'next') loadLevel(lvIndex + 1);
  });
  $('#report').style.display = 'flex';
}

/* ============================================================
   INPUT
   ============================================================ */
const pointers = new Map();
/* panStart and zoomStart are deliberately separate. They used to be one variable
   holding either a Vector3 or a number depending on the gesture; a third finger
   landing during a pinch assigned the Vector3 while the pinch was still active,
   and Vector3 * number is NaN. That poisoned the zoom permanently and left the
   camera frustum non-finite, so nothing rendered but the sky. */
let dragMode = null, dragStart = null, pinchStart = 0, moved = 0, pinched = false, grabbed = null;
let panStart = new THREE.Vector3(), zoomStart = 0, pinchAngle = 0, yawStart = 0;

/* Every gesture is measured against a baseline: pinch against a starting finger
   distance, pan against a starting touch point. When the number of fingers
   changes mid-gesture those baselines are stale, and using them applies the whole
   accumulated delta in one jump — a pinch that pans wildly the moment a finger
   lifts. Re-baseline on every change instead. */
function rebaseGesture() {
  const p = [...pointers.values()];
  if (p.length >= 2) {
    pinchStart = Math.max(1, Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y));
    zoomStart = zoom;
    dragMode = 'pinch';
    pinched = true;
  } else if (p.length === 1) {
    /* keep panning from where the remaining finger is now, the way a map does */
    dragStart = { x: p[0].x, y: p[0].y };
    panStart.copy(camCenter);
    moved = 0;
    dragMode = 'maybe';
  } else {
    dragMode = null;
    pinched = false;
    /* leaving a pinch: settle the view on a right angle */
    yawTarget = Math.round(yaw / (Math.PI / 2)) * (Math.PI / 2);
  }
}

let zoomMin = 8, zoomMax = 80;
function setZoom(v) {
  if (!Number.isFinite(v)) return;          /* never let NaN reach the camera */
  zoom = Math.max(zoomMin, Math.min(zoomMax, v));
  layoutCamera();
}
/* last-resort recovery: if the frustum is ever non-finite the view is dead and
   cannot fix itself, so snap back to a sane framing */
function cameraIsSane() {
  return Number.isFinite(camera.left) && Number.isFinite(camera.right)
    && Number.isFinite(camera.top) && Number.isFinite(camera.bottom)
    && Number.isFinite(camCenter.x) && Number.isFinite(camCenter.z);
}
function resetView() {
  zoom = L ? Math.max(L.w, L.h) * 1.5 : 24;
  camCenter.set(L ? L.w / 2 : 8, 0, L ? L.h / 2 : 8);
  layoutCamera();
}

/* At an oblique angle the visible top of a tall machine sits well behind its
   footprint on the ground, so a ground-plane raycast misses it. Pick against the
   machine meshes instead. Placement still uses the ground, because there the
   player is indicating a position rather than an object. */
function machineAtScreen(cx, cy) {
  raycaster.setFromCamera(new THREE.Vector2((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1), camera);
  const hits = raycaster.intersectObjects(gMachines.children, true);
  for (const hit of hits) {
    let o = hit.object;
    while (o && !(o.userData && o.userData.ent)) o = o.parent;
    if (o && o.userData.ent) return o.userData.ent;
  }
  return null;
}

function groundAt(cx, cy) {
  raycaster.setFromCamera(new THREE.Vector2((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1), camera);
  const hit = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(groundPlane, hit)) return null;
  return { x: hit.x, z: hit.z };
}

const cv = renderer.domElement;
cv.addEventListener('pointerdown', (ev) => {
  cv.setPointerCapture(ev.pointerId);
  pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  moved = 0;
  if (pointers.size >= 2) {
    rebaseGesture();
    {
      const pp = [...pointers.values()];
      pinchAngle = Math.atan2(pp[1].y - pp[0].y, pp[1].x - pp[0].x);
      yawStart = yaw;
    }
    stroke = null; clear(gGhost);
    return;
  }
  dragStart = { x: ev.clientX, y: ev.clientY };
  panStart.copy(camCenter);

  const g = groundAt(ev.clientX, ev.clientY);

  /* Placing follows the finger and commits on lift, so the player sees exactly where
     a machine will land — and where its ports will be — before letting go. Touch has
     no hover, so a preview that only appeared on mouse-move was useless on a phone. */
  if (tool === 'place' && pickedType && g) {
    dragMode = 'ghost';
    ghostAt(ev.clientX, ev.clientY);
    return;
  }

  /* Painting a belt is a drag that starts on a machine; selecting is a tap on one.
     Those are already different gestures, so the Select / Paint belt / Erase modes
     were pure overhead — three buttons to express something the hand already says.
     The stroke starts speculatively and is discarded on lift if the finger never
     moved, which is what makes the same press serve both purposes. */
  grabbed = null;
  if (g) {
    const picked = machineAtScreen(ev.clientX, ev.clientY) || entAt(g);
    if (picked && freeOutPort(picked) >= 0) {
      stroke = { fromEnt: picked, fromPort: freeOutPort(picked), pts: [] };
      dragMode = 'paint';
      return;
    }
    /* remember it, so a drag that pans instead of painting can explain itself */
    if (picked && MACHINES[picked.type].kind !== 'sink') grabbed = picked;
  }
  dragMode = 'maybe';
});

cv.addEventListener('pointermove', (ev) => {
  if (!pointers.has(ev.pointerId)) {
    if (tool === 'place' && pickedType) ghostAt(ev.clientX, ev.clientY);
    return;
  }
  pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (dragMode === 'pinch') {
    if (pointers.size < 2) return;        /* wait for a second finger again */
    const p = [...pointers.values()];
    const d = Math.max(1, Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y));
    setZoom(zoomStart * (pinchStart / d));
    /* Twisting turns the view, which retires the Rotate view button. It snaps to a
       right angle on release, so an accidental twist during a pinch costs nothing. */
    const ang = Math.atan2(p[1].y - p[0].y, p[1].x - p[0].x);
    yaw = yawStart - (ang - pinchAngle);
    yawTarget = yaw;
    return;
  }
  const dx = ev.clientX - dragStart.x, dy = ev.clientY - dragStart.y;
  moved = Math.max(moved, Math.hypot(dx, dy));

  if (dragMode === 'ghost') {
    ghostAt(ev.clientX, ev.clientY);
    return;
  }
  if (dragMode === 'paint' && stroke) {
    const g = groundAt(ev.clientX, ev.clientY);
    if (!g) return;
    const last = stroke.pts[stroke.pts.length - 1];
    if (!last || dist2(last, g) > STROKE_MIN_STEP * STROKE_MIN_STEP) stroke.pts.push(g);
    drawStrokePreview();
    return;
  }
  if (moved > 9) dragMode = 'pan';
  if (dragMode === 'pan') {
    const scale = zoom / innerHeight;
    /* A ground step along the view's depth axis projects onto the screen vertical
       by sin(pitch), so that is the divisor. This used to be cos(pitch), which
       made vertical panning 1.6x too fast at the old 58 degrees. */
    const rx = -dx * scale, rz = -dy * scale / Math.sin(pitch);
    const s = Math.sin(yaw), c = Math.cos(yaw);
    /* keep the plot within reach: panning into empty terrain is disorienting and
       there is nothing out there to look at */
    const m = 14;
    camCenter.set(
      Math.max(-m, Math.min((L ? L.w : 16) + m, panStart.x + rx * c + rz * s)), 0,
      Math.max(-m, Math.min((L ? L.h : 16) + m, panStart.z - rx * s + rz * c)));
  }
});

cv.addEventListener('pointerup', (ev) => {
  /* a pinch must never end up counting as a tap: re-baselining resets `moved`, so
     without this flag lifting the last finger would place a machine */
  const wasTap = !pinched && moved < 9 && pointers.size === 1 && dragMode !== 'pinch';
  const placing = dragMode === 'ghost';
  const painting = dragMode === 'paint' && stroke;
  const g = groundAt(ev.clientX, ev.clientY);
  pointers.delete(ev.pointerId);
  if (painting) {
    clear(gGhost);
    if (moved < 9) {
      /* Never moved, so it was a tap. Hand it to handleTap rather than deciding here:
         a tap means "select" normally but "pick the source" while the Belt card is
         armed, and duplicating that choice in two places is how they drift apart. */
      stroke = null;
      if (g) handleTap(g, ev.clientX, ev.clientY);
      rebaseGesture();
      return;
    }
    if (stroke.pts.length >= 1 && g) commitStroke(stroke.pts, g, machineAtScreen(ev.clientX, ev.clientY));
    else toast('Drag from a machine to another machine to lay a belt.');
    stroke = null;
    if (!pointers.size) { dragMode = null; pinched = false; }
    return;
  }
  if (placing) {
    clear(gGhost);
    if (g) placeAt(g);
    rebaseGesture();
    return;
  }
  if (wasTap && g) handleTap(g, ev.clientX, ev.clientY);
  else if (grabbed && moved > 24) {
    /* dragged off a machine that had nowhere to send anything: without this the
       gesture silently pans and looks broken */
    toast(MACHINES[grabbed.type].name + "'s output is already in use \u2014 add a Splitter to branch it.");
    grabbed = null;
  }
  rebaseGesture();
});
cv.addEventListener('pointercancel', (ev) => {
  pointers.delete(ev.pointerId);
  stroke = null; clear(gGhost);
  rebaseGesture();
});
/* a finger that leaves the surface without a pointerup would otherwise linger in
   the map forever and make every later single touch look like a pinch */
addEventListener('blur', () => { pointers.clear(); stroke = null; rebaseGesture(); });
cv.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  setZoom(zoom * (1 + Math.sign(ev.deltaY) * 0.09));
}, { passive: false });

function drawStrokePreview() {
  clear(gGhost);
  const a = stroke.fromEnt;
  const start = portsOf(a).out[stroke.fromPort];
  /* preview the orthogonal route, so what is shown is what lands */
  const target = entAt(stroke.pts[stroke.pts.length - 1] || start);
  let pts;
  if (target && target !== a) {
    const ip = freeInPort(target, outItemOf(a));
    pts = ip >= 0 ? buildOrthoPath(stroke.pts, a, stroke.fromPort, target, ip) : null;
  }
  if (!pts) {
    const na = portNormal(a, start);
    const stubA = { x: start.x + na.x * PORT_STUB, z: start.z + na.z * PORT_STUB };
    const mid = simplify(stroke.pts.filter((p) => dist2(p, stubA) > 0.6 * 0.6), Math.max(SIMPLIFY_EPS, 0.5));
    pts = resample(filletCorners(rectilinear(mergeCollinear([start, stubA].concat(mid)), stroke.pts), MIN_RADIUS), RESAMPLE);
  }
  if (!pts || pts.length < 2) return;
  const bad = routeBlocked(pts, a, entAt(pts[pts.length - 1]));
  const fake = { path: pts, arc: arcTable(pts), tier: beltTier, bumps: [] };
  const g = ribbon([fake], (l, c) => c.setHex(bad ? 0xc2402f : 0x2f9e6f));
  if (g) gGhost.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.55, side: THREE.DoubleSide })));
}

/* Terminals belong on a wall, so a tap anywhere snaps to the nearest one and slides
   along it. Rotation is implied by which wall it lands on. */
function snapToWall(x, z, type) {
  const def = MACHINES[type] || MACHINES.termIn;
  const depth = def.h / 2;          /* how far the body reaches in from the wall */
  const along = def.w / 2;
  const dN = z, dS = L.h - z, dW = x, dE = L.w - x;
  const m = Math.min(dN, dS, dW, dE);
  /* snap along the wall, so a row of terminals lines up */
  const snapAlong = (v, half) => Math.round(v - half) + half;
  const clampX = Math.max(along, Math.min(L.w - along, snapAlong(x, along)));
  const clampZ = Math.max(along, Math.min(L.h - along, snapAlong(z, along)));
  if (m === dN) return { wall: 'n', x: clampX, z: depth, rot: 0 };
  if (m === dS) return { wall: 's', x: clampX, z: L.h - depth, rot: 2 };
  if (m === dW) return { wall: 'w', x: depth, z: clampZ, rot: 1 };
  return { wall: 'e', x: L.w - depth, z: clampZ, rot: 3 };
}

/* Align to the metre grid by snapping the footprint EDGES rather than the centre: a
   2 m machine and a 3 m one then still line up, which snapping the centre would not
   achieve. The grid is invisible — it exists to make neat rows easy, not to be obeyed. */
function snapPlacement(type, x, z, rot) {
  const b = boxOf({ type, x, z, rot });
  return { x: Math.round(x - b.ex) + b.ex, z: Math.round(z - b.ez) + b.ez };
}

/* Placing returns to the neutral state. Leaving the tool armed meant every drag after
   a placement laid another blueprint instead of moving the camera, which reads as the
   view being stuck. One extra tap to place a second machine is the cheaper cost. */
function afterPlace() {
  selected = null;
  showInspector(null);
  setTool('select');
  buildTray();
}

/* Once a belt's contents are known, record the matching slot so the inspector and any
   later port arithmetic agree with what is actually being delivered. */
function repairInputSlots() {
  for (const l of links) {
    const dest = entById(l.to);
    if (!dest) continue;
    const P = portsOf(dest);
    if (!P.inItems || !P.inItems.some((x) => x != null)) continue;
    const it = l.item || outItemOf(entById(l.from));
    if (!it) continue;
    const i = P.inItems.indexOf(it);
    if (i >= 0) { l.toPort = i; l.slotTo = i; }
  }
}

/* Lay a belt from two taps by synthesising the stroke a drag would have produced, so
   both routes end in exactly the same routing and validation code. */
function connectByTap(a, b) {
  const item = outItemOf(a);
  const pe = portError(a, b, item);
  if (pe) { toast(pe); return false; }
  const aPort = freeOutPort(a), bPort = freeInPort(b, item);
  if (aPort < 0 || bPort < 0) { toast('No free port for that.'); return false; }
  const E0 = beltEnds(a, aPort, b, bPort, null);
  const raw = [];
  for (let t = 0; t <= 1.0001; t += 0.1) {
    raw.push({ x: E0.pa.x + (E0.pb.x - E0.pa.x) * t, z: E0.pa.z + (E0.pb.z - E0.pa.z) * t });
  }
  const before = links.length;
  stroke = { fromEnt: a, fromPort: aPort, pts: raw };
  commitStroke(raw, E0.pb, b);
  stroke = null;
  return links.length > before;
}

function placeAt(g) {
  if (!pickedType || !MACHINES[pickedType]) return;   /* nothing armed */
  if (pickedType === 'termIn' || pickedType === 'termOut') {
    if (!inFactory()) return toast('Terminals only go inside a factory.');
    const s = snapToWall(g.x, g.z, pickedType);
    const err = canPlace(pickedType, s.x, s.z, s.rot);
    if (err) return toast(err);
    const e = addEntity(pickedType, s.x, s.z, s.rot);
    e.wall = s.wall;
    const kin = ents.filter((o) => o.type === pickedType);
    e.index = kin.reduce((mx, o) => Math.max(mx, o === e ? -1 : (o.index == null ? -1 : o.index)), -1) + 1;
    const label = pickedType === 'termIn' ? 'Input' : 'Output';
    resolve();
    afterPlace();
    toast(label + ' port added to this factory');
    return;
  }
  if (pickedType === 'factory') {
    const sf = snapPlacement('factory', g.x, g.z, pickedRot);
    const err = canPlace('factory', sf.x, sf.z, pickedRot);
    if (err) return toast(err);
    const e = addEntity('factory', sf.x, sf.z, pickedRot);
    /* an independent copy, so editing this box changes only this box */
    e.def = pickedDesign ? JSON.parse(JSON.stringify(pickedDesign)) : { w: INTERIOR_W, h: INTERIOR_H, entities: [], links: [], seq: 0 };
    e.def.name = (pickedDesign && pickedDesign.name) || 'Factory';
    resolve();
    afterPlace();
    return;
  }
  const sp = snapPlacement(pickedType, g.x, g.z, pickedRot);
  const err = canPlace(pickedType, sp.x, sp.z, pickedRot);
  if (err) return toast(err);
  const e = addEntity(pickedType, sp.x, sp.z, pickedRot);
  if (pickedRecipe) e.recipe = pickedRecipe;
  resolve();
  afterPlace();
}

function handleTap(g, cx, cy) {
  if (tool === 'place' && pickedType) { placeAt(g); return; }

  if (tool === 'belt') {
    const e = machineAtScreen(cx, cy) || entAt(g);
    if (!e) { toast('Tap a machine to start the belt.'); return; }
    if (!beltFrom) {
      if (freeOutPort(e) < 0) return toast(MACHINES[e.type].name + ' has no free output port.');
      beltFrom = e;
      selected = e; buildMachines(); showInspector(null);
      toast('Now tap where it should go.');
      return;
    }
    if (e === beltFrom) { beltFrom = null; deselect(); return; }
    const made = connectByTap(beltFrom, e);
    beltFrom = null;
    deselect();
    if (made) { setTool('select'); buildTray(); }
    return;
  }

  const e = machineAtScreen(cx, cy) || entAt(g);
  if (e) { selected = e; buildMachines(); showInspector(e); refreshRotate(); return; }
  const l = beltAt(g);
  if (l) { selected = null; buildMachines(); showBeltInspector(l); return; }
  deselect();
}

function ghostAt(cx, cy) {
  clear(gGhost);
  let g = groundAt(cx, cy);
  if (!g || !pickedType) return;
  let rot = pickedRot;
  if ((pickedType === 'termIn' || pickedType === 'termOut') && inFactory()) {
    const s = snapToWall(g.x, g.z, pickedType);
    g = { x: s.x, z: s.z };
    rot = s.rot;
  } else {
    g = snapPlacement(pickedType, g.x, g.z, rot);   /* preview where it will land */
  }
  const err = canPlace(pickedType, g.x, g.z, rot);
  const probe = { type: pickedType, x: g.x, z: g.z, rot, recipe: pickedRecipe, def: pickedDesign };
  const def = MACHINES[pickedType];
  const ok = !err;
  const tint = ok ? 0x2f9e6f : 0xc2402f;

  const grp = new THREE.Group();
  grp.position.set(g.x, 0, g.z);
  grp.rotation.y = machineYaw(probe);

  /* translucent volume plus a footprint outline: reads as a blueprint rather than a
     solid object that is already there */
  const body = new THREE.Mesh(new THREE.BoxGeometry(def.w, 0.55, def.h),
    new THREE.MeshBasicMaterial({ color: tint, transparent: true, opacity: 0.2 }));
  body.position.y = 0.28;
  grp.add(body);
  const hx = def.w / 2, hz = def.h / 2;
  const outline = [-hx, 0.03, -hz, hx, 0.03, -hz, hx, 0.03, hz, -hx, 0.03, hz, -hx, 0.03, -hz];
  const og = new THREE.BufferGeometry();
  og.setAttribute('position', new THREE.Float32BufferAttribute(outline, 3));
  grp.add(new THREE.Line(og, new THREE.LineBasicMaterial({ color: ok ? 0x1b5b41 : 0x7d2318 })));

  /* the ports, because they are what the player is actually aiming. Belts snap to
     these exact points, so their positions decide whether a spot works. */
  const P = localPorts(probe);
  for (const p of P.out) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.2, 0.3),
      new THREE.MeshBasicMaterial({ color: 0x1b2124 }));
    m.position.set(p.x, 0.3, p.z);
    grp.add(m);
    const arrow = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.32, 4),
      new THREE.MeshBasicMaterial({ color: 0x1b2124 }));
    arrow.position.set(p.x, 0.3, p.z + 0.34);
    arrow.rotation.x = -Math.PI / 2;
    grp.add(arrow);
  }
  P.in.forEach((p, i) => {
    const item = P.inItems[i];
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.18, 0.28),
      new THREE.MeshBasicMaterial({ color: item ? ITEMS[item].color : 0xf0eee5 }));
    m.position.set(p.x, 0.28, p.z);
    grp.add(m);
  });
  gGhost.add(grp);
}

$('#lvName').onclick = toggleMenu;
$('#hold').onclick = () => showReport(rateMet());
$('#rotBtn').onclick = () => {
  if (selected && MACHINES[selected.type].kind !== 'sink') {
    const old = selected.rot;
    selected.rot = (selected.rot + 1) % 4;
    const err = canPlace(selected.type, selected.x, selected.z, selected.rot, selected);
    if (err) { selected.rot = old; return toast('No room to turn that.'); }
    dropWhere(links, (l) => l.from === selected.id || l.to === selected.id);
    computeCrossings(); resolve();
    toast('Turned. Belts on that machine were removed.');
  } else {
    pickedRot = (pickedRot + 1) % 4;
    toast('Placing at ' + (pickedRot * 90) + '°');
  }
};
$('#plannerBtn').onclick = () => {
  plannerOn = !plannerOn;
  $('#plannerBtn').classList.toggle('on', plannerOn);
  $('#plannerBtn').textContent = plannerOn ? 'Hide rates' : 'Show rates';
};

addEventListener('resize', layoutCamera);
addEventListener('keydown', (ev) => {
  if (ev.key !== 'Escape') return;
  closeMenu();
  if (tool === 'place' || tool === 'belt') { setTool('select'); buildTray(); deselect(); }
  else deselect();
});

/* ============================================================
   FACTORIES: build, enter, exit
   ============================================================ */
function newDesign(name) {
  const d = { id: 'd' + (++libSeq), name: name || ('Factory ' + (library.length + 1)),
              w: INTERIOR_W, h: INTERIOR_H, entities: [], links: [], seq: 0 };
  library.push(d);
  return d;
}

/* Designs are independent of the boxes already placed from them, so deleting one
   only removes it from the tray. Anything already built keeps working. */
function deleteDesign(d) {
  /* if we are inside it, come out first */
  while (ctxStack.length && ctx && ctx.design === d) exitContext();
  const i = library.indexOf(d);
  if (i >= 0) library.splice(i, 1);
  if (pickedDesign === d) { pickedDesign = null; pickedType = null; setTool('select'); }
  buildTray();
  toast('Design deleted. Factories already placed are unaffected.');
}

function pushContext(c) {
  ctxStack.push(ctx);
  ctx = c;
  ents = c.ents; links = c.links;
  L = { w: c.w, h: c.h, nodes: [], rocks: [], depot: null,
        quota: (ctxStack[0] && ctxStack[0].quota) || {}, belts: c.belts, tech: c.tech,
        name: c.name, hint: c.hint, id: c.id, par: { machines: 0, belt: 0, ore: 0 } };
  selected = null; stroke = null;
  showInspector(null);
  camCenter.set(c.w / 2, 0, c.h / 2);
  zoomMax = Math.max(c.w, c.h) * 2.4;
  zoom = Math.max(c.w, c.h) * 1.5;
  layoutCamera();
  buildPad(); buildTray(); buildItemPools();
  setTool('select');
  resolve();
  refreshCrumbs();
}

function enterFactory(e) {
  if (!e.def) e.def = { w: INTERIOR_W, h: INTERIOR_H, entities: [], links: [], seq: 0 };
  pushContext({
    kind: 'factory', ent: e, design: e.def,
    ents: e.def.entities, links: e.def.links,
    w: e.def.w || INTERIOR_W, h: e.def.h || INTERIOR_H,
    belts: ctx.belts, tech: ctx.tech, name: e.def.name || 'Factory interior',
    hint: 'Place Input and Output on the walls, then wire them up. Ports appear outside.',
    id: 'inside',
  });
}

function editDesign(d) {
  pushContext({
    kind: 'factory', ent: { id: 'design:' + d.id, def: d }, design: d,
    ents: d.entities, links: d.links, w: d.w, h: d.h,
    belts: ctx.belts, tech: ctx.tech, name: d.name,
    hint: 'Designing. Place Input and Output on the walls, then place this factory in the level.',
    id: 'design',
  });
}

function exitContext() {
  if (!ctxStack.length) return;
  const parent = ctxStack.pop();
  ctx = parent;
  ents = parent.ents; links = parent.links;
  if (parent.kind === 'level') {
    L = LEVELS[lvIndex];
  } else {
    L = { w: parent.w, h: parent.h, nodes: [], rocks: [], depot: null,
          quota: {}, belts: parent.belts, tech: parent.tech, name: parent.name,
          hint: parent.hint, id: parent.id, par: { machines: 0, belt: 0, ore: 0 } };
  }
  selected = null; stroke = null;
  showInspector(null);
  camCenter.set(L.w / 2, 0, L.h / 2);
  zoomMax = Math.max(L.w, L.h) * 2.4;
  zoom = Math.max(L.w, L.h) * 1.5;
  layoutCamera();
  buildPad(); buildTray(); buildItemPools();
  setTool('select');
  resolve();
  refreshCrumbs();
}

function refreshCrumbs() {
  const el = $('#crumbs');
  const parts = [];
  const all = ctxStack.concat([ctx]).filter(Boolean);
  all.forEach((c, i) => {
    parts.push('<button data-up="' + (all.length - 1 - i) + '">'
      + (c.kind === 'level' ? 'Level ' + (lvIndex + 1) : (c.name || 'Factory')) + '</button>');
  });
  el.innerHTML = parts.join('<span>&rsaquo;</span>');
  el.style.display = all.length > 1 ? 'flex' : 'none';
  el.querySelectorAll('button').forEach((b) => b.onclick = () => {
    let up = +b.dataset.up;
    while (up-- > 0) exitContext();
  });
}

/* ============================================================
   LEVEL LOAD
   ============================================================ */
function loadLevel(i) {
  lvIndex = Math.max(0, Math.min(LEVELS.length - 1, i));
  L = LEVELS[lvIndex];
  ents = []; links = []; nextId = 1;
  selected = null; stroke = null; result = null;
  plannerOn = false;
  clockT = 0; editT = 0; deliveries = []; reported = !!solved[L.id];
  $('#plannerBtn').classList.remove('on');
  $('#report').style.display = 'none';
  showInspector(null);

  addEntity('sink', L.depot.x, L.depot.z, 2);
  beltTier = L.belts[0];
  ctxStack.length = 0;
  ctx = { kind: 'level', ents, links, w: L.w, h: L.h, belts: L.belts, tech: L.tech,
          name: L.name, hint: L.hint, id: L.id, quota: L.quota };
  camCenter.set(L.w / 2, 0, L.h / 2);
  zoomMin = 7;
  zoomMax = Math.max(L.w, L.h) * 2.4;   /* stays within the terrain we actually built */
  zoom = Math.max(L.w, L.h) * 1.5;
  yaw = yawTarget = 0;
  layoutCamera();

  $('#lvName').textContent = (lvIndex + 1) + '. ' + L.name;
  $('#lvHint').textContent = L.hint;
  buildPad(); buildTray(); buildLevelBar(); buildItemPools();
  setTool('select');
  resolve();
  refreshCrumbs();
  $('#menu').style.top = ($('#docket').offsetHeight + 6) + 'px';
  $('#crumbs').style.top = ($('#docket').offsetHeight + 8) + 'px';
}

/* ============================================================
   LOOP
   ============================================================ */
/* ---- moving parts ----
   Design doc §11: a machine should animate so 100% vs 60% is felt, not only read.
   Speed is proportional to the machine's actual rate, so a starved machine
   visibly labours. */
function animateMachines(t) {
  for (const g of gMachines.children) {
    const e = g.userData.ent;
    const a = g.userData.anim;
    if (!e || !a) continue;
    const f = isLive(e) ? (e.f || 0) : 0;
    if (a.drum) a.drum.rotation.x = t * f * 5.5;
    if (a.press) a.press.position.y = 1.05 - (f > 0 ? Math.abs(Math.sin(t * f * 3.4)) * 0.3 : 0);
    if (a.arms) a.arms.forEach((arm, i) => {
      arm.rotation.y = Math.sin(t * f * 2.6 + i * Math.PI) * (0.5 + 0.35 * f);
    });
    if (a.glow) {
      const heat = f > 0 ? 0.35 + 0.65 * Math.abs(Math.sin(t * 2.2)) * f : 0;
      a.glow.material.color.setRGB(0.16 + heat * 0.84, 0.10 + heat * 0.42, 0.07 + heat * 0.05);
    }
    if (a.hints) {
      /* a slow bob, enough to read as "start here" without becoming noise */
      const bob = Math.sin(t * 2.1) * 0.07;
      for (const arrow of a.hints) {
        arrow.position.y = 0.78 + bob;
        arrow.material.opacity = 0.55 + 0.3 * (0.5 + 0.5 * Math.sin(t * 2.1));
      }
    }
    if (a.puff) {
      if (f <= 0.001) { a.puff.visible = false; }
      else {
        a.puff.visible = true;
        const cyc = (t * (0.35 + f * 0.55)) % 1;
        a.puff.position.y = 2.15 + cyc * 1.5;
        a.puff.scale.setScalar(0.5 + cyc * 1.5);
        a.puff.material.opacity = 0.45 * (1 - cyc) * f;
      }
    }
  }
}

let last = performance.now();
function frame(now) {
  /* Clamped at both ends. A timestamp that goes backwards would drive clockT
     negative and stall every belt, and a long pause between frames should not
     teleport the simulation forward. */
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
  last = now;
  if (Math.abs(yawTarget - yaw) > 1e-4) yaw += (yawTarget - yaw) * Math.min(1, dt * 9);
  if (Math.abs(pitchTarget - pitch) > 1e-4) pitch += (pitchTarget - pitch) * Math.min(1, dt * 8);
  if (!cameraIsSane()) { resetView(); toast('View reset.'); }
  placeCamera();
  clockT += dt;

  /* Verification is just the factory continuing to work. Once the pipeline has
     physically filled, holding quota for HOLD_REQUIRED seconds completes the
     level; breaking it resets the timer. */
  /* When a belt fills or drains the flow picture changes, so re-solve — but only on
     the transition, not every frame. */
  advanceBelts(dt);
  const sig = links.map((l) => (roomy(l) ? '1' : '0')).join('');
  if (sig !== roomSig) { roomSig = sig; resolveFlow(); }

  /* Two conditions, both plainly true or not. The design must be capable of the
     rate, and the depot must actually have received a window's worth. The rate
     check also stops a jammed belt draining in a burst from passing a factory
     whose sustained output is short. */
  const met = rateMet();
  const prog = deliveryProgress();
  updateHold(met, prog);
  if (met && prog.ok && !reported) {
    reported = true;
    solved[L.id] = true;
    buildLevelBar();
    refreshQuotas();
    showReport(true);
  }

  /* The surface must scroll at exactly the speed items travel, or the belt looks
     like it is slipping under its own cargo. One period of texture is
     BELT_TEX_PERIOD metres, so offset advances BELT_SPEED / period per second. */
  BELT_TEX.offset.x = -(clockT * BELT_SPEED) / BELT_TEX_PERIOD;
  animateMachines(clockT);
  updateItems(clockT);
  updateLabels();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

layoutCamera();
loadLevel(0);
requestAnimationFrame(frame);
</script>
</body>
